name: docs

# The schedule below is not about catching content changes — those arrive on
# push. It exists because this workflow can break WITHOUT a push: a new
# mkdocs/Material release, a plugin bump, or an external link going stale can
# turn `--strict` red on a tree nobody touched. Between 2026-05-23 and
# 2026-07-27 the build failed on two links and, because `deploy` is
# `needs: build`, the site silently stopped redeploying for 65 days. Nothing
# was watching. Now a weekly run plus a rolling failure issue is.

on:
  schedule:
    - cron: '0 5 * * 1'    # Mondays 05:00 UTC
  workflow_dispatch: {}
  push:
    branches: [main]
    paths:
      - 'full-guide/**'
      - 'mkdocs.yml'
      - 'requirements.txt'
      - '.github/workflows/docs.yml'
      - '.github/scripts/**'
  pull_request:
    branches: [main]
    paths:
      - 'full-guide/**'
      - 'mkdocs.yml'
      - 'requirements.txt'
      - '.github/workflows/docs.yml'
      - '.github/scripts/**'

# Workflow-level default is read-only. Each job is granted only what it
# needs: `build` runs PR content (markdown, mkdocs plugins, the mermaid
# validator's npm dependencies) and gets no write scope at all; only
# `deploy`, which runs on main and never checks out code, can write Pages
# and mint an OIDC token; only `rolling-failure-issue` can write issues.
permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      # Validate every ```mermaid block actually parses under the same parser
      # version production renders with (10.9.1). mkdocs build does NOT catch
      # mermaid syntax errors — they only show up in the reader's browser as
      # "Syntax error in text". Failing fast here keeps broken diagrams from
      # ever being deployed.
      # Node 24 LTS. Node 20 reached end-of-life on 2026-04-30.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
      - name: Validate mermaid diagrams
        # Dependencies come from .github/scripts/package-lock.json, not from
        # whatever `npm install jsdom` resolves on the day: `npm ci` installs
        # exactly the locked tree and fails if package.json and the lock
        # disagree. --ignore-scripts because this job runs PR content and
        # no package in the tree needs an install script. ESM bare-import
        # resolution walks up from the script file, so node_modules next to
        # the script is found first.
        run: |
          npm ci --ignore-scripts --no-audit --no-fund --prefix .github/scripts
          node .github/scripts/validate-mermaid.mjs full-guide

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
          cache: 'pip'
      - run: pip install -r requirements.txt
      - run: mkdocs build --strict
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        if: github.ref == 'refs/heads/main'
        with:
          path: site

  deploy:
    if: github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write       # publish the Pages artifact
      id-token: write    # deploy-pages proves its identity to Pages via OIDC
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1

  # Rolling failure issue — same pattern as example-trees-check.yml, with one
  # deliberate difference: it fires on push-to-main as well as on schedule,
  # not on schedule alone. The 65-day outage arrived on a PUSH. Notifying only
  # on the weekly run would have caught it in at most 7 days instead of 65,
  # which is better but still lets a dead deploy sit through a working week.
  # Pull requests are excluded — a failing PR is already visible in its checks,
  # and filing issues for them would be noise.
  rolling-failure-issue:
    needs: [build, deploy]
    if: failure() && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const { owner, repo } = context.repo;
            const label = 'docs-build-failure';
            const url = `https://github.com/${owner}/${repo}/actions/runs/${context.runId}`;
            const body = [
              `The \`docs\` workflow failed (${context.eventName}) in run ${context.runId}.`,
              ``,
              `**The site does not redeploy while this is failing.** \`deploy\``,
              `is \`needs: build\`, so a red build silently freezes`,
              `https://abd-ulbasit.github.io/bookstore-kubernetes-guide/ at whatever`,
              `was last published — it does not serve a stale-but-warned page, it`,
              `just stops updating.`,
              ``,
              `Run: ${url}`,
              ``,
              `Reproduce locally:`,
              '```',
              `pip install -r requirements.txt`,
              `mkdocs build --strict`,
              '```',
            ].join('\n');
            const existing = await github.rest.issues.listForRepo({
              owner, repo, state: 'open', labels: label,
            });
            if (existing.data.length > 0) {
              await github.rest.issues.createComment({
                owner, repo, issue_number: existing.data[0].number, body,
              });
            } else {
              await github.rest.issues.create({
                owner, repo, title: 'docs build failing — site is not redeploying',
                body, labels: [label],
              });
            }
