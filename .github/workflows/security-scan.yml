name: security-scan

# Runs every security scanner against the repo + uploads SARIF results to
# the GitHub Security tab so findings surface as Code Scanning alerts.
# Also writes a human-readable Markdown summary to the workflow run.
#
# Triggers: every push to main, every PR touching scannable files, and
# weekly on Mondays at 06:00 UTC (catches new CVEs against pinned tools).

on:
  schedule:
    - cron: '0 6 * * 1'        # Mondays 06:00 UTC
  workflow_dispatch: {}
  push:
    branches: [main]
    paths:
      - 'full-guide/examples/**'
      - '.github/workflows/security-scan.yml'
  pull_request:
    paths:
      - 'full-guide/examples/**'

permissions:
  contents: read
  security-events: write       # required to upload SARIF
  actions: read

jobs:
  # ---- Filesystem + Dockerfile + secret scan ----
  trivy:
    name: trivy (vuln + secret + misconfig)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Trivy filesystem scan (vulnerabilities)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: 'fs'
          scan-ref: '.'
          format: 'sarif'
          output: 'trivy-vuln.sarif'
          severity: 'CRITICAL,HIGH'
          # Don't fail the build on findings — surface them; severity
          # judgement happens in review.
          exit-code: '0'
          scanners: 'vuln,secret,misconfig'
          # The .terraform/ provider blobs would dominate the report; they
          # are gitignored anyway, so skip explicitly here too.
          skip-dirs: 'node_modules,.terraform,site'

      - name: Upload Trivy SARIF to GitHub Security
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: 'trivy-vuln.sarif'
          category: trivy

  # ---- Terraform-specific scanning ----
  tfsec:
    name: tfsec (Terraform misconfig)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        tree:
          - full-guide/examples/bookstore-platform/terraform
          - full-guide/examples/bookstore-platform/terraform-account-baseline
    steps:
      - uses: actions/checkout@v4
      - uses: aquasecurity/tfsec-sarif-action@v0.1.4
        with:
          working_directory: ${{ matrix.tree }}
          sarif_file: tfsec-${{ strategy.job-index }}.sarif
      - uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: tfsec-${{ strategy.job-index }}.sarif
          category: tfsec-${{ strategy.job-index }}

  # ---- Go vulnerability scan (every module under examples/) ----
  #
  # The module list is DISCOVERED, not hardcoded. It used to be a hardcoded
  # service-name matrix joined to a fixed path prefix
  # (bookstore-platform/app/<service>), which silently scanned only the
  # Platform v2 tree. The canonical reader-facing tree — examples/bookstore/,
  # the one Parts 02-08 tell readers to run — was never scanned at all, and
  # drifted onto a pgx release with a known SQL-injection advisory
  # (GO-2026-5004) while the workflow reported green.
  #
  # Discovery means a new service or example module is covered the moment its
  # go.mod lands, with no list to remember to update.
  discover-go-modules:
    name: discover Go modules
    runs-on: ubuntu-latest
    outputs:
      modules: ${{ steps.find.outputs.modules }}
    steps:
      - uses: actions/checkout@v4
      - id: find
        run: |
          set -euo pipefail
          dirs=$(find full-guide/examples -name go.mod \
            -not -path '*/vendor/*' -not -path '*/.terraform/*' \
            -exec dirname {} \; | sort)
          count=$(printf '%s\n' "$dirs" | grep -c . || true)
          if [ "$count" -eq 0 ]; then
            echo "FAIL — discovered zero Go modules. Either the examples tree"
            echo "moved or the find expression is wrong. Refusing to report a"
            echo "green scan over an empty matrix."
            exit 1
          fi
          echo "discovered $count Go module(s):"
          printf '%s\n' "$dirs" | sed 's/^/  /'
          modules=$(printf '%s\n' "$dirs" \
            | jq -R -s -c 'split("\n") | map(select(length > 0))')
          echo "modules=$modules" >> "$GITHUB_OUTPUT"

  govulncheck:
    name: govulncheck (${{ matrix.module }})
    needs: discover-go-modules
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        module: ${{ fromJSON(needs.discover-go-modules.outputs.modules) }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.5'
          cache-dependency-path: ${{ matrix.module }}/go.sum
      - run: go install golang.org/x/vuln/cmd/govulncheck@latest
      - name: govulncheck
        working-directory: ${{ matrix.module }}
        run: $(go env GOPATH)/bin/govulncheck ./...

  # ---- Executable form of the SECURITY-SCAN.md acceptance list ----
  #
  # SECURITY-SCAN.md §1.3 accepts exactly two `KSV-0012` findings, on the two
  # frozen Part 00/01 teaching seeds. Written only as prose, that acceptance
  # rots silently the first time a third unhardened manifest lands. This job
  # makes the list executable and fails in BOTH directions — a new unhardened
  # Pod spec, or an allowlist entry that no longer applies.
  runasnonroot-acceptance:
    name: runAsNonRoot acceptance list
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: azure/setup-helm@v4
        with: { version: 'v3.16.0' }
      - uses: azure/setup-kubectl@v4
        with: { version: 'v1.35.0' }
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - run: pip install pyyaml
      - run: python .github/scripts/check-runasnonroot.py

  # ---- Coverage summary ----
  #
  # The header of this workflow claims it "writes a human-readable Markdown
  # summary to the workflow run". Until now it wrote none. This job makes that
  # true, and deliberately reports WHAT WAS SCANNED rather than a finding
  # count: the failure this repo actually suffered was a scanner that looked
  # green because it was pointed at the wrong directory. Coverage is the thing
  # worth being able to eyeball on every run.
  scan-summary:
    name: scan coverage summary
    needs: [trivy, tfsec, govulncheck, discover-go-modules, runasnonroot-acceptance]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Write summary
        env:
          MODULES: ${{ needs.discover-go-modules.outputs.modules }}
          TRIVY_RESULT: ${{ needs.trivy.result }}
          TFSEC_RESULT: ${{ needs.tfsec.result }}
          GOVULN_RESULT: ${{ needs.govulncheck.result }}
          NONROOT_RESULT: ${{ needs.runasnonroot-acceptance.result }}
        run: |
          set -euo pipefail
          {
            echo "## Security scan coverage"
            echo
            echo "| Scanner | Scope | Result |"
            echo "|---|---|---|"
            echo "| trivy (vuln+secret+misconfig) | whole repo (\`fs\`, \`.\`) | \`${TRIVY_RESULT}\` |"
            echo "| tfsec | both Terraform trees (recursive) | \`${TFSEC_RESULT}\` |"
            echo "| govulncheck | every discovered Go module | \`${GOVULN_RESULT}\` |"
            echo "| runAsNonRoot acceptance | raw manifests + rendered Helm + Kustomize overlays | \`${NONROOT_RESULT}\` |"
            echo
            echo "### Go modules scanned"
            echo
            printf '%s' "${MODULES:-[]}" | jq -r '.[] | "- `\(.)`"'
            echo
            echo "Findings land in the [Security tab]"
            echo "(https://github.com/${GITHUB_REPOSITORY}/security/code-scanning),"
            echo "which is the live source of truth. \`SECURITY-SCAN.md\` is the"
            echo "hand-written triage of which findings are accepted and why —"
            echo "it is not auto-generated, and does not carry live counts."
          } >> "$GITHUB_STEP_SUMMARY"

  # Rolling failure issue. This workflow already ran weekly, but a weekly job
  # whose failure nobody is told about is a job that fails quietly: the
  # 2026-07-20 and 2026-07-27 scheduled runs both went red and neither
  # produced any signal outside the Actions tab. Same pattern as
  # example-trees-check.yml; fires on push-to-main as well as on schedule,
  # since a scan can start failing on either.
  rolling-failure-issue:
    needs: [trivy, tfsec, discover-go-modules, govulncheck, runasnonroot-acceptance]
    if: failure() && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/github-script@v7
        with:
          script: |
            const { owner, repo } = context.repo;
            const label = 'security-scan-failure';
            const url = `https://github.com/${owner}/${repo}/actions/runs/${context.runId}`;
            const body = [
              `The \`security-scan\` workflow failed (${context.eventName}) in run ${context.runId}.`,
              ``,
              `A failing govulncheck matrix job names the affected module in its`,
              `job title. Triage goes in \`SECURITY-SCAN.md\` — and note that`,
              `"accepted" there requires a written reason, not a deferral.`,
              ``,
              `Run: ${url}`,
              ``,
              `Reproduce locally:`,
              '```',
              `make scan-go        # govulncheck, every discovered module`,
              `make scan-trivy     # filesystem vuln + secret + misconfig`,
              `make scan-tfsec     # Terraform`,
              '```',
            ].join('\n');
            const existing = await github.rest.issues.listForRepo({
              owner, repo, state: 'open', labels: label,
            });
            if (existing.data.length > 0) {
              await github.rest.issues.createComment({
                owner, repo, issue_number: existing.data[0].number, body,
              });
            } else {
              await github.rest.issues.create({
                owner, repo, title: 'security-scan failing',
                body, labels: [label],
              });
            }
