name: security-scan

# Runs every security scanner against the repo + uploads SARIF results to
# the GitHub Security tab so findings surface as Code Scanning alerts.
# Also writes a human-readable Markdown summary to the workflow run.
#
# Triggers: every push to main, every PR touching scannable files, and
# weekly on Mondays at 06:00 UTC (catches new CVEs against pinned tools).
#
# "Pinned" means pinned: every action is referenced by full commit SHA (the
# trailing comment names the release), and every scanner by exact version:
# Trivy v0.70.0 via trivy-action, govulncheck v1.9.0, Go via setup-go. A
# moving tag on a scanner is a supply-chain hole in the job that holds
# security-events: write. trivy-action itself had its version tags
# force-pushed to malicious commits on 2026-03-19 (Aqua advisory
# GHSA-cxm3-wv7p-598c); only the immutable v0.35.0 release survived. The SHA
# below is v0.36.0, published 2026-04-22 as an immutable release.

on:
  schedule:
    - cron: '0 6 * * 1'        # Mondays 06:00 UTC
  workflow_dispatch: {}
  push:
    branches: [main]
    paths:
      - 'full-guide/examples/**'
      - '.github/workflows/security-scan.yml'
  pull_request:
    paths:
      - 'full-guide/examples/**'

permissions:
  contents: read   # write scopes are granted per job, below

env:
  # The Go toolchain govulncheck scans with. The standard library is
  # compiled into every binary, so this is only a statement about the
  # SHIPPED images if their builder uses the same patch release; the
  # go-toolchain-matches-scan job below enforces that. Bump this, the
  # Dockerfiles and example-trees-check.yml together.
  GO_VERSION: '1.26.10'

jobs:
  # ---- Filesystem + Dockerfile + secret scan ----
  trivy:
    name: trivy (vuln + secret + misconfig)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write   # required to upload SARIF
      actions: read            # upload-sarif reads the run's metadata
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Trivy filesystem scan (vulnerabilities)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          # Pin the scanner, not just the action. v0.70.0 is also the action's
          # default at this SHA; stating it means a bump is a visible diff.
          version: 'v0.70.0'
          scan-type: 'fs'
          scan-ref: '.'
          format: 'sarif'
          output: 'trivy-vuln.sarif'
          severity: 'CRITICAL,HIGH'
          # Don't fail the build on findings — surface them; severity
          # judgement happens in review.
          exit-code: '0'
          scanners: 'vuln,secret,misconfig'
          # The .terraform/ provider blobs would dominate the report; they
          # are gitignored anyway, so skip explicitly here too.
          skip-dirs: 'node_modules,.terraform,site'

      - name: Upload Trivy SARIF to GitHub Security
        uses: github/codeql-action/upload-sarif@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        if: always()
        with:
          sarif_file: 'trivy-vuln.sarif'
          category: trivy

  # ---- Built images: what actually ships ----
  #
  # `trivy fs` reads go.mod, lockfiles and Dockerfiles as text. It never sees
  # the OS packages in a base image or the Go toolchain compiled into a
  # binary, which are what a reader actually runs. Every Dockerfile under
  # full-guide/examples is therefore BUILT here (locally on the runner, never
  # pushed), scanned with `trivy image`, and given a CycloneDX SBOM.
  #
  # Report-only, like the fs scan: findings go to the Security tab and the
  # SBOMs are run artifacts. A Dockerfile that no longer builds fails the
  # job, which is a real defect worth surfacing. Discovery is the same
  # pattern as the Go modules below, so a new Dockerfile is covered when it
  # lands.
  discover-images:
    name: discover Dockerfiles
    runs-on: ubuntu-latest
    outputs:
      dirs: ${{ steps.find.outputs.dirs }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - id: find
        run: |
          set -euo pipefail
          dirs=$(find full-guide/examples -name Dockerfile -not -path '*/.terraform/*' \
            -exec dirname {} \; | sort)
          if [ -z "$dirs" ]; then
            echo "FAIL: discovered zero Dockerfiles; refusing an empty matrix."
            exit 1
          fi
          printf '%s\n' "$dirs" | sed 's/^/  /'
          echo "dirs=$(printf '%s\n' "$dirs" | jq -R -s -c 'split("\n") | map(select(length > 0))')" >> "$GITHUB_OUTPUT"

  image-scan:
    name: image (${{ matrix.dir }})
    needs: discover-images
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write   # upload SARIF
      actions: read
    strategy:
      fail-fast: false
      matrix:
        dir: ${{ fromJSON(needs.discover-images.outputs.dirs) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - id: name
        env:
          DIR: ${{ matrix.dir }}
        run: echo "name=$(printf '%s' "${DIR#full-guide/examples/}" | tr '/' '-')" >> "$GITHUB_OUTPUT"
      - name: Build (local only, never pushed)
        env:
          DIR: ${{ matrix.dir }}
          NAME: ${{ steps.name.outputs.name }}
        run: docker build --pull -t "scan/${NAME}:ci" "${DIR}"
      - name: Trivy image scan
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          version: 'v0.70.0'
          scan-type: 'image'
          image-ref: scan/${{ steps.name.outputs.name }}:ci
          format: 'sarif'
          output: 'image.sarif'
          severity: 'CRITICAL,HIGH'
          exit-code: '0'
      - name: SBOM (CycloneDX)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          version: 'v0.70.0'
          scan-type: 'image'
          image-ref: scan/${{ steps.name.outputs.name }}:ci
          format: 'cyclonedx'
          output: 'sbom.cdx.json'
          skip-setup-trivy: true   # installed by the previous step
      - uses: github/codeql-action/upload-sarif@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        if: always()
        with:
          sarif_file: 'image.sarif'
          category: image-${{ steps.name.outputs.name }}
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: sbom-${{ steps.name.outputs.name }}
          path: sbom.cdx.json
          retention-days: 30
          if-no-files-found: error

  # ---- Terraform ----
  #
  # There is deliberately no separate Terraform scanner job. The `trivy` job
  # above runs the `misconfig` scanner over the whole repo, which evaluates
  # every Terraform root (EKS platform, account baseline, multi-region, GKE)
  # with the same AVD-AWS-*/AVD-GCP-* checks tfsec used to run. tfsec's
  # checks were folded into Trivy, and tfsec has had no release since
  # v1.28.14 (May 2025).
  # The tfsec job this replaced covered only two of the four roots, and its
  # action installed tfsec `latest` inside an unpinned Dockerfile, so even a
  # SHA-pinned action would not have pinned the scanner.

  # ---- Go vulnerability scan (every module under examples/) ----
  #
  # The module list is DISCOVERED, not hardcoded. It used to be a hardcoded
  # service-name matrix joined to a fixed path prefix
  # (bookstore-platform/app/<service>), which silently scanned only the
  # Platform v2 tree. The canonical reader-facing tree — examples/bookstore/,
  # the one Parts 02-08 tell readers to run — was never scanned at all, and
  # drifted onto a pgx release with a known SQL-injection advisory
  # (GO-2026-5004) while the workflow reported green.
  #
  # Discovery means a new service or example module is covered the moment its
  # go.mod lands, with no list to remember to update.
  discover-go-modules:
    name: discover Go modules
    runs-on: ubuntu-latest
    outputs:
      modules: ${{ steps.find.outputs.modules }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - id: find
        run: |
          set -euo pipefail
          dirs=$(find full-guide/examples -name go.mod \
            -not -path '*/vendor/*' -not -path '*/.terraform/*' \
            -exec dirname {} \; | sort)
          count=$(printf '%s\n' "$dirs" | grep -c . || true)
          if [ "$count" -eq 0 ]; then
            echo "FAIL — discovered zero Go modules. Either the examples tree"
            echo "moved or the find expression is wrong. Refusing to report a"
            echo "green scan over an empty matrix."
            exit 1
          fi
          echo "discovered $count Go module(s):"
          printf '%s\n' "$dirs" | sed 's/^/  /'
          modules=$(printf '%s\n' "$dirs" \
            | jq -R -s -c 'split("\n") | map(select(length > 0))')
          echo "modules=$modules" >> "$GITHUB_OUTPUT"

  govulncheck:
    name: govulncheck (${{ matrix.module }})
    needs: discover-go-modules
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        module: ${{ fromJSON(needs.discover-go-modules.outputs.modules) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: ${{ matrix.module }}/go.sum
      # Pinned version, not @latest. The Go module proxy plus the checksum
      # database (sum.golang.org) make a version pin a content pin: the same
      # version can never resolve to different source.
      - run: go install golang.org/x/vuln/cmd/govulncheck@v1.9.0
      - name: govulncheck
        working-directory: ${{ matrix.module }}
        run: $(go env GOPATH)/bin/govulncheck ./...

  # ---- The scanned toolchain IS the shipped toolchain ----
  #
  # govulncheck's standard-library verdict is a verdict about GO_VERSION.
  # It only describes the images readers build if every Dockerfile's Go
  # builder stage uses that same patch release. It used not to: two services
  # built on golang:1.22-alpine (end-of-life) and one on 1.25 while this
  # job scanned with 1.26.5, so the "stdlib clean" claim in
  # SECURITY-SCAN.md described binaries nobody shipped. This check makes the
  # claim executable, like the runAsNonRoot acceptance below.
  go-toolchain-matches-scan:
    name: Dockerfile Go builders match GO_VERSION
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: |
          set -euo pipefail
          want="FROM golang:${GO_VERSION}-alpine AS build"
          found=$(grep -rnE '^FROM golang:' --include='Dockerfile*' full-guide/examples || true)
          if [ -z "$found" ]; then
            echo "FAIL: no Go builder stages found. The examples moved or the"
            echo "grep is wrong; refusing to pass an empty check."
            exit 1
          fi
          echo "$found"
          bad=$(printf '%s\n' "$found" | grep -vF ":${want}" || true)
          if [ -n "$bad" ]; then
            echo
            echo "FAIL: these builder stages differ from '${want}':"
            echo "$bad"
            exit 1
          fi
          echo "OK: every Go builder stage uses golang:${GO_VERSION}-alpine"

  # ---- Executable form of the SECURITY-SCAN.md acceptance list ----
  #
  # SECURITY-SCAN.md §1.3 accepts exactly two `KSV-0012` findings, on the two
  # frozen Part 00/01 teaching seeds. Written only as prose, that acceptance
  # rots silently the first time a third unhardened manifest lands. This job
  # makes the list executable and fails in BOTH directions — a new unhardened
  # Pod spec, or an allowlist entry that no longer applies.
  runasnonroot-acceptance:
    name: runAsNonRoot acceptance list
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
        with: { version: 'v3.16.0' }
      - uses: azure/setup-kubectl@bda439f5f36b99b262ebdcd3613869bddb064c8e # v5.2.0
        with: { version: 'v1.35.0' }
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with: { python-version: '3.12' }
      - run: pip install pyyaml
      - run: python .github/scripts/check-runasnonroot.py

  # ---- Coverage summary ----
  #
  # The header of this workflow claims it "writes a human-readable Markdown
  # summary to the workflow run". Until now it wrote none. This job makes that
  # true, and deliberately reports WHAT WAS SCANNED rather than a finding
  # count: the failure this repo actually suffered was a scanner that looked
  # green because it was pointed at the wrong directory. Coverage is the thing
  # worth being able to eyeball on every run.
  scan-summary:
    name: scan coverage summary
    needs: [trivy, image-scan, discover-images, govulncheck, discover-go-modules, go-toolchain-matches-scan, runasnonroot-acceptance]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Write summary
        env:
          MODULES: ${{ needs.discover-go-modules.outputs.modules }}
          TRIVY_RESULT: ${{ needs.trivy.result }}
          IMAGE_RESULT: ${{ needs.image-scan.result }}
          GOVULN_RESULT: ${{ needs.govulncheck.result }}
          TOOLCHAIN_RESULT: ${{ needs.go-toolchain-matches-scan.result }}
          NONROOT_RESULT: ${{ needs.runasnonroot-acceptance.result }}
        run: |
          set -euo pipefail
          {
            echo "## Security scan coverage"
            echo
            echo "| Scanner | Scope | Result |"
            echo "|---|---|---|"
            echo "| trivy (vuln+secret+misconfig) | whole repo (\`fs\`, \`.\`), incl. all four Terraform roots | \`${TRIVY_RESULT}\` |"
            echo "| trivy image + CycloneDX SBOM | every Dockerfile under full-guide/examples, built on the runner | \`${IMAGE_RESULT}\` |"
            echo "| govulncheck (Go ${GO_VERSION}) | every discovered Go module | \`${GOVULN_RESULT}\` |"
            echo "| Go builder images == scan toolchain | every Dockerfile under full-guide/examples | \`${TOOLCHAIN_RESULT}\` |"
            echo "| runAsNonRoot acceptance | raw manifests + rendered Helm + Kustomize overlays | \`${NONROOT_RESULT}\` |"
            echo
            echo "### Go modules scanned"
            echo
            printf '%s' "${MODULES:-[]}" | jq -r '.[] | "- `\(.)`"'
            echo
            echo "Findings land in the [Security tab]"
            echo "(https://github.com/${GITHUB_REPOSITORY}/security/code-scanning),"
            echo "which is the live source of truth. \`SECURITY-SCAN.md\` is the"
            echo "hand-written triage of which findings are accepted and why —"
            echo "it is not auto-generated, and does not carry live counts."
          } >> "$GITHUB_STEP_SUMMARY"

  # Rolling failure issue. This workflow already ran weekly, but a weekly job
  # whose failure nobody is told about is a job that fails quietly: the
  # 2026-07-20 and 2026-07-27 scheduled runs both went red and neither
  # produced any signal outside the Actions tab. Same pattern as
  # example-trees-check.yml; fires on push-to-main as well as on schedule,
  # since a scan can start failing on either.
  rolling-failure-issue:
    needs: [trivy, discover-images, image-scan, discover-go-modules, govulncheck, go-toolchain-matches-scan, runasnonroot-acceptance]
    if: failure() && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const { owner, repo } = context.repo;
            const label = 'security-scan-failure';
            const url = `https://github.com/${owner}/${repo}/actions/runs/${context.runId}`;
            const body = [
              `The \`security-scan\` workflow failed (${context.eventName}) in run ${context.runId}.`,
              ``,
              `A failing govulncheck matrix job names the affected module in its`,
              `job title. Triage goes in \`SECURITY-SCAN.md\` — and note that`,
              `"accepted" there requires a written reason, not a deferral.`,
              ``,
              `Run: ${url}`,
              ``,
              `Reproduce locally:`,
              '```',
              `make scan-go        # govulncheck, every discovered module`,
              `make scan-trivy     # filesystem vuln + secret + misconfig`,
              `make scan-terraform # Terraform roots, one at a time`,
              '```',
            ].join('\n');
            const existing = await github.rest.issues.listForRepo({
              owner, repo, state: 'open', labels: label,
            });
            if (existing.data.length > 0) {
              await github.rest.issues.createComment({
                owner, repo, issue_number: existing.data[0].number, body,
              });
            } else {
              await github.rest.issues.create({
                owner, repo, title: 'security-scan failing',
                body, labels: [label],
              });
            }
