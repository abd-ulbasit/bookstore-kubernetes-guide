name: secret-scan

# Gitleaks over the FULL git history, on every PR and push to main, plus
# nightly (new default rules can find old commits).
#
# This replaces the old `leak-scan` job in example-trees-check.yml, which was
# a grep denylist: it scanned only full-guide/ for five file extensions
# (no .tf, .json, .github/ or root files), recognised no credential format at
# all, and published the author's own identifiers as its search terms.
#
# Deliberately no `paths:` filter. A credential can land in any file,
# including the workflows themselves, so every PR is scanned.
#
# Allowlist: .gitleaks.toml. Every entry is pinned to one rule, one file and
# one line shape. Read its header before adding to it.

on:
  pull_request: {}
  push:
    branches: [main]
  schedule:
    - cron: '0 2 * * *'    # nightly 02:00 UTC
  workflow_dispatch: {}

permissions:
  contents: read   # write scopes are granted per job, below

jobs:
  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # Full history. Deleting a file does not unpublish it, so the scan
          # has to read every commit, not just the tip.
          fetch-depth: 0

      - name: Install gitleaks (pinned release, checksum-verified)
        env:
          GITLEAKS_VERSION: '8.30.1'
          # sha256 of gitleaks_8.30.1_linux_x64.tar.gz, from the release's
          # checksums file and GitHub's own asset digest (they agree).
          GITLEAKS_SHA256: '551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb'
        run: |
          set -euo pipefail
          curl -fsSL -o gitleaks.tar.gz \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  gitleaks.tar.gz" | sha256sum -c -
          tar -xzf gitleaks.tar.gz gitleaks
          sudo install -m 0755 gitleaks /usr/local/bin/gitleaks
          rm -f gitleaks gitleaks.tar.gz
          gitleaks version

      - name: gitleaks (full history)
        # --redact keeps any finding's value out of the (public) job log.
        run: gitleaks git --config .gitleaks.toml --redact --verbose --exit-code 1 .

  # Same rolling-issue pattern as the other workflows. PRs are excluded:
  # a failing PR is already visible in its checks.
  rolling-failure-issue:
    needs: [gitleaks]
    if: failure() && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      issues: write   # open / update the rolling failure issue
    steps:
      - uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const { owner, repo } = context.repo;
            const label = 'secret-scan-failure';
            const url = `https://github.com/${owner}/${repo}/actions/runs/${context.runId}`;
            const body = [
              `The \`secret-scan\` workflow failed (${context.eventName}) in run ${context.runId}.`,
              ``,
              `If gitleaks reported a finding: treat it as real until proven`,
              `otherwise. Rotate first, then decide about history. Only a`,
              `confirmed false positive goes into \`.gitleaks.toml\`, pinned to`,
              `one rule, one file and one line shape.`,
              ``,
              `Run: ${url}`,
            ].join('\n');
            const existing = await github.rest.issues.listForRepo({
              owner, repo, state: 'open', labels: label,
            });
            if (existing.data.length > 0) {
              await github.rest.issues.createComment({
                owner, repo, issue_number: existing.data[0].number, body,
              });
            } else {
              await github.rest.issues.create({
                owner, repo, title: 'secret-scan failing', body, labels: [label],
              });
            }
