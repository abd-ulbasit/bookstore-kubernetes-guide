# Bookstore Platform v2 — Part 13 ch.04: a Keycloak realm-import ConfigMap.
# Keycloak reads top-level JSON from data/import when it starts with
# --import-realm. It skips a realm that already exists, so an edit to this
# file does not change a running realm.
#
# Secrets are not in this file. Keycloak replaces ${NAME} placeholders with
# environment variables at import time. The chart injects them from the
# keycloak-realm-secrets Secret, which 13.04 creates with a command and
# External Secrets supplies in production (13.06).
#
# What the realm declares:
#   storefront-web  public client, browser PKCE only, direct grants off.
#   admin-portal    confidential client for server-side tools. Its service
#                   account runs the smoke test in 13.04. Direct grants off.
#   tokens          15-minute access tokens. Refresh tokens rotate and
#                   cannot be reused.
#   claims          aud from an audience mapper per client, tenant from a
#                   user attribute, groups from group membership (13.01 reads
#                   the groups claim).
#   users           only the service-account user for admin-portal. Humans
#                   arrive through onboarding (13.02), not through this file.
#
# Apply, after the keycloak namespace and its Secrets exist (13.04 step 2):
#   kubectl apply -f examples/bookstore-platform/auth/keycloak-realm-import.cm.yaml
apiVersion: v1
kind: ConfigMap
metadata:
  name: keycloak-realm-bookstore-platform
  namespace: keycloak
  labels:
    app.kubernetes.io/part-of: bookstore-platform
data:
  realm-bookstore-platform.json: |
    {
      "realm": "bookstore-platform",
      "enabled": true,
      "sslRequired": "external",
      "registrationAllowed": false,
      "loginWithEmailAllowed": true,
      "resetPasswordAllowed": true,
      "bruteForceProtected": true,
      "revokeRefreshToken": true,
      "refreshTokenMaxReuse": 0,
      "accessTokenLifespan": 900,
      "accessCodeLifespanLogin": 600,
      "ssoSessionIdleTimeout": 1800,
      "ssoSessionMaxLifespan": 36000,
      "clients": [
        {
          "clientId": "storefront-web",
          "name": "Storefront (browser)",
          "enabled": true,
          "publicClient": true,
          "protocol": "openid-connect",
          "standardFlowEnabled": true,
          "implicitFlowEnabled": false,
          "directAccessGrantsEnabled": false,
          "rootUrl": "https://bookstore-platform.example.com",
          "redirectUris": [
            "https://bookstore-platform.example.com/*",
            "https://*.bookstore-platform.example.com/*"
          ],
          "webOrigins": ["+"],
          "attributes": {
            "pkce.code.challenge.method": "S256"
          },
          "protocolMappers": [
            {
              "name": "audience-storefront-web",
              "protocol": "openid-connect",
              "protocolMapper": "oidc-audience-mapper",
              "config": {
                "included.client.audience": "storefront-web",
                "id.token.claim": "false",
                "access.token.claim": "true"
              }
            },
            {
              "name": "tenant",
              "protocol": "openid-connect",
              "protocolMapper": "oidc-usermodel-attribute-mapper",
              "config": {
                "user.attribute": "tenant",
                "claim.name": "tenant",
                "jsonType.label": "String",
                "id.token.claim": "true",
                "access.token.claim": "true",
                "userinfo.token.claim": "true"
              }
            },
            {
              "name": "groups",
              "protocol": "openid-connect",
              "protocolMapper": "oidc-group-membership-mapper",
              "config": {
                "claim.name": "groups",
                "full.path": "false",
                "id.token.claim": "true",
                "access.token.claim": "true",
                "userinfo.token.claim": "true"
              }
            }
          ]
        },
        {
          "clientId": "admin-portal",
          "name": "Admin Portal (server-side)",
          "enabled": true,
          "publicClient": false,
          "protocol": "openid-connect",
          "standardFlowEnabled": true,
          "implicitFlowEnabled": false,
          "directAccessGrantsEnabled": false,
          "serviceAccountsEnabled": true,
          "secret": "${ADMIN_PORTAL_CLIENT_SECRET}",
          "rootUrl": "https://admin.bookstore-platform.example.com",
          "redirectUris": [
            "https://admin.bookstore-platform.example.com/*"
          ],
          "webOrigins": ["+"],
          "protocolMappers": [
            {
              "name": "audience-admin-portal",
              "protocol": "openid-connect",
              "protocolMapper": "oidc-audience-mapper",
              "config": {
                "included.client.audience": "admin-portal",
                "id.token.claim": "false",
                "access.token.claim": "true"
              }
            },
            {
              "name": "tenant",
              "protocol": "openid-connect",
              "protocolMapper": "oidc-usermodel-attribute-mapper",
              "config": {
                "user.attribute": "tenant",
                "claim.name": "tenant",
                "jsonType.label": "String",
                "id.token.claim": "true",
                "access.token.claim": "true",
                "userinfo.token.claim": "true"
              }
            },
            {
              "name": "groups",
              "protocol": "openid-connect",
              "protocolMapper": "oidc-group-membership-mapper",
              "config": {
                "claim.name": "groups",
                "full.path": "false",
                "id.token.claim": "true",
                "access.token.claim": "true",
                "userinfo.token.claim": "true"
              }
            }
          ]
        }
      ],
      "roles": {
        "realm": [
          { "name": "tenant-admin",  "description": "Full control of a tenant's namespace." },
          { "name": "tenant-member", "description": "Read/use a tenant's namespace." }
        ]
      },
      "groups": [
        {
          "name": "tenant-acme-books-admins",
          "realmRoles": ["tenant-admin"]
        },
        {
          "name": "tenant-acme-books-members",
          "realmRoles": ["tenant-member"]
        }
      ],
      "users": [
        {
          "username": "service-account-admin-portal",
          "enabled": true,
          "serviceAccountClientId": "admin-portal",
          "attributes": {
            "tenant": ["acme-books"]
          }
        }
      ]
    }
