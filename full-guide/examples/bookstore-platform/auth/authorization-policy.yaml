# Bookstore Platform v2 — Part 13 ch.04: the AuthorizationPolicies that
# ENFORCE "a valid Keycloak JWT is required for /api/*". RequestAuthentication
# verifies; AuthorizationPolicy enforces. Both are needed.
#
# Two ALLOW policies select the gateway:
#   1. allow-public-static   /static/*, /healthz, /favicon.ico — GET, no JWT.
#   2. require-jwt-api       /api/* — a request principal, which exists only
#                            when a verified JWT is present, and a non-empty
#                            `tenant` claim.
#
# Default deny comes from the ALLOW policies themselves. Once any ALLOW policy
# selects the gateway, a request that matches none of them is denied. Istio
# documents this as "equivalent to setting a default of deny ... if the action
# is ALLOW". A DENY policy is not needed, and one with an empty rule would deny
# every request, including the two above: an empty rule always matches, and DENY
# is evaluated first.
#
# What the client sees:
#   no token on /api/*        403 (the policy requires a principal)
#   invalid or expired token  401 (RequestAuthentication rejects it)
#   valid token               not 401 or 403: the policy let it through
#
# The `tenant` condition checks that the claim is present and non-empty. It
# does not compare the claim with the Host header; that comparison needs its
# own policy and is not part of this chapter.
#
# !!! CRD-INTRINSIC DRY-RUN
#   `AuthorizationPolicy` is `security.istio.io/v1` — an Istio CRD.
#   WITHOUT Istio installed a client dry-run prints:
#     no matches for kind "AuthorizationPolicy" in version "security.istio.io/v1"
#   EXPECTED. After Istio is installed this applies cleanly.
#
# Apply (after Istio + request-authentication.yaml):
#   kubectl apply -f examples/bookstore-platform/auth/authorization-policy.yaml
---
apiVersion: security.istio.io/v1
kind: AuthorizationPolicy
metadata:
  name: allow-public-static
  namespace: istio-system
  labels:
    app.kubernetes.io/part-of: bookstore-platform
spec:
  selector:
    matchLabels:
      istio: ingressgateway
  action: ALLOW
  rules:
    - to:
        - operation:
            methods: ["GET"]
            paths: ["/static/*", "/healthz", "/favicon.ico"]
---
apiVersion: security.istio.io/v1
kind: AuthorizationPolicy
metadata:
  name: require-jwt-api
  namespace: istio-system
  labels:
    app.kubernetes.io/part-of: bookstore-platform
spec:
  selector:
    matchLabels:
      istio: ingressgateway
  action: ALLOW
  rules:
    - from:
        # requestPrincipals = "issuer/subject"; "*" matches any non-empty
        # principal, so the request must carry a token that
        # RequestAuthentication has verified.
        - source:
            requestPrincipals: ["*"]
      to:
        - operation:
            paths: ["/api/*"]
      when:
        # The `tenant` custom claim MUST be present and non-empty.
        - key: request.auth.claims[tenant]
          notValues: [""]
