# Bookstore Platform v2 — Part 13 ch.04 "Real auth: Keycloak OIDC + IRSA +
# Istio JWT": the Istio RequestAuthentication that verifies a Keycloak JWT at
# the gateway BEFORE downstream services see the request.
#
# One declaration, scoped to the ingress gateway, covers all edge traffic.
#
# `jwtRules`:
#   - issuer: MUST match the `iss` claim byte for byte. Keycloak builds `iss`
#     from KC_HOSTNAME (see argocd/application-keycloak.yaml). A token from any
#     other issuer is rejected with 401.
#   - jwksUri: where Istio fetches the public keys. It must be HTTPS. Whoever
#     can answer this request chooses the keys that verify tokens, so a plain
#     HTTP answer would let anyone on the path forge a token. Envoy caches the
#     keys for 10 minutes by default, and no field here changes that.
#   - audiences: MUST contain the `aud` claim. Each client gets its own
#     audience mapper in the realm, so a token from either client names it.
#   - forwardOriginalToken: true so downstream services CAN look at the
#     claims if they need to (without re-validating — that is the gateway's job).
#
# WHY NOT enforce here: RequestAuthentication ONLY VERIFIES. A request with no
# token passes it. The complementary AuthorizationPolicy
# (authorization-policy.yaml) requires a principal for /api/*. Verification
# and enforcement are two objects; collapsing them is the #1 footgun.
#
# !!! CRD-INTRINSIC DRY-RUN
#   `RequestAuthentication` is `security.istio.io/v1` — an Istio CRD.
#   WITHOUT Istio installed a client dry-run prints:
#     no matches for kind "RequestAuthentication" in version "security.istio.io/v1"
#   EXPECTED. After Istio is installed this applies cleanly.
#
# Apply (after Istio is installed; 13.04 step 1 and Part 11 ch.04):
#   kubectl apply -f examples/bookstore-platform/auth/request-authentication.yaml
---
apiVersion: security.istio.io/v1
kind: RequestAuthentication
metadata:
  name: storefront-keycloak
  namespace: istio-system
  labels:
    app.kubernetes.io/part-of: bookstore-platform
spec:
  # The Istio ingress gateway pods sit in istio-system and carry this label.
  # All edge traffic flows through them — verify once, at the edge.
  selector:
    matchLabels:
      istio: ingressgateway
  jwtRules:
    - issuer: "https://keycloak.bookstore-platform.example.com/realms/bookstore-platform"
      # Served over HTTPS on the same name as the issuer. The gateway must be
      # able to resolve the name and trust its certificate.
      jwksUri: "https://keycloak.bookstore-platform.example.com/realms/bookstore-platform/protocol/openid-connect/certs"
      audiences:
        - storefront-web
        - admin-portal
      forwardOriginalToken: true
      # outputPayloadToHeader: surfaces the verified claims as a base64 JSON
      # header so downstream services can read them without re-validating.
      outputPayloadToHeader: x-jwt-payload
