# Bookstore Platform v2 — Part 13 ch.05: the ExternalSecrets for the search
# path. Each one fills a Secret from Vault through the ClusterSecretStore
# vault-bookstore-platform. This tree does not ship that store: Part 15 ch.05
# gives each tenant a namespaced SecretStore instead, so a platform store has
# to be written for the platform namespaces (ch.13.05 step 3). No value is
# written in this file.
#   - meilisearch-master-key  -> bookstore-platform-search (the Meilisearch master key)
#   - meilisearch-sink-key    -> kafka-system (the sink's documents.add key)
#   - debezium-postgres       -> kafka-system (the debezium role's password)
# Apply after meilisearch.yaml (creates bookstore-platform-search) and after
# the kafka-system namespace exists (ch.13.05 step 1):
#   kubectl apply -f examples/bookstore-platform/search/external-secrets.yaml
---
# The master key is never written into this file. External Secrets creates
# the Secret from Vault, through the platform store that ch.13.05 step 3 says
# this tree does not ship.
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: meilisearch-master-key
  namespace: bookstore-platform-search
  labels:
    app.kubernetes.io/part-of: bookstore-platform
    app.kubernetes.io/component: search-engine
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: vault-bookstore-platform
    kind: ClusterSecretStore
  target:
    name: meilisearch-master-key
    creationPolicy: Owner
  data:
    - secretKey: master-key
      remoteRef:
        key: kv/bookstore-platform/meilisearch
        property: master_key
---
# The Meilisearch sink key: documents.add on the books-* indexes, nothing else.
# Created with the master key and stored in Vault (ch.13.05 step 4).
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: meilisearch-sink-key
  namespace: kafka-system
  labels:
    app.kubernetes.io/part-of: bookstore-platform
    app.kubernetes.io/component: search-cdc
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: vault-bookstore-platform
    kind: ClusterSecretStore
  target:
    name: meilisearch-sink-key
    creationPolicy: Owner
  data:
    - secretKey: api-key
      remoteRef:
        key: kv/bookstore-platform/meilisearch
        property: sink_key
---
# The Postgres password for the debezium role.
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: debezium-postgres
  namespace: kafka-system
  labels:
    app.kubernetes.io/part-of: bookstore-platform
    app.kubernetes.io/component: search-cdc
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: vault-bookstore-platform
    kind: ClusterSecretStore
  target:
    name: debezium-postgres
    creationPolicy: Owner
  data:
    - secretKey: password
      remoteRef:
        key: kv/bookstore-platform/debezium
        property: password
