# Bookstore Platform v2 — Part 13 ch.05: Meilisearch as the v2 search engine.
# One StatefulSet per region (search is regional; indexes do NOT replicate
# cross-region — each region's Debezium connector feeds its local
# Meilisearch from the local Postgres replica).
#
# Why Meilisearch (vs OpenSearch / Typesense / Algolia)
#   - Meilisearch is the lightest of the four (single Go binary, single
#     process, no JVM) — easiest operational story on Kubernetes.
#   - Typo tolerance + relevance ranking + faceting + filtering are all
#     built in — no plug-in / query DSL the way OpenSearch needs.
#   - One StatefulSet and one PVC keep the index data on one volume.
# Algolia is the SaaS alternative; teams that prefer "managed search and
# never run a search engine" should pick it. The chapter walks both.
#
# StatefulSet (not Deployment) because the engine writes to a persistent
# volume and Pod identity matters for stable storage. `serviceName` ties to
# the headless Service below. The chapter runs one replica; more replicas are
# a day-2 topic in 13.12.
#
# PSA: the Namespace below sets `enforce: restricted`. The image declares no
# user, so the pod sets runAsUser 65532 itself. The image is pinned by digest
# (see the image line).
#
# Apply:
#   kubectl apply -f examples/bookstore-platform/search/meilisearch.yaml
---

apiVersion: v1
kind: Namespace
metadata:
  name: bookstore-platform-search
  labels:
    app.kubernetes.io/part-of: bookstore-platform
    bookstore-platform.example.com/scope: search
    pod-security.kubernetes.io/enforce: restricted
    pod-security.kubernetes.io/enforce-version: latest
    pod-security.kubernetes.io/audit: restricted
    pod-security.kubernetes.io/audit-version: latest
    pod-security.kubernetes.io/warn: restricted
    pod-security.kubernetes.io/warn-version: latest
---

apiVersion: v1
kind: ServiceAccount
metadata:
  name: meilisearch
  namespace: bookstore-platform-search
  labels:
    app.kubernetes.io/part-of: bookstore-platform
    app.kubernetes.io/component: search-engine
automountServiceAccountToken: false
---

# Headless Service — gives each StatefulSet Pod stable DNS (e.g.
# meilisearch-0.meilisearch-headless.bookstore-platform-search.svc.cluster.local).
# Used by the StatefulSet's serviceName for governing identity; not by
# application clients.
apiVersion: v1
kind: Service
metadata:
  name: meilisearch-headless
  namespace: bookstore-platform-search
  labels:
    app.kubernetes.io/part-of: bookstore-platform
    app.kubernetes.io/component: search-engine
spec:
  clusterIP: None
  selector:
    app: meilisearch
  ports:
    - name: http
      port: 7700
      targetPort: 7700
---

# Regular client Service — the address the search app talks to
# (`meilisearch.bookstore-platform-search.svc.cluster.local:7700`).
# clusterIP auto-assigned; load-balances across the StatefulSet's
# replicas.
apiVersion: v1
kind: Service
metadata:
  name: meilisearch
  namespace: bookstore-platform-search
  labels:
    app.kubernetes.io/part-of: bookstore-platform
    app.kubernetes.io/component: search-engine
spec:
  selector:
    app: meilisearch
  ports:
    - name: http
      port: 7700
      targetPort: 7700
---

apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: meilisearch
  namespace: bookstore-platform-search
  labels:
    app: meilisearch
    app.kubernetes.io/part-of: bookstore-platform
    app.kubernetes.io/component: search-engine
spec:
  serviceName: meilisearch-headless
  replicas: 1
  selector:
    matchLabels:
      app: meilisearch
  template:
    metadata:
      labels:
        app: meilisearch
        app.kubernetes.io/part-of: bookstore-platform
    spec:
      serviceAccountName: meilisearch
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        # The image declares no USER, so the UID is set here.
        runAsUser: 65532
        runAsGroup: 65532
        fsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: meilisearch
          # Tag getmeili/meilisearch:v1.56.0 at the time of pinning.
          image: getmeili/meilisearch@sha256:1f578fa865f8251894b3bf38d6668d6209a3f451f8f65ab953e129d4c1db5ef4
          imagePullPolicy: IfNotPresent
          # The image runs from /meili_data, which sits on the read-only root
          # filesystem. Dumps and snapshots go to the data volume, and so does
          # the working directory.
          workingDir: /data
          # The image's entrypoint is tini and its default command is
          # /bin/meilisearch. Args replace that command, so the binary is the
          # first argument.
          args:
            - "/bin/meilisearch"
            - "--http-addr"
            - "0.0.0.0:7700"
            - "--db-path"
            - "/data/meilisearch"
            - "--dump-dir"
            - "/data/dumps"
            - "--snapshot-dir"
            - "/data/snapshots"
            - "--env"
            - "production"
          env:
            # Filled by External Secrets (search/external-secrets.yaml). Only this
            # pod and the operators hold the master key; workloads get scoped
            # keys (ch.13.05 step 4).
            - name: MEILI_MASTER_KEY
              valueFrom:
                secretKeyRef:
                  name: meilisearch-master-key
                  key: master-key
          ports:
            - name: http
              containerPort: 7700
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 1Gi
          livenessProbe:
            httpGet:
              path: /health
              port: 7700
            initialDelaySeconds: 10
            periodSeconds: 30
          readinessProbe:
            httpGet:
              path: /health
              port: 7700
            initialDelaySeconds: 5
            periodSeconds: 10
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: data
              mountPath: /data
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 5Gi
---

# Default-deny for the search namespace, then one explicit allow. Meilisearch
# makes no outbound calls, so egress stays denied. The allow admits the search
# service in the tenant namespace and the sink connector in kafka-system.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny
  namespace: bookstore-platform-search
spec:
  podSelector: {}
  policyTypes: ["Ingress", "Egress"]
---

apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-index-clients
  namespace: bookstore-platform-search
spec:
  podSelector:
    matchLabels:
      app: meilisearch
  policyTypes: ["Ingress"]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: bookstore-platform-acme-books
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kafka-system
      ports:
        - protocol: TCP
          port: 7700
