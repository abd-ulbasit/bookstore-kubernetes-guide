# Bookstore Platform v2 — Part 13 ch.07: Gateway API at the edge. The v2
# entry-point pattern — `Gateway` + `HTTPRoute` rather than the legacy
# Ingress + ingress-controller-specific annotations.
#
# Gateway API is the standardised replacement for Ingress in Kubernetes (GA
# since v1.0). It carries three semantic primitives:
#   - GatewayClass — the controller implementation (Istio, Envoy Gateway,
#                    Contour, Cilium Gateway, etc.).
#   - Gateway      — a logical load-balancer (listeners, addresses, TLS).
#   - HTTPRoute    — how requests reaching the Gateway map to Services.
# Istio provisions a Deployment and a Service named after the Gateway and the
# GatewayClass (bookstore-platform-edge-istio), labelled
# gateway.networking.k8s.io/gateway-name. The WasmPlugin and EnvoyFilters in
# this directory select those pods by that label.
#
# !!! CRD-INTRINSIC DRY-RUN
#   `Gateway` and `HTTPRoute` are `gateway.networking.k8s.io/v1` — the
#   Gateway API standard CRDs. WITHOUT the Gateway API CRDs installed (a
#   one-shot `kubectl apply` of the Standard channel YAML):
#     no matches for kind "Gateway" in version "gateway.networking.k8s.io/v1"
#   EXPECTED. Install the Gateway API CRDs first (ch.13.07 step 1).
#
# Two HTTPRoutes (plus a redirect and the Stripe webhook):
#   - bookstore-platform-public — public paths, no JWT (the /static/* +
#     /healthz + /favicon.ico set the legacy AuthorizationPolicy already
#     covers — kept consistent here).
#   - bookstore-platform-api    — /api/* requires JWT (paired with the
#     existing auth/authorization-policy.yaml from ch.13.04).
#
# Apply (after the CRDs and edge-ca.yaml, ch.13.07 step 2):
#   kubectl apply -f examples/bookstore-platform/edge/gateway.yaml
---
apiVersion: gateway.networking.k8s.io/v1
kind: GatewayClass
metadata:
  name: istio
  labels:
    app.kubernetes.io/part-of: bookstore-platform
spec:
  # Istio's Gateway API controller name (canonical).
  controllerName: istio.io/gateway-controller
---
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: bookstore-platform-edge
  namespace: bookstore-platform
  labels:
    app.kubernetes.io/part-of: bookstore-platform
    bookstore-platform.example.com/component: edge
spec:
  gatewayClassName: istio
  listeners:
    # HTTPS listener with TLS terminated here. The certificate comes from
    # cert-manager (edge-ca.yaml), signed by the edge CA.
    - name: https
      protocol: HTTPS
      port: 443
      tls:
        mode: Terminate
        certificateRefs:
          - kind: Secret
            name: bookstore-platform-edge-cert
      # Only routes in this namespace attach. A tenant route needs a change
      # here, reviewed like any other edge change.
      allowedRoutes:
        namespaces:
          from: Same
    - name: http
      protocol: HTTP
      port: 80
      allowedRoutes:
        namespaces:
          from: Same
---
# Plain HTTP only redirects. Nothing is served on port 80.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: bookstore-platform-redirect
  namespace: bookstore-platform
  labels:
    app.kubernetes.io/part-of: bookstore-platform
spec:
  parentRefs:
    - name: bookstore-platform-edge
      sectionName: http
  rules:
    - filters:
        - type: RequestRedirect
          requestRedirect:
            scheme: https
            statusCode: 301
---
# Every rule below drops x-canary-cohort. The storefront sets that header from
# the verified session, and the catalog's VirtualService routes on it, so a
# client must not be able to choose its own cohort on any route. A new route
# needs the same filter (see cohort-header-strip.yaml for the catch-all).
# Public paths (no JWT required).
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: bookstore-platform-public
  namespace: bookstore-platform
  labels:
    app.kubernetes.io/part-of: bookstore-platform
spec:
  parentRefs:
    - name: bookstore-platform-edge
      sectionName: https
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /static
        - path:
            type: Exact
            value: /healthz
        - path:
            type: Exact
            value: /favicon.ico
      filters:
        - type: RequestHeaderModifier
          requestHeaderModifier:
            remove:
              - x-canary-cohort
      backendRefs:
        - name: storefront
          namespace: bookstore-platform-acme-books
          port: 8080
---
# /api/* — JWT required (enforced by the AuthorizationPolicy in
# ../auth/authorization-policy.yaml from ch.13.04, which must select this
# Gateway's pods as well).
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: bookstore-platform-api
  namespace: bookstore-platform
  labels:
    app.kubernetes.io/part-of: bookstore-platform
spec:
  parentRefs:
    - name: bookstore-platform-edge
      sectionName: https
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /api/v2/search
      filters:
        - type: RequestHeaderModifier
          requestHeaderModifier:
            remove:
              - x-canary-cohort
      backendRefs:
        - name: search
          namespace: bookstore-platform-acme-books
          port: 8080
    - matches:
        - path:
            type: PathPrefix
            value: /api/v2/recommendations
      filters:
        - type: RequestHeaderModifier
          requestHeaderModifier:
            remove:
              - x-canary-cohort
      backendRefs:
        - name: recommendations
          namespace: bookstore-platform-acme-books
          port: 8080
    - matches:
        - path:
            type: PathPrefix
            value: /api/v2/payments
      filters:
        - type: RequestHeaderModifier
          requestHeaderModifier:
            remove:
              - x-canary-cohort
      backendRefs:
        - name: payments-gateway
          namespace: bookstore-platform-payments
          port: 8080
    # Wildcard fallback to the v1 catalog/orders (which Phase 13b extends
    # without rewriting) for /api/v1/*.
    - matches:
        - path:
            type: PathPrefix
            value: /api/v1
      filters:
        - type: RequestHeaderModifier
          requestHeaderModifier:
            remove:
              - x-canary-cohort
      backendRefs:
        - name: catalog
          namespace: bookstore-platform-acme-books
          port: 8080
---
# Stripe webhook receiver — public path, NO JWT (Stripe must reach it).
# The Stripe-Signature header check + the AuthorizationPolicy in
# ../payments/payments-webhook-receiver.yaml provide the trust boundary.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: bookstore-platform-stripe-webhook
  namespace: bookstore-platform
  labels:
    app.kubernetes.io/part-of: bookstore-platform
spec:
  parentRefs:
    - name: bookstore-platform-edge
      sectionName: https
  rules:
    - matches:
        - path:
            type: Exact
            value: /stripe/webhook
          method: POST
      filters:
        - type: RequestHeaderModifier
          requestHeaderModifier:
            remove:
              - x-canary-cohort
      backendRefs:
        - name: payments-webhook-receiver
          namespace: bookstore-platform-payments
          port: 8080
---
# A backendRef into another namespace needs a ReferenceGrant in the target
# namespace. Each grant names the Services the edge may reach, and nothing
# else in the namespace.
apiVersion: gateway.networking.k8s.io/v1
kind: ReferenceGrant
metadata:
  name: edge-routes
  namespace: bookstore-platform-acme-books
  labels:
    app.kubernetes.io/part-of: bookstore-platform
spec:
  from:
    - group: gateway.networking.k8s.io
      kind: HTTPRoute
      namespace: bookstore-platform
  to:
    - group: ""
      kind: Service
      name: storefront
    - group: ""
      kind: Service
      name: search
    - group: ""
      kind: Service
      name: recommendations
    - group: ""
      kind: Service
      name: catalog
---
apiVersion: gateway.networking.k8s.io/v1
kind: ReferenceGrant
metadata:
  name: edge-routes
  namespace: bookstore-platform-payments
  labels:
    app.kubernetes.io/part-of: bookstore-platform
spec:
  from:
    - group: gateway.networking.k8s.io
      kind: HTTPRoute
      namespace: bookstore-platform
  to:
    - group: ""
      kind: Service
      name: payments-gateway
    - group: ""
      kind: Service
      name: payments-webhook-receiver
