# Bookstore Platform v2 — Part 13 ch.07: per-tenant rate limiting with the
# Envoy local rate limiter, on the edge gateway's Envoy. Three patches:
#   1. A Lua filter, before JWT authn, removes any x-tenant header the client
#      sent. Only a verified token sets it: ch.13.04's RequestAuthentication
#      copies the tenant claim to x-tenant (outputClaimToHeaders).
#   2. local_ratelimit, before the router: one token bucket per listed tenant.
#   3. A route action that turns x-tenant into the descriptor key.
# A request with no tenant matches no descriptor and uses the filter's
# default bucket. That bucket is shared by all such requests, so size it for
# anonymous traffic.
#
# Local vs global: each Envoy worker counts on its own, so the sum across N
# workers is approximate. A global limiter (a rate-limit service) is not
# built here.
#
# Rate: 100 requests / 10 seconds / tenant, a starting point. Tune per tenant
# with another descriptor entry.
#
# !!! CRD-INTRINSIC DRY-RUN
#   `EnvoyFilter` is `networking.istio.io/v1alpha3`. WITHOUT Istio:
#     no matches for kind "EnvoyFilter" in version "networking.istio.io/v1alpha3"
#   EXPECTED.
#
# Apply after the Gateway and ch.13.04's RequestAuthentication:
#   kubectl apply -f examples/bookstore-platform/edge/rate-limit-envoy-filter.yaml
apiVersion: networking.istio.io/v1alpha3
kind: EnvoyFilter
metadata:
  name: per-tenant-rate-limit
  namespace: bookstore-platform
  labels:
    app.kubernetes.io/part-of: bookstore-platform
    bookstore-platform.example.com/component: edge-rate-limit
spec:
  workloadSelector:
    labels:
      gateway.networking.k8s.io/gateway-name: bookstore-platform-edge
  configPatches:
    # 1. Drop the client's x-tenant before JWT authn runs.
    - applyTo: HTTP_FILTER
      match:
        context: GATEWAY
        listener:
          filterChain:
            filter:
              name: envoy.filters.network.http_connection_manager
              subFilter:
                name: envoy.filters.http.jwt_authn
      patch:
        operation: INSERT_BEFORE
        value:
          name: envoy.filters.http.lua
          typed_config:
            "@type": type.googleapis.com/envoy.extensions.filters.http.lua.v3.Lua
            inline_code: |
              function envoy_on_request(request_handle)
                request_handle:headers():remove("x-tenant")
              end
    # 2. The token buckets. Descriptors match the route action in patch 3.
    - applyTo: HTTP_FILTER
      match:
        context: GATEWAY
        listener:
          filterChain:
            filter:
              name: envoy.filters.network.http_connection_manager
              subFilter:
                name: envoy.filters.http.router
      patch:
        operation: INSERT_BEFORE
        value:
          name: envoy.filters.http.local_ratelimit
          typed_config:
            "@type": type.googleapis.com/udpa.type.v1.TypedStruct
            type_url: type.googleapis.com/envoy.extensions.filters.http.local_ratelimit.v3.LocalRateLimit
            value:
              stat_prefix: per_tenant_rl
              # Default bucket: used when no descriptor matches.
              token_bucket:
                max_tokens: 100
                tokens_per_fill: 100
                fill_interval: 10s
              filter_enabled:
                runtime_key: per_tenant_rl_enabled
                default_value:
                  numerator: 100
                  denominator: HUNDRED
              filter_enforced:
                runtime_key: per_tenant_rl_enforced
                default_value:
                  numerator: 100
                  denominator: HUNDRED
              descriptors:
                - entries:
                    - key: tenant
                      value: acme-books
                  token_bucket:
                    max_tokens: 100
                    tokens_per_fill: 100
                    fill_interval: 10s
                - entries:
                    - key: tenant
                      value: contoso-books
                  token_bucket:
                    max_tokens: 100
                    tokens_per_fill: 100
                    fill_interval: 10s
              # 429 + Retry-After is the standard response.
              status:
                code: TooManyRequests
              response_headers_to_add:
                - append: false
                  header:
                    key: x-rate-limit
                    value: "per-tenant"
                - append: false
                  header:
                    key: retry-after
                    value: "10"
    # 3. The route action: the verified tenant (x-tenant) is the descriptor.
    - applyTo: HTTP_ROUTE
      match:
        context: GATEWAY
      patch:
        operation: MERGE
        value:
          route:
            rate_limits:
              - actions:
                  - request_headers:
                      header_name: x-tenant
                      descriptor_key: tenant
