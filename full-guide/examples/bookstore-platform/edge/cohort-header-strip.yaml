# Bookstore Platform, Part 15 ch.06: the edge drops any x-canary-cohort header
# a client sent. The storefront sets the header from the verified session, so
# the cohort is never the client's choice. The catch-all path gets this route;
# the /static, /healthz and /api routes keep their own rules. Any other route
# that reaches the catalog needs the same filter.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: bookstore-platform-storefront-cohort
  namespace: bookstore-platform
  labels:
    app.kubernetes.io/part-of: bookstore-platform
spec:
  parentRefs:
    - name: bookstore-platform-edge
      sectionName: https
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      filters:
        - type: RequestHeaderModifier
          requestHeaderModifier:
            remove:
              - x-canary-cohort
      backendRefs:
        - name: storefront
          namespace: bookstore-platform-acme-books
          port: 8080
