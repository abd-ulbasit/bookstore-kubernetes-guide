# Bookstore Platform, Part 15 ch.06: the edge drops any x-canary-cohort header
# a client sent. The storefront sets the header from the verified session, so
# the cohort is never the client's choice. This route is the catch-all path;
# every route in gateway.yaml carries the same filter, and a new route needs it
# too. An unfiltered route would let a client pick its own canary cohort.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: bookstore-platform-storefront-cohort
  namespace: bookstore-platform
  labels:
    app.kubernetes.io/part-of: bookstore-platform
spec:
  parentRefs:
    - name: bookstore-platform-edge
      sectionName: https
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      filters:
        - type: RequestHeaderModifier
          requestHeaderModifier:
            remove:
              - x-canary-cohort
      backendRefs:
        - name: storefront
          namespace: bookstore-platform-acme-books
          port: 8080
