################################################################################
# terraform.yml — sample GitHub Actions workflow: speculative plan on every
# PR, then plan -> human approval -> apply THAT saved plan on main.
#
# This is a TEMPLATE. It does not run from inside this guide's repository
# (GitHub only executes workflows under the repo-root .github/workflows/).
# Copy it to your own repo's .github/workflows/ and adjust WORKING_DIR and
# the trigger paths to wherever the Terraform tree lives in YOUR repo. The
# values below match this guide's layout.
#
# THE SHAPE, AND WHY
#
#   pull_request ──► plan-pr      read-only role, speculative plan in the
#                                 job summary. Nothing from it is applied.
#   push to main ──► plan-main    read-only role, saved binary plan uploaded
#                                 as an artifact of THIS run, plan in the
#                                 job summary for the approver to read.
#                                 (Full text on a private repo only; see
#                                 "PLAN TEXT IS AS PUBLIC AS THE REPOSITORY".)
#                └─► apply        `environment: production` (required
#                                 reviewers). Applies the saved plan from
#                                 plan-main in the same run, or fails.
#
# What gets applied is what the approver read. A PR plan cannot be that
# thing: it was computed against the PR's base and state as they were
# hours or days before the merge, and squash-merges do not carry the PR's
# artifacts to the push run. So the PR plan is for code review, and the
# plan that is applied is computed on main and approved there. If state
# moves between plan-main and apply, `terraform apply tfplan` refuses the
# stale plan; it does not silently re-plan. There is no fallback re-plan
# and no -auto-approve anywhere. A saved plan applies without a prompt,
# and the environment approval is the prompt.
#
# PREREQUISITES (one-time, manual):
#
#   1. Remote state. This tree defaults to LOCAL state. A CI apply against
#      local state would write the state file to a throwaway runner and
#      lose it, and the next run would try to create everything again. Set
#      up the S3 backend first (backend-s3.tf.example + bootstrap-state.sh)
#      and commit backend-s3.tf. The "require a remote backend" step below
#      fails the run if there is no backend block.
#
#   2. GitHub OIDC provider in the AWS account:
#         Provider URL: https://token.actions.githubusercontent.com
#         Audience:     sts.amazonaws.com
#
#   3. Two GitHub environments in the repo (Settings -> Environments):
#
#        terraform-plan   Used by plan-pr and plan-main. Optionally add
#                         required reviewers: with them, a maintainer
#                         approves before any PR's code runs with cloud
#                         credentials (see "PR plans run PR code" below).
#        production       Used by apply only. Configure: required
#                         reviewers, deployment branches = main only, and
#                         "prevent self-review".
#
#      And two REPOSITORY variables (Settings -> Secrets and variables ->
#      Actions -> Variables). Each is both the role a job assumes and a
#      Terraform input (see 5):
#
#        TF_PLAN_ROLE_ARN    the read-only PLAN role
#        TF_APPLY_ROLE_ARN   the APPLY role
#
#      Role ARNs are not secrets, and these are repository-wide on purpose:
#      plan-main has to know the apply role's ARN, because eks.tf grants
#      that ARN cluster-admin and the plan computed there is the one that
#      is applied. What protects a role is its trust policy (4), which
#      accepts only a token minted for one environment, plus that
#      environment's rules. Knowing the ARN gets nobody past either.
#
#   4. Two IAM roles, each trusting exactly one environment. When a job
#      declares `environment:`, GitHub's OIDC `sub` claim names the
#      environment, not the branch:
#
#        plan role   sub = repo:GITHUB_ORG/GITHUB_REPO:environment:terraform-plan
#                    and sub = ...:environment:terraform-drift (nightly-drift.yml)
#        apply role  sub = repo:GITHUB_ORG/GITHUB_REPO:environment:production
#
#      Example trust policy for the apply role (replace AWS_ACCOUNT,
#      GITHUB_ORG/GITHUB_REPO):
#
#      {
#        "Version": "2012-10-17",
#        "Statement": [{
#          "Effect": "Allow",
#          "Principal": {
#            "Federated": "arn:aws:iam::AWS_ACCOUNT:oidc-provider/token.actions.githubusercontent.com"
#          },
#          "Action": "sts:AssumeRoleWithWebIdentity",
#          "Condition": {
#            "StringEquals": {
#              "token.actions.githubusercontent.com:aud": "sts.amazonaws.com",
#              "token.actions.githubusercontent.com:sub": "repo:GITHUB_ORG/GITHUB_REPO:environment:production"
#            }
#          }
#        }]
#      }
#
#      Check the `sub` your repo actually presents before you trust it.
#      Repositories created after July 15, 2026 get the immutable form
#      repo:OWNER@OWNER_ID/REPO@REPO_ID:environment:...; older ones keep
#      repo:OWNER/REPO:... unless they opt in. Pin whichever your token
#      carries, exactly, with StringEquals. Never use StringLike
#      "repo:ORG/REPO:*", which lets any branch, environment or PR assume
#      the role.
#
#      Plan role permissions: read-only AWS access (start from the managed
#      ReadOnlyAccess policy and remove data-plane reads you do not need),
#      s3:GetObject + s3:ListBucket on the state bucket/key, and an EKS
#      access entry with AmazonEKSAdminViewPolicy, which eks.tf creates
#      from `terraform_plan_role_arn` (set below, see 5). The Helm
#      provider refreshes releases by reading their Secrets, so the plan
#      role needs that view. No write anywhere. The plans run with
#      -lock=false so the role does not even need to write the .tflock
#      object.
#
#      If the state bucket uses SSE-KMS (bootstrap-state.sh with a key
#      ARN, `kms_key_id` in backend-s3.tf), every state read also needs
#      kms:Decrypt on that key, and ReadOnlyAccess does not include it.
#      Grant the plan role kms:Decrypt on the state key ARN only.
#
#      Apply role permissions: what this tree creates (EKS, EC2/VPC, IAM
#      roles and policies, KMS, S3, SQS, CloudWatch Logs) plus state
#      read/write and lock-file put/delete. With an SSE-KMS state bucket
#      that also means kms:Decrypt and kms:GenerateDataKey on the state
#      key: writing the state and the .tflock object encrypts them with
#      it. The key policy must allow both roles too: name them in it, or
#      keep the default statement that lets IAM policies in the account
#      grant use of the key. Start from a broad policy in a
#      sandbox, then narrow it with IAM Access Analyzer's
#      policy-generation from CloudTrail. Do not leave AdministratorAccess
#      on it. Note that this tree installs Helm charts and CRDs through
#      the kubernetes/helm/kubectl providers, so the identity that applies
#      it is necessarily cluster-admin (eks.tf's terraform-apply access
#      entry, see 5). That makes the apply role's trust policy and the
#      production environment's reviewers the controls that matter most
#      here.
#
#   5. CI-mode inputs (eks.tf, kubeconfig.tf). The env block below sets,
#      for every job:
#
#        enable_cluster_creator_admin_permissions = false
#        terraform_apply_role_arn = TF_APPLY_ROLE_ARN  (cluster-admin access
#                                                      entry; KMS key admin)
#        terraform_plan_role_arn  = TF_PLAN_ROLE_ARN   (view-only entry)
#        write_kubeconfig = false    (no runner-local kubeconfig.yaml, which
#                                     every later run would see as deleted;
#                                     kubeconfig.tf)
#
#      Do not turn the creator entry back on here. The EKS module does not
#      record the cluster's creator once: it re-derives "the creator" from
#      whoever runs each plan. Under this workflow that is the read-only
#      plan role, so every plan-main would propose replacing the admin
#      entry with one for the plan role and making the plan role the
#      administrator of the cluster's KMS key, and approving it would do
#      exactly that. variables.tf refuses that combination. A cluster the
#      apply role already created in laptop mode needs its creator entry
#      renamed in state before the switch (platform README, "GitHub
#      Actions workflow").
#
# PR PLANS RUN PR CODE. `terraform plan` executes provider plugins, data
# sources (including `external` and `http`) and module code from the PR
# branch, with whatever credentials the job holds. Whoever can push a branch
# can therefore use the plan role. That is why it is read-only and why it
# is a different role from apply. Without `id-token: write` a run cannot
# request an OIDC token. If a fork's run cannot request one, plan-pr fails at
# the credentials step, which is the safe outcome.
#
# PLAN ARTIFACTS CONTAIN SECRETS. A saved plan holds every attribute value
# in cleartext, sensitive ones included. Artifacts are readable by anyone
# who can read the repository, and on a public repo that is everyone. Run
# this in a private repository, or encrypt tfplan before upload. Retention
# is 1 day either way.
#
# PLAN TEXT IS AS PUBLIC AS THE REPOSITORY. The job log and the job summary
# are readable by the same people as the artifact. Plan text carries
# attribute values that are not credentials but are a map of the account
# (IPs, ARNs, tags, IAM policy documents), the same reason the drift check
# keeps plan output out of its issue. So the plan jobs never print the
# plan to the log (it goes to a file), and the summary depends on the
# repository's visibility: the full `terraform show` text on a private
# repository, resource addresses and actions only on a public one. On a
# public repository the approver therefore reads the detail by running the
# same plan locally with the read-only role. That is one more reason to
# run this workflow in a private repository.
################################################################################

name: terraform

on:
  pull_request:
    paths:
      - 'full-guide/examples/bookstore-platform/terraform/**'
  push:
    branches:
      - main
    paths:
      - 'full-guide/examples/bookstore-platform/terraform/**'

# Nothing at workflow level. Each job asks for exactly what it uses.
permissions: {}

# One Terraform run per ref at a time; never cancel an apply mid-flight.
concurrency:
  group: terraform-${{ github.ref }}
  cancel-in-progress: false

env:
  TF_VERSION: '1.14.8'
  WORKING_DIR: 'full-guide/examples/bookstore-platform/terraform'
  AWS_REGION: ${{ vars.AWS_REGION || 'ap-south-1' }}
  # CI-mode inputs (PREREQUISITES 5). Every job plans or applies the same
  # configuration, so every job gets the same inputs.
  TF_VAR_enable_cluster_creator_admin_permissions: 'false'
  TF_VAR_terraform_apply_role_arn: ${{ vars.TF_APPLY_ROLE_ARN }}
  TF_VAR_terraform_plan_role_arn: ${{ vars.TF_PLAN_ROLE_ARN }}
  # No kubeconfig.yaml on a runner: it would be missing on every later run
  # and show up as a change in every plan (kubeconfig.tf).
  TF_VAR_write_kubeconfig: 'false'

jobs:
  ##############################################################################
  # plan-pr — speculative plan for code review. Never applied.
  ##############################################################################
  plan-pr:
    name: terraform plan (PR, speculative)
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    environment: terraform-plan
    permissions:
      contents: read
      id-token: write          # OIDC token for the read-only plan role
    defaults:
      run:
        working-directory: ${{ env.WORKING_DIR }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: ${{ env.TF_VERSION }}
          terraform_wrapper: false

      - name: Require a remote backend
        run: |
          if ! grep -qE '^[[:space:]]*backend[[:space:]]+"s3"' ./*.tf; then
            echo "::error::No backend \"s3\" block in ${WORKING_DIR}/*.tf. CI must never run against local state. See backend-s3.tf.example."
            exit 1
          fi

      - name: terraform fmt -check
        run: terraform fmt -recursive -check

      - name: Configure AWS credentials (read-only plan role)
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ vars.TF_PLAN_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
          audience: sts.amazonaws.com

      - name: terraform init
        # -lockfile=readonly: install exactly the committed provider versions
        # and hashes (.terraform.lock.hcl), or fail.
        run: terraform init -input=false -lockfile=readonly

      - name: terraform validate
        run: terraform validate -no-color

      - name: terraform plan
        # -lock=false keeps the plan role read-only on the state bucket. A
        # speculative plan that reads state mid-apply sees either the old or
        # the new object (S3 writes are atomic); nothing is applied from it.
        env:
          REPO_PRIVATE: ${{ github.event.repository.private }}
        run: |
          # Plan text goes to a file, never the log ("PLAN TEXT IS AS PUBLIC
          # AS THE REPOSITORY" in the header).
          set +e
          terraform plan -input=false -no-color -lock=false -out=tfplan > plan.log 2>&1
          rc=$?
          set -e
          if [ "$rc" -ne 0 ]; then
            echo "::error::terraform plan failed (exit $rc). Last lines:"
            tail -20 plan.log    # diagnostics, not resource values
            exit "$rc"
          fi
          {
            echo '## terraform plan (speculative, PR)'
            echo
            echo 'This plan is for review only and is never applied. The plan that'
            echo 'gets applied is recomputed on `main` after merge and approved there.'
            echo
            if [ "$REPO_PRIVATE" = "true" ]; then
              echo '```'
              terraform show -no-color tfplan
              echo '```'
            else
              echo 'Public repository: addresses and actions only (see the workflow header).'
              echo
              terraform show -json tfplan \
                | jq -r '.resource_changes[]? | select(.change.actions != ["no-op"])
                         | "- `\(.address)`: \(.change.actions | join(", "))"'
            fi
          } >> "$GITHUB_STEP_SUMMARY"

  ##############################################################################
  # plan-main — the plan that will be applied, computed on main after merge.
  ##############################################################################
  plan-main:
    name: terraform plan (main, to apply)
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: terraform-plan
    permissions:
      contents: read
      id-token: write
    outputs:
      has_changes: ${{ steps.plan.outputs.has_changes }}
    defaults:
      run:
        working-directory: ${{ env.WORKING_DIR }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: ${{ env.TF_VERSION }}
          terraform_wrapper: false

      - name: Require a remote backend
        run: |
          if ! grep -qE '^[[:space:]]*backend[[:space:]]+"s3"' ./*.tf; then
            echo "::error::No backend \"s3\" block in ${WORKING_DIR}/*.tf. CI must never run against local state. See backend-s3.tf.example."
            exit 1
          fi

      - name: Configure AWS credentials (read-only plan role)
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ vars.TF_PLAN_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
          audience: sts.amazonaws.com

      - name: terraform init
        run: terraform init -input=false -lockfile=readonly

      - name: terraform plan
        id: plan
        env:
          REPO_PRIVATE: ${{ github.event.repository.private }}
        run: |
          # Plan text goes to a file, never the log (see the header).
          set +e
          terraform plan -input=false -no-color -lock=false -detailed-exitcode -out=tfplan > plan.log 2>&1
          rc=$?
          set -e
          case "$rc" in
            0) echo "has_changes=false" >> "$GITHUB_OUTPUT" ;;
            2) echo "has_changes=true"  >> "$GITHUB_OUTPUT" ;;
            *) echo "::error::terraform plan failed (exit $rc). Last lines:"
               tail -20 plan.log    # diagnostics, not resource values
               exit "$rc" ;;
          esac
          {
            echo '## terraform plan (main): this is what `apply` will do'
            echo
            echo "Commit: \`${GITHUB_SHA}\`. Approving the \`production\` deployment applies exactly this plan."
            echo
            if [ "$REPO_PRIVATE" = "true" ]; then
              echo '```'
              terraform show -no-color tfplan
              echo '```'
            else
              echo 'Public repository: addresses and actions only. Before approving,'
              echo 'run the same plan locally with the read-only role to read the'
              echo 'attribute-level diff (see the workflow header).'
              echo
              terraform show -json tfplan \
                | jq -r '.resource_changes[]? | select(.change.actions != ["no-op"])
                         | "- `\(.address)`: \(.change.actions | join(", "))"'
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload the saved plan (this run only)
        if: steps.plan.outputs.has_changes == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: tfplan-main-${{ github.run_id }}
          path: ${{ env.WORKING_DIR }}/tfplan
          retention-days: 1          # cleartext values; keep it short-lived
          if-no-files-found: error

  ##############################################################################
  # apply — gated by the `production` environment, applies the saved plan.
  ##############################################################################
  apply:
    name: terraform apply (approved plan)
    needs: plan-main
    if: needs.plan-main.outputs.has_changes == 'true'
    runs-on: ubuntu-latest
    # Required reviewers + "main only" are configured on the environment in
    # repo settings. Until they are, this line gates nothing; see header.
    environment: production
    permissions:
      contents: read
      id-token: write          # OIDC token for the apply role
    defaults:
      run:
        working-directory: ${{ env.WORKING_DIR }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: ${{ env.TF_VERSION }}
          terraform_wrapper: false

      - name: Download the saved plan from plan-main (same run)
        # No run-id: the artifact comes from this workflow run, i.e. from the
        # plan-main job whose output the approver just read. If it is
        # missing, the step fails and nothing is applied.
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: tfplan-main-${{ github.run_id }}
          path: ${{ env.WORKING_DIR }}

      - name: Configure AWS credentials (apply role)
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ vars.TF_APPLY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
          audience: sts.amazonaws.com

      - name: terraform init
        run: terraform init -input=false -lockfile=readonly

      - name: terraform apply tfplan
        # A saved plan applies without prompting, so there is no
        # -auto-approve. The human approval was the environment gate. If
        # state changed after plan-main, Terraform rejects the stale plan
        # and this job fails. Re-run the workflow to plan again.
        run: terraform apply -input=false tfplan
