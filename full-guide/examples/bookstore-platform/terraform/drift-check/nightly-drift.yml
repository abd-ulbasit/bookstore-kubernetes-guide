################################################################################
# nightly-drift.yml — sample GitHub Actions workflow for nightly drift
# detection on the bookstore-platform Terraform tree.
#
# Copy this to .github/workflows/ in YOUR repository. Adjust WORKING_DIR and
# the region to match your setup. It reuses the read-only plan role from
# ../.github/workflows/terraform.yml; read that header first.
#
# What it does:
#   - Runs every night at 03:00 UTC (cron '0 3 * * *').
#   - Runs `terraform plan -refresh-only -detailed-exitcode`.
#   - Exit code 0 = state matches the real resources. Exit code 2 = refresh
#     found a difference (see "What exit code 2 means" below).
#   - On drift, opens (or comments on) one GitHub issue that lists the
#     drifted resource ADDRESSES and links the run. It never posts plan
#     output.
#
# Why -refresh-only, not a full plan: a full plan reports the union of
# "the cloud changed under us" (drift) and "main has code nobody applied
# yet" (a pending change), and cannot tell them apart. -refresh-only
# compares state with the real cloud and ignores the configuration, so
# unapplied code never trips it. Unapplied code is the apply workflow's
# job, not an incident.
#
# What exit code 2 means: some resource in state no longer matches what
# refresh reads back. That is drift, but not always a problem: an AWS-side
# update (an EKS platform-version bump, a managed add-on update) counts
# too, and DRIFT.md Step 2 is how to tell them apart. It is NOT a reliable
# signal for anything that lives on the machine that ran the last apply,
# because a fresh runner never has it. In this tree that is
# local_file.kubeconfig, which is why TF_VAR_write_kubeconfig is false
# below and in terraform.yml. (A state written by a laptop apply still
# holds that file; the first CI apply removes it from state. Until then
# this check reports `local_file.kubeconfig[0]` as deleted.)
#
# Why no plan output in the issue: plan text carries attribute values (IPs,
# ARNs, tags, policy documents, anything not marked sensitive), and on a
# public repository an issue is world-readable. The issue gets resource
# addresses and a link; the operator reproduces the detail locally with the
# same command (see DRIFT.md). For the same reason the plan is written to a
# file and not echoed to the (also public) job log.
#
# Credentials: the READ-ONLY plan role (repository variable
# TF_PLAN_ROLE_ARN), through a third environment, `terraform-drift`
# (deployment branches: main only; no reviewers, because nobody is awake
# at 03:00 to approve). Add its sub to the plan role's trust policy:
#   "token.actions.githubusercontent.com:sub": [
#     "repo:GITHUB_ORG/GITHUB_REPO:environment:terraform-plan",
#     "repo:GITHUB_ORG/GITHUB_REPO:environment:terraform-drift"
#   ]
# (StringEquals with a list matches any one of the values.) Drift detection
# never needs write access, so it must never use the apply role.
#
# Why nightly? Drift accumulates from console actions, out-of-band Terraform
# runs, IAM-policy auto-rotation, EBS auto-grow, ASG re-creations after
# instance failures. You want to catch it before the next deploy compounds it.
################################################################################

name: terraform-drift-check

on:
  schedule:
    # 03:00 UTC daily. Tune to a low-traffic window for your team.
    - cron: '0 3 * * *'
  workflow_dispatch:
    # Allow manual triggering via the Actions tab.

permissions: {}

env:
  TF_VERSION: '1.14.8'
  WORKING_DIR: 'full-guide/examples/bookstore-platform/terraform'
  AWS_REGION: ${{ vars.AWS_REGION || 'ap-south-1' }}
  # Same CI-mode inputs as terraform.yml (its PREREQUISITES 5), so the
  # drift check evaluates the configuration CI applies.
  TF_VAR_enable_cluster_creator_admin_permissions: 'false'
  TF_VAR_terraform_apply_role_arn: ${{ vars.TF_APPLY_ROLE_ARN }}
  TF_VAR_terraform_plan_role_arn: ${{ vars.TF_PLAN_ROLE_ARN }}
  # No kubeconfig.yaml on a runner: it would be missing on every later run
  # and show up as a change in every plan (kubeconfig.tf).
  TF_VAR_write_kubeconfig: 'false'

jobs:
  drift-check:
    name: terraform plan -refresh-only (drift check)
    runs-on: ubuntu-latest
    environment: terraform-drift
    permissions:
      contents: read
      id-token: write          # OIDC token for the read-only plan role
    outputs:
      drift: ${{ steps.plan.outputs.drift }}
      addresses: ${{ steps.plan.outputs.addresses }}
    defaults:
      run:
        working-directory: ${{ env.WORKING_DIR }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: ${{ env.TF_VERSION }}
          terraform_wrapper: false

      - name: Require a remote backend
        run: |
          if ! grep -qE '^[[:space:]]*backend[[:space:]]+"s3"' ./*.tf; then
            echo "::error::No backend \"s3\" block in ${WORKING_DIR}/*.tf. A drift check against local state checks nothing."
            exit 1
          fi

      - name: Configure AWS credentials (read-only plan role)
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ vars.TF_PLAN_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
          audience: sts.amazonaws.com

      - name: terraform init
        run: terraform init -input=false -lockfile=readonly

      - name: terraform plan -refresh-only -detailed-exitcode
        id: plan
        run: |
          set +e
          # Output goes to a file, not the log: see the header.
          terraform plan -refresh-only -input=false -lock=false -no-color \
            -detailed-exitcode -out=drift.tfplan > plan_output.txt 2>&1
          rc=$?
          set -e
          case "$rc" in
            0)
              echo "drift=false" >> "$GITHUB_OUTPUT"
              echo "No drift." ;;
            2)
              echo "drift=true" >> "$GITHUB_OUTPUT"
              # Addresses and change types only, never attribute values.
              addresses=$(terraform show -json drift.tfplan \
                | jq -c '[.resource_drift[]? | "\(.address) (\(.change.actions | join(",")))"]')
              echo "addresses=${addresses}" >> "$GITHUB_OUTPUT"
              {
                echo '## Drift detected'
                echo
                printf '%s' "$addresses" | jq -r '.[] | "- `\(.)`"'
              } >> "$GITHUB_STEP_SUMMARY" ;;
            *)
              echo "::error::terraform plan failed (exit $rc). The error is in"
              echo "plan_output.txt on the runner; re-run locally to see it."
              # Error text is shown: it is diagnostics, not resource values.
              tail -20 plan_output.txt
              exit "$rc" ;;
          esac

  open-or-update-issue:
    name: open or update the drift issue
    needs: drift-check
    if: needs.drift-check.outputs.drift == 'true'
    runs-on: ubuntu-latest
    permissions:
      issues: write            # this job holds no cloud credentials
    steps:
      - name: Open or update drift issue (dedup by label)
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          ADDRESSES: ${{ needs.drift-check.outputs.addresses }}
        with:
          script: |
            const addresses = JSON.parse(process.env.ADDRESSES || '[]');
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const today = new Date().toISOString().slice(0, 10);
            const body = [
              '## Terraform drift detected',
              '',
              `Detection run: ${today} (${runUrl})`,
              '',
              '`terraform plan -refresh-only` found resources whose real',
              'configuration no longer matches state. Drifted addresses:',
              '',
              ...addresses.map((a) => `- \`${a}\``),
              '',
              'Plan output is deliberately not posted here (issues are public on',
              'a public repo). Reproduce locally with the read-only role:',
              '',
              '```bash',
              'terraform plan -refresh-only -detailed-exitcode',
              '```',
              '',
              'Then follow `drift-check/DRIFT.md`.',
            ].join('\n');

            // Dedup: one open issue labelled `drift-detected`; append a
            // dated comment instead of opening a new issue each night.
            const existing = await github.paginate(
              github.rest.issues.listForRepo,
              {
                owner: context.repo.owner,
                repo:  context.repo.repo,
                state: 'open',
                labels: 'drift-detected',
                per_page: 100,
              },
            );

            if (existing.length > 0) {
              const issue = existing[0];
              console.log(`Updating existing drift issue #${issue.number}`);
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo:  context.repo.repo,
                issue_number: issue.number,
                body,
              });
            } else {
              console.log('Creating new drift issue');
              await github.rest.issues.create({
                owner: context.repo.owner,
                repo:  context.repo.repo,
                title: `Drift detected on ${today}`,
                body,
                labels: ['drift-detected', 'terraform', 'ops'],
              });
            }

      - name: Fail the run on drift
        run: |
          echo "Drift detected. Issue opened or updated."
          exit 1
