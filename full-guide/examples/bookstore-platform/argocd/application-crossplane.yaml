# Bookstore Platform v2 — Part 13 ch.02: Argo CD Application that installs
# Crossplane via the pinned crossplane-stable Helm chart into the
# `crossplane-system` namespace.
#
# Crossplane's Helm chart pins compatible versions of its core controller;
# provider-kubernetes and function-patch-and-transform are installed as
# Crossplane CRs AFTER Crossplane itself is running. We do NOT bundle them
# into this Application — that creates a chicken-and-egg (the Provider /
# Function CRDs only exist once Crossplane is up). The README in
# `../crossplane/` walks the post-install steps.
#
# !!! CRD-INTRINSIC DRY-RUN
#   `Application` is `argoproj.io/v1alpha1` — an Argo CD CRD. WITHOUT Argo
#   CD installed, a client dry-run prints:
#     no matches for kind "Application" in version "argoproj.io/v1alpha1"
#   EXPECTED.
#
# Apply (after Argo CD installed):
#   kubectl apply -f examples/bookstore-platform/argocd/application-crossplane.yaml
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: crossplane
  namespace: argocd
  labels:
    app.kubernetes.io/part-of: bookstore-platform
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: "https://charts.crossplane.io/stable"
    chart: crossplane
    # Pinned. Bump deliberately; never `latest`. The 2.x chart serves the v2
    # XRD that 13.02 uses; the 1.x chart does not.
    targetRevision: "2.4.3"
    helm:
      releaseName: crossplane
      values: |
        # The same restricted contexts 13.02 sets: the chart leaves seccomp
        # unset and drops no capabilities by default. Both chart Deployments
        # and their pods are spelled out here for the audit trail.
        securityContextCrossplane:
          runAsNonRoot: true
          runAsUser: 65532
          runAsGroup: 65532
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop: ["ALL"]
          seccompProfile:
            type: RuntimeDefault
        securityContextRBACManager:
          runAsNonRoot: true
          runAsUser: 65532
          runAsGroup: 65532
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop: ["ALL"]
          seccompProfile:
            type: RuntimeDefault
        podSecurityContextCrossplane:
          runAsNonRoot: true
          seccompProfile:
            type: RuntimeDefault
        podSecurityContextRBACManager:
          runAsNonRoot: true
          seccompProfile:
            type: RuntimeDefault
        # Resource defaults — kind-friendly. Production tightens.
        resourcesCrossplane:
          requests:
            cpu: 100m
            memory: 256Mi
          limits:
            cpu: "1"
            memory: 512Mi
        metrics:
          enabled: true
  destination:
    server: https://kubernetes.default.svc
    namespace: crossplane-system
  syncPolicy:
    automated:
      prune: false
      selfHeal: true
    # No CreateNamespace: the namespace is created first, with its Pod Security
    # labels (13.02 section 1), so the install never runs unlabelled.
    syncOptions:
      - ServerSideApply=true
