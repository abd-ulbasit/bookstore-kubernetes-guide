# Bookstore Platform v2 : Part 13 ch.06: stripe-mock, a Stripe-API-compatible
# mock for the kind sandbox. It stands in for api.stripe.com when you have no
# Stripe account. Never deploy it to production: the gateway then charges no
# real card.
#
# The image is pinned by digest (tag v0.206.0, checked on Docker Hub). It
# declares no user, so the Pod sets one. The Pod meets the restricted profile
# like every other workload in this namespace.
#
# Apply:
#   kubectl apply -f examples/bookstore-platform/payments/stripe-mock.yaml
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: stripe-mock
  namespace: bookstore-platform-payments
  labels:
    app.kubernetes.io/part-of: bookstore-platform
    app.kubernetes.io/component: stripe-mock
automountServiceAccountToken: false
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: stripe-mock
  namespace: bookstore-platform-payments
  labels:
    app: stripe-mock
    app.kubernetes.io/part-of: bookstore-platform
    app.kubernetes.io/component: stripe-mock
spec:
  replicas: 1
  selector:
    matchLabels:
      app: stripe-mock
  template:
    metadata:
      labels:
        app: stripe-mock
        app.kubernetes.io/part-of: bookstore-platform
    spec:
      serviceAccountName: stripe-mock
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: stripe-mock
          # tag v0.206.0 (stripe/stripe-mock on Docker Hub)
          image: stripe/stripe-mock@sha256:aeb96b83e87a893d2ac005e363ac01ffa6e59a5ad85b49c155dfc9129de02e78
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 12111
              name: http
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              memory: 128Mi
          readinessProbe:
            tcpSocket:
              port: 12111
            initialDelaySeconds: 2
            periodSeconds: 5
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: stripe-mock
  namespace: bookstore-platform-payments
  labels:
    app.kubernetes.io/part-of: bookstore-platform
    app.kubernetes.io/component: stripe-mock
spec:
  selector:
    app: stripe-mock
  ports:
    - name: http
      port: 12111
      targetPort: 12111
