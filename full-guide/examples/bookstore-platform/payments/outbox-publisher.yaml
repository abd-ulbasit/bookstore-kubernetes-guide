# Bookstore Platform v2: Part 13 ch.06: the outbox publisher. Reads the
# `outbox` table in Postgres and publishes each row to Kafka's `orders.placed`
# topic, then marks the row published. The orders-service writes the order row
# and the outbox row in ONE transaction, which gives at-least-once delivery
# without 2PC.
#
# The image bookstore-platform/events:dev runs the loop with EVENTS_MODE=outbox
# (source: ../app/events/outbox.go).
#
# Production-shape details enforced here:
#   - Three replicas share the outbox. Each batch is claimed with
#     FOR UPDATE SKIP LOCKED, so no row is published by two replicas at once.
#   - TLS to the cluster listener, as the outbox-publisher KafkaUser. Its ACL
#     allows Write on orders.placed and nothing else (kafka-users.yaml).
#   - The database password arrives from ESO (stripe-eso-externalsecret.yaml).
#     This Pod holds no literal Secret.
#   - At-least-once delivery (acks=all); consumers dedupe on event_id.
#
# Apply:
#   kubectl apply -f examples/bookstore-platform/payments/outbox-publisher.yaml
---
apiVersion: v1
kind: Namespace
metadata:
  name: bookstore-platform-payments
  labels:
    app.kubernetes.io/part-of: bookstore-platform
    bookstore-platform.example.com/scope: payments
    pod-security.kubernetes.io/enforce: restricted
    pod-security.kubernetes.io/enforce-version: latest
    pod-security.kubernetes.io/audit: restricted
    pod-security.kubernetes.io/audit-version: latest
    pod-security.kubernetes.io/warn: restricted
    pod-security.kubernetes.io/warn-version: latest
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: outbox-publisher
  namespace: bookstore-platform-payments
  labels:
    app.kubernetes.io/part-of: bookstore-platform
    app.kubernetes.io/component: outbox-publisher
automountServiceAccountToken: false
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: outbox-publisher
  namespace: bookstore-platform-payments
  labels:
    app: outbox-publisher
    app.kubernetes.io/part-of: bookstore-platform
    app.kubernetes.io/component: outbox-publisher
spec:
  replicas: 3
  selector:
    matchLabels:
      app: outbox-publisher
  template:
    metadata:
      labels:
        app: outbox-publisher
        app.kubernetes.io/part-of: bookstore-platform
    spec:
      serviceAccountName: outbox-publisher
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: events
          image: bookstore-platform/events:dev
          imagePullPolicy: IfNotPresent
          env:
            - name: EVENTS_MODE
              value: "outbox"
            - name: KAFKA_BROKERS
              value: "bookstore-platform-kafka-kafka-bootstrap.kafka-system.svc.cluster.local:9093"
            - name: KAFKA_TLS_DIR
              value: "/etc/kafka/tls"
            - name: KAFKA_TOPIC_ORDERS_PLACED
              value: "orders.placed"
            - name: DB_DSN
              valueFrom:
                secretKeyRef:
                  name: outbox-publisher-db
                  key: dsn
            - name: LOG_LEVEL
              value: "info"
            - name: PORT
              value: "8080"
          ports:
            - containerPort: 8080
              name: http
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              memory: 256Mi
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 30
          readinessProbe:
            httpGet:
              path: /readyz
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 10
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: tmp
              mountPath: /tmp
            - name: kafka-tls
              mountPath: /etc/kafka/tls
              readOnly: true
      volumes:
        - name: tmp
          emptyDir: {}
        - name: kafka-tls
          secret:
            secretName: outbox-publisher-kafka
