# Bookstore Platform v2: Part 13 ch.06: the ExternalSecrets that fill every
# credential of the payments path from Vault: the Stripe API key and webhook
# secret, the two database DSNs (one per role), and each Kafka client's
# certificate. No file in payments/ or app/payments-gateway/ holds a literal
# credential. Each ExternalSecret writes a Secret with the name its workload
# mounts.
#
# This is the pattern Part 11 ch.05 teaches (ESO and Vault). The Kafka
# certificates come from another namespace: a SecretStore of the kubernetes
# provider reads only the three named secrets in kafka-system, through the
# Role in kafka-users.yaml.
#
# !!! CRD-INTRINSIC DRY-RUN
#   ExternalSecret and SecretStore are external-secrets.io/v1beta1, ESO CRDs.
#   Without ESO installed:
#     no matches for kind "ExternalSecret" in version "external-secrets.io/v1beta1"
#   EXPECTED. ESO 0.10.4 (the chart pinned in 11.05) serves both kinds.
#
# Apply (after ESO and a ClusterSecretStore wired to your Vault):
#   kubectl apply -f examples/bookstore-platform/payments/stripe-eso-externalsecret.yaml
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: payments-kafka-reader
  namespace: bookstore-platform-payments
  labels:
    app.kubernetes.io/part-of: bookstore-platform
    app.kubernetes.io/component: payments-secrets
automountServiceAccountToken: false
---
apiVersion: external-secrets.io/v1beta1
kind: SecretStore
metadata:
  name: payments-kafka-secrets
  namespace: bookstore-platform-payments
  labels:
    app.kubernetes.io/part-of: bookstore-platform
    app.kubernetes.io/component: payments-secrets
spec:
  provider:
    kubernetes:
      # The Strimzi user secrets live here; the Role in kafka-users.yaml names
      # the three that this store may read.
      remoteNamespace: kafka-system
      server:
        url: "https://kubernetes.default.svc"
        caProvider:
          type: ConfigMap
          name: kube-root-ca.crt
          key: ca.crt
      auth:
        serviceAccount:
          name: payments-kafka-reader
---
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: stripe-api-key
  namespace: bookstore-platform-payments
  labels:
    app.kubernetes.io/part-of: bookstore-platform
    app.kubernetes.io/component: payments-secrets
spec:
  refreshInterval: 1h
  secretStoreRef:
    # Cluster-scoped store wired to Vault in `bookstore-platform-system`.
    # Part 11 ch.05 wires the ClusterSecretStore and the Vault auth (the
    # Kubernetes auth method, one role per tenant).
    name: bookstore-platform-vault
    kind: ClusterSecretStore
  target:
    # Materialises as the Secret payments-gateway mounts.
    name: stripe-api-key
    creationPolicy: Owner
  data:
    - secretKey: api-key
      remoteRef:
        key: kv/bookstore-platform/stripe
        property: api_key
---
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: stripe-webhook-secret
  namespace: bookstore-platform-payments
  labels:
    app.kubernetes.io/part-of: bookstore-platform
    app.kubernetes.io/component: payments-secrets
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: bookstore-platform-vault
    kind: ClusterSecretStore
  target:
    name: stripe-webhook-secret
    creationPolicy: Owner
  data:
    - secretKey: webhook-secret
      remoteRef:
        key: kv/bookstore-platform/stripe
        property: webhook_secret
---
# One DSN per database role: the outbox publisher reads and marks outbox rows,
# the worker reads and inserts payments rows (outbox-ddl.sql).
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: outbox-publisher-db
  namespace: bookstore-platform-payments
  labels:
    app.kubernetes.io/part-of: bookstore-platform
    app.kubernetes.io/component: payments-secrets
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: bookstore-platform-vault
    kind: ClusterSecretStore
  target:
    name: outbox-publisher-db
    creationPolicy: Owner
  data:
    - secretKey: dsn
      remoteRef:
        key: kv/bookstore-platform/payments/db-outbox
        property: dsn
---
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: payments-worker-db
  namespace: bookstore-platform-payments
  labels:
    app.kubernetes.io/part-of: bookstore-platform
    app.kubernetes.io/component: payments-secrets
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: bookstore-platform-vault
    kind: ClusterSecretStore
  target:
    name: payments-worker-db
    creationPolicy: Owner
  data:
    - secretKey: dsn
      remoteRef:
        key: kv/bookstore-platform/payments/db-worker
        property: dsn
---
# Each Kafka client takes the three files of its KafkaUser secret (ca.crt,
# user.crt, user.key). The cluster CA is in every one of them.
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: outbox-publisher-kafka
  namespace: bookstore-platform-payments
  labels:
    app.kubernetes.io/part-of: bookstore-platform
    app.kubernetes.io/component: payments-secrets
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: payments-kafka-secrets
    kind: SecretStore
  target:
    name: outbox-publisher-kafka
    creationPolicy: Owner
  dataFrom:
    - extract:
        key: outbox-publisher
---
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: payments-worker-kafka
  namespace: bookstore-platform-payments
  labels:
    app.kubernetes.io/part-of: bookstore-platform
    app.kubernetes.io/component: payments-secrets
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: payments-kafka-secrets
    kind: SecretStore
  target:
    name: payments-worker-kafka
    creationPolicy: Owner
  dataFrom:
    - extract:
        key: payments-worker
---
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: payments-webhook-receiver-kafka
  namespace: bookstore-platform-payments
  labels:
    app.kubernetes.io/part-of: bookstore-platform
    app.kubernetes.io/component: payments-secrets
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: payments-kafka-secrets
    kind: SecretStore
  target:
    name: payments-webhook-receiver-kafka
    creationPolicy: Owner
  dataFrom:
    - extract:
        key: payments-webhook-receiver
