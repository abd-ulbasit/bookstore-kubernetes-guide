# Bookstore Platform v2: Part 13 ch.06: the payments-worker. Consumes the
# `orders.placed` Kafka topic, asks the `payments-gateway` service to charge
# (the gateway holds the Stripe key and sets the Idempotency-Key), and records
# the payment intent in its `payments` table. The outcome goes to
# `payments.completed` or, on a 4xx, to `payments.failed`.
#
# Replay is covered twice. Stripe's Idempotency-Key (the event_id) stops a
# second charge for 24 hours. The `payments` table, checked before every call,
# stops one after that (app/events/payments.go).
#
# The worker holds no Stripe key and no outbox credential. Its database role
# can read and insert in `payments` only (outbox-ddl.sql), and its Kafka
# identity can write the two payment topics and read orders.placed
# (kafka-users.yaml).
#
# Apply:
#   kubectl apply -f examples/bookstore-platform/payments/payments-worker.yaml
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: payments-worker
  namespace: bookstore-platform-payments
  labels:
    app.kubernetes.io/part-of: bookstore-platform
    app.kubernetes.io/component: payments-worker
automountServiceAccountToken: false
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: payments-worker
  namespace: bookstore-platform-payments
  labels:
    app: payments-worker
    app.kubernetes.io/part-of: bookstore-platform
    app.kubernetes.io/component: payments-worker
spec:
  replicas: 3
  selector:
    matchLabels:
      app: payments-worker
  template:
    metadata:
      labels:
        app: payments-worker
        app.kubernetes.io/part-of: bookstore-platform
    spec:
      serviceAccountName: payments-worker
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: events
          image: bookstore-platform/events:dev
          imagePullPolicy: IfNotPresent
          env:
            - name: EVENTS_MODE
              value: "payments-worker"
            - name: KAFKA_BROKERS
              value: "bookstore-platform-kafka-kafka-bootstrap.kafka-system.svc.cluster.local:9093"
            - name: KAFKA_TLS_DIR
              value: "/etc/kafka/tls"
            - name: KAFKA_TOPIC_ORDERS_PLACED
              value: "orders.placed"
            - name: KAFKA_TOPIC_PAYMENTS_COMPLETED
              value: "payments.completed"
            - name: KAFKA_TOPIC_PAYMENTS_FAILED
              value: "payments.failed"
            - name: KAFKA_CONSUMER_GROUP
              value: "payments-worker"
            - name: PAYMENTS_GATEWAY_URL
              value: "http://payments-gateway.bookstore-platform-payments.svc.cluster.local:8080"
            - name: DB_DSN
              valueFrom:
                secretKeyRef:
                  name: payments-worker-db
                  key: dsn
            - name: LOG_LEVEL
              value: "info"
            - name: PORT
              value: "8080"
          ports:
            - containerPort: 8080
              name: http
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              memory: 256Mi
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 30
          readinessProbe:
            httpGet:
              path: /readyz
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 10
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: tmp
              mountPath: /tmp
            - name: kafka-tls
              mountPath: /etc/kafka/tls
              readOnly: true
      volumes:
        - name: tmp
          emptyDir: {}
        - name: kafka-tls
          secret:
            secretName: payments-worker-kafka
