# Bookstore Platform v2 — Part 13 ch.05: the ExternalSecret for the search
# service. It fills the search-only Meilisearch key (search on books-*) into the
# tenant namespace from Vault, through the tenant's own SecretStore, which
# Part 15 ch.05 creates (vault/secret-store.yaml). A ClusterSecretStore would
# log in as one identity for every namespace. The tenant's Vault policy reads
# only secret/data/bookstore-platform/acme-books/*, so the key sits there.
# No value is written in this file.
#   kubectl apply -f examples/bookstore-platform/app/search/external-secret.yaml
---
# The search-only key, from Vault through External Secrets.
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: meilisearch-search-key
  namespace: bookstore-platform-acme-books
  labels:
    app.kubernetes.io/part-of: bookstore-platform
    app.kubernetes.io/component: search-api
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: vault-bookstore-platform
    kind: SecretStore
  target:
    name: meilisearch-search-key
    creationPolicy: Owner
  data:
    - secretKey: api-key
      remoteRef:
        key: bookstore-platform/acme-books/meilisearch
        property: search_key
