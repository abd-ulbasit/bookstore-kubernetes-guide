# Bookstore Platform v2, Part 13 ch.09: Grafana datasources for Tempo and
# Loki. The Prometheus datasource comes from kube-prometheus-stack (uid
# "prometheus"), so this ConfigMap does not repeat it.
#
# The Grafana sidecar loads every ConfigMap labelled grafana_datasource: "1"
# (13.09 step 1 turns the sidecar on). The data key uses Grafana's
# provisioning file format.
#
# Apply:
#   kubectl apply -f examples/bookstore-platform/observability/grafana-datasources.yaml
apiVersion: v1
kind: ConfigMap
metadata:
  name: bookstore-platform-grafana-datasources
  namespace: prometheus-system
  labels:
    app.kubernetes.io/name: bookstore-platform-grafana-datasources
    app.kubernetes.io/part-of: bookstore-platform
    app.kubernetes.io/component: observability-datasource
    app.kubernetes.io/version: "1.0.0"
    grafana_datasource: "1"
data:
  bookstore-platform-datasources.yaml: |
    apiVersion: 1
    datasources:
      - name: Tempo
        uid: bookstore-platform-tempo
        type: tempo
        access: proxy
        url: http://tempo-query-frontend.tempo-system.svc.cluster.local:3100
        editable: false
        jsonData:
          # Click "view logs" on a span: Loki query for the same traceId.
          tracesToLogsV2:
            datasourceUid: bookstore-platform-loki
            spanStartTimeShift: -30s
            spanEndTimeShift: "30s"
            tags:
              - key: service.name
                value: service
            filterByTraceID: true
            filterBySpanID: false
          # Click "view metrics" on a span: RED query for the service.
          tracesToMetrics:
            datasourceUid: prometheus
            spanStartTimeShift: -30s
            spanEndTimeShift: "30s"
          serviceMap:
            datasourceUid: prometheus
          nodeGraph:
            enabled: true
      - name: Loki
        uid: bookstore-platform-loki
        type: loki
        access: proxy
        url: http://loki-gateway.loki-system.svc.cluster.local
        editable: false
        jsonData:
          maxLines: 1000
          derivedFields:
            # Render the traceID in log lines as a link to Tempo.
            - name: traceID
              matcherRegex: "traceID=(\\w+)"
              url: "${__value.raw}"
              datasourceUid: bookstore-platform-tempo
