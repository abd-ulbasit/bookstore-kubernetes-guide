# Bookstore Platform v2 - Part 13 ch.11: the Backstage Scaffolder
# Template "New Bookstore microservice". A developer fills the form;
# the template creates a new GitHub repo with a skeleton Go service,
# a Helm chart and an Argo CD Application inside an existing tenant.
# The tenant itself is onboarded by the platform team (Part 13 ch.02).
#
# v1 had no scaffolder; the v2 "5-minute new microservice" UX hangs
# on this template.
#
# The template is a Backstage catalog entity, NOT a Kubernetes object.
# The platform location in app-config.yaml (catalog.locations, with its
# own rules that allow Template) is the only source that may register
# it. A template from an ordinary repo would run with the backend's
# identity, so repos may not supply templates.
#
# Apply: NEVER via kubectl. Backstage's catalog ingests it.
---
apiVersion: scaffolder.backstage.io/v1beta3
kind: Template
metadata:
  name: new-bookstore-service
  title: "New Bookstore microservice"
  description: |
    Create a new microservice on the Bookstore Platform. Generates a
    skeleton Go service + Dockerfile + Helm chart + catalog-info.yaml
    + an Argo CD Application in an existing tenant.
  tags:
    - bookstore-platform
    - golden-path
    - go
spec:
  owner: team-platform
  type: service

  parameters:
    - title: Service basics
      required:
        - name
        - description
        - owner
      properties:
        name:
          title: Service name
          type: string
          description: |
            kebab-case; becomes the repo name + the Kubernetes
            workload name. Letters, digits, dashes only.
          pattern: "^[a-z][a-z0-9-]{2,30}$"
          ui:autofocus: true
        description:
          title: One-line description
          type: string
          maxLength: 100
        owner:
          title: Owning team
          type: string
          description: |
            Group entity ref (e.g. group:team-payments). The policy
            must accept only a group the submitter belongs to.
          ui:field: OwnerPicker
          ui:options:
            allowedKinds: [Group]
        system:
          title: System (logical grouping)
          type: string
          default: bookstore-platform
          ui:field: EntityPicker
          ui:options:
            allowedKinds: [System]

    - title: Service shape
      properties:
        port:
          title: HTTP port
          type: integer
          default: 8080
        language:
          title: Language
          type: string
          enum: ["go", "python", "node"]
          default: "go"

    - title: Tenant placement
      required:
        - tenant
      properties:
        tenant:
          title: Tenant slug
          type: string
          description: |
            An existing tenant (e.g. acme-books). The service deploys
            into bookstore-platform-<TENANT>. The form cannot create or
            change a tenant.
          pattern: "^[a-z][a-z0-9-]{2,30}$"

  steps:
    # 1. Clone the skeleton repo + render placeholders.
    - id: fetch
      name: Fetch skeleton
      action: fetch:template
      input:
        url: https://github.com/your-org/bookstore-platform/tree/main/scaffolder-skeletons/${{ parameters.language }}-service
        values:
          name: ${{ parameters.name }}
          description: ${{ parameters.description }}
          owner: ${{ parameters.owner }}
          system: ${{ parameters.system }}
          port: ${{ parameters.port }}
          tenant: ${{ parameters.tenant }}

    # 2. Create the GitHub repo + push the initial commit to main, then
    # protect main so changes need a code-owner review.
    - id: publish
      name: Publish to GitHub
      action: publish:github
      input:
        allowedHosts: ['github.com']
        description: ${{ parameters.description }}
        repoUrl: github.com?owner=your-org&repo=bookstore-platform-${{ parameters.name }}
        defaultBranch: main
        protectDefaultBranch: true
        repoVisibility: private
        requireCodeOwnerReviews: true

    # 3. Apply an Argo CD Application that points at the new repo. The
    # bookstore-tenants project limits it to bookstore-platform-* namespaces
    # and repositories. CreateNamespace is off: the tenant's namespace must
    # already exist, with the labels and policies the tenant claim gives it.
    - id: argocd-app
      name: Register Argo CD Application
      action: kubernetes:apply
      input:
        clusterRef: bookstore-platform-us-east
        manifest: |
          apiVersion: argoproj.io/v1alpha1
          kind: Application
          metadata:
            name: bookstore-${{ parameters.name }}-us-east
            namespace: argocd
          spec:
            project: bookstore-tenants
            source:
              repoURL: https://github.com/your-org/bookstore-platform-${{ parameters.name }}
              path: helm
              targetRevision: HEAD
              helm:
                releaseName: ${{ parameters.name }}
            destination:
              server: https://kubernetes.default.svc
              namespace: bookstore-platform-${{ parameters.tenant }}
            syncPolicy:
              automated: { prune: true, selfHeal: true }
              syncOptions: [ServerSideApply=true]

    # 4. Register the new repo with Backstage's Catalog so it appears
    # in the UI immediately (does not wait for the next discovery run).
    - id: register
      name: Register in catalog
      action: catalog:register
      input:
        repoContentsUrl: ${{ steps.publish.output.repoContentsUrl }}
        catalogInfoPath: /catalog-info.yaml

  output:
    links:
      - title: Repository
        url: ${{ steps.publish.output.remoteUrl }}
      - title: Catalog entity
        icon: catalog
        entityRef: ${{ steps.register.output.entityRef }}
      - title: Argo CD Application
        url: https://argocd.bookstore-platform.example.com/applications/bookstore-${{ parameters.name }}-us-east
