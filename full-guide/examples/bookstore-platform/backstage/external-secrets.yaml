# Bookstore Platform v2 - Part 13 ch.11: the ExternalSecrets that fill the
# Backstage credentials from Vault. The app config and the chart read them
# as environment variables; no value is written into a manifest. Two Secrets:
# backstage-postgresql holds the keys the bundled Postgres reads, and
# backstage-runtime holds the rest, loaded whole through envFrom.
#
# The ClusterSecretStore is the one Part 13 ch.06 wires for the payments path.
#
# Apply:
#   kubectl apply -f examples/bookstore-platform/backstage/external-secrets.yaml
---
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: backstage-postgresql
  namespace: backstage
  labels:
    app.kubernetes.io/part-of: bookstore-platform
    app.kubernetes.io/component: developer-portal-secrets
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: bookstore-platform-vault
    kind: ClusterSecretStore
  target:
    name: backstage-postgresql
    creationPolicy: Owner
  data:
    - secretKey: admin-password
      remoteRef:
        key: kv/bookstore-platform/backstage/postgresql
        property: admin_password
    - secretKey: user-password
      remoteRef:
        key: kv/bookstore-platform/backstage/postgresql
        property: user_password
---
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: backstage-runtime
  namespace: backstage
  labels:
    app.kubernetes.io/part-of: bookstore-platform
    app.kubernetes.io/component: developer-portal-secrets
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: bookstore-platform-vault
    kind: ClusterSecretStore
  target:
    name: backstage-runtime
    creationPolicy: Owner
  data:
    - secretKey: GITHUB_APP_ID
      remoteRef:
        key: kv/bookstore-platform/backstage/github-app
        property: app_id
    - secretKey: GITHUB_APP_CLIENT_ID
      remoteRef:
        key: kv/bookstore-platform/backstage/github-app
        property: client_id
    - secretKey: GITHUB_APP_CLIENT_SECRET
      remoteRef:
        key: kv/bookstore-platform/backstage/github-app
        property: client_secret
    - secretKey: GITHUB_APP_PRIVATE_KEY
      remoteRef:
        key: kv/bookstore-platform/backstage/github-app
        property: private_key
    - secretKey: GITHUB_APP_WEBHOOK_SECRET
      remoteRef:
        key: kv/bookstore-platform/backstage/github-app
        property: webhook_secret
    - secretKey: KEYCLOAK_CLIENT_SECRET
      remoteRef:
        key: kv/bookstore-platform/backstage/keycloak
        property: client_secret
    - secretKey: ARGOCD_AUTH_TOKEN
      remoteRef:
        key: kv/bookstore-platform/backstage/argocd
        property: token
    - secretKey: PAGERDUTY_TOKEN
      remoteRef:
        key: kv/bookstore-platform/backstage/pagerduty
        property: token
