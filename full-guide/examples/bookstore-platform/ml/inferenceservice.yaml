# Bookstore Platform v2 - Part 13 ch.08: the recommender InferenceService.
#
# KServe does not resolve MLflow aliases. `storageUri` takes a plain storage
# URI (s3:// here), so the promote step resolves the `production` alias to the
# version's artifact path and writes that path into this field. A canary roll
# is the same step with the `staging` version's path, and canaryTrafficPercent
# routes a share of traffic to the new revision.
#
# v1 (Part 12 ch.06) used `pvc://` to load model.joblib from a PVC. v2 uses
# MLflow as the registry; the storage initializer fetches the artifact from S3.
#
# !!! CRD-INTRINSIC DRY-RUN
#   `InferenceService` is `serving.kserve.io/v1beta1` - a KServe CRD.
#   WITHOUT KServe (+ Knative Serving + cert-manager) installed:
#     no matches for kind "InferenceService" in version "serving.kserve.io/v1beta1"
#   EXPECTED. Part 12 ch.06 installs KServe 0.13.1.
#
# PSA - `bookstore-platform-ml` is `enforce: restricted`. The pod-level fields
# below are the restricted set. The runtime container's own hardening comes
# from the ServingRuntime the model format resolves to, not from this resource.
#
# Apply (after KServe, MLflow and the ESO-synced S3 read identity):
#   kubectl apply -f examples/bookstore-platform/ml/inferenceservice.yaml
---
apiVersion: serving.kserve.io/v1beta1
kind: InferenceService
metadata:
  name: recommender
  namespace: bookstore-platform-ml
  labels:
    app.kubernetes.io/part-of: bookstore-platform
    app.kubernetes.io/component: recommender-serve
    bookstore-platform.example.com/serving: kserve
  annotations:
    # Scale-to-zero serverless.
    autoscaling.knative.dev/min-scale: "0"
    autoscaling.knative.dev/max-scale: "5"
    autoscaling.knative.dev/target: "10"
spec:
  predictor:
    minReplicas: 0
    maxReplicas: 5
    timeout: 30
    automountServiceAccountToken: false
    securityContext:
      runAsNonRoot: true
      runAsUser: 65532
      runAsGroup: 65532
      fsGroup: 65532
      seccompProfile:
        type: RuntimeDefault
    # The production version's artifact. Written by the promote step, never
    # edited by hand; the path below is a placeholder.
    model:
      modelFormat:
        name: sklearn
      storageUri: "s3://bookstore-platform-mlflow-us-east/REPLACE-WITH-PRODUCTION-ARTIFACT-PATH"
      resources:
        requests:
          cpu: 100m
          memory: 256Mi
        limits:
          cpu: 500m
          memory: 512Mi
    # Share of traffic for the candidate revision after a storageUri change.
    # KServe reads it only on that change; a first apply serves 100%.
    canaryTrafficPercent: 10
