# Bookstore Platform v2 - Part 13 ch.08: the MLflow credentials, synced from
# Vault by ESO. The mlflow namespace holds the two values the chart needs (the
# hands-on reads them at install time). The detector's read-only MLflow
# reader lives in bookstore-platform-ml. None is written to Git or to a
# values file.
#
# Apply (after the mlflow namespace exists and is labelled restricted):
#   kubectl apply -f examples/bookstore-platform/ml/mlflow-credentials.yaml
---
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: mlflow-credentials
  namespace: mlflow
  labels:
    app.kubernetes.io/part-of: bookstore-platform
    app.kubernetes.io/component: ml-registry
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: bookstore-platform-vault
    kind: ClusterSecretStore
  target:
    name: mlflow-credentials
    creationPolicy: Owner
  data:
    - secretKey: postgres-password
      remoteRef:
        key: kv/bookstore-platform/mlflow
        property: postgres-password
    - secretKey: admin-password
      remoteRef:
        key: kv/bookstore-platform/mlflow
        property: admin-password
---
# MLflow basic-auth reader for the detector's reference window (namespace
# bookstore-platform-ml). The pod reads it through envFrom.
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: alibi-detect-mlflow
  namespace: bookstore-platform-ml
  labels:
    app.kubernetes.io/part-of: bookstore-platform
    app.kubernetes.io/component: ml-drift
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: bookstore-platform-vault
    kind: ClusterSecretStore
  target:
    name: alibi-detect-mlflow
    creationPolicy: Owner
  data:
    - secretKey: MLFLOW_TRACKING_USERNAME
      remoteRef:
        key: kv/bookstore-platform/mlflow-reader
        property: username
    - secretKey: MLFLOW_TRACKING_PASSWORD
      remoteRef:
        key: kv/bookstore-platform/mlflow-reader
        property: password
