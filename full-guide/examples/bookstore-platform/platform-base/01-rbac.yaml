# Bookstore Platform v2 — Part 13 ch.01 / ch.02: platform RBAC. Three roles
# that span the platform, modelled on the Team Topologies platform-vs-stream
# split (Part 11 ch.10):
#
#   bookstore-platform-admin
#                      Break-glass: cluster-wide, as strong as cluster-admin.
#                      Full access to the platform namespaces and the right to
#                      create and delete tenants. Small group. Bind it only
#                      through the break-glass process in 13.12 (humans only,
#                      expiry, audit). Humans reach it through OIDC (13.04).
#   bookstore-platform-operator
#                      Day-to-day platform team: read everything (Secrets
#                      included, see the rule); write the cluster-wide
#                      platform stack (Crossplane XRDs/Compositions, Argo CD
#                      root Applications, the platform-base namespaces).
#                      CANNOT delete a tenant ns.
#   bookstore-platform-tenant-admin
#                      Per-tenant role REFERENCE: bound by the Crossplane
#                      Composition (13.02) inside each `bookstore-platform-
#                      <TENANT>` ns. Controls the workloads and Services of its
#                      OWN ns; reads Secrets and NetworkPolicies there but
#                      cannot change them. THIS file ships the ClusterRole; the
#                      Composition creates the RoleBinding per tenant.
#
# This file ships ClusterRoles only — the bindings to real principals
# (Keycloak groups via the OIDC group claim, 13.04) are environment-specific
# and NOT shipped in source. A production wiring binds bookstore-platform-admin
# to e.g. `oidc:platform-admins` via a separately-managed ClusterRoleBinding.
#
# WHY NO BINDINGS HERE: bindings name real principals; principals differ per
# cluster / region / Keycloak realm. Shipping a binding to a placeholder name
# is worse than shipping nothing — it would grant that exact name on apply,
# every time. The "create the binding once you know the principals" pattern is
# the Part 05 ch.01 lesson, applied at platform scope.
#
# Apply:
#   kubectl apply -f examples/bookstore-platform/platform-base/01-rbac.yaml
#   kubectl get clusterrole | grep bookstore-platform
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: bookstore-platform-admin
  labels:
    app.kubernetes.io/part-of: bookstore-platform
    bookstore-platform.example.com/role: admin
rules:
  # This rule IS a cluster wildcard: every verb on every resource in every
  # API group. It is exactly as powerful as the built-in `cluster-admin`.
  # (An earlier comment here said "NOT a cluster wildcard"; the rule never
  # matched that claim.) A ClusterRole cannot limit its own scope. The
  # binding decides how far these rules reach:
  #   - RoleBinding in namespace X       -> full control of X only.
  #   - ClusterRoleBinding               -> full control of the whole
  #                                         cluster, including creating and
  #                                         deleting tenant namespaces, which
  #                                         are cluster-scoped and need it.
  # So the "bounded blast radius" of break-glass comes from the binding and
  # the gate in front of it (13.12: humans only, expiry, audited), not
  # from this rule. Treat every ClusterRoleBinding to this role as a
  # cluster-admin grant.
  - apiGroups: ["*"]
    resources: ["*"]
    verbs: ["*"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: bookstore-platform-operator
  labels:
    app.kubernetes.io/part-of: bookstore-platform
    bookstore-platform.example.com/role: operator
rules:
  # Read everything (debugging / dashboards). "Everything" includes Secrets
  # in every namespace the binding reaches: a wildcard cannot exclude one
  # resource, and the core API group is part of "*". Bound with a
  # ClusterRoleBinding, this role reads every tenant's Secrets. "*" also
  # matches subresources, including nodes/log and nodes/proxy (kubelet
  # logs and the kubelet API); from Kubernetes 1.37 the kubelet logs its
  # effective configuration at startup, so those reads expose node config
  # too. If the platform team should not have this, replace this rule with
  # an explicit list of resources (or bind the built-in `view` ClusterRole,
  # which omits Secrets and node subresources) and grant Secret reads per
  # namespace.
  - apiGroups: ["*"]
    resources: ["*"]
    verbs: ["get", "list", "watch"]
  # Manage the platform stack: Crossplane resources, Argo CD applications,
  # platform-base namespaces. Restricted by the namespaces the bindings target.
  - apiGroups: ["apiextensions.crossplane.io"]
    resources: ["*"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: ["pkg.crossplane.io"]
    resources: ["*"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: ["argoproj.io"]
    resources: ["applications", "applicationsets", "appprojects"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: [""]
    resources: ["configmaps", "secrets", "services", "serviceaccounts"]
    verbs: ["get", "list", "watch", "create", "update", "patch"]
    # No delete on these four, Secrets included. That stops casual
    # deletion. It is not a confidentiality control: the read rule above
    # already exposes every Secret, and `update` can overwrite one.
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: bookstore-platform-tenant-admin
  labels:
    app.kubernetes.io/part-of: bookstore-platform
    bookstore-platform.example.com/role: tenant-admin
rules:
  # Full control of a tenant's OWN namespace — but a ClusterRole, so the
  # tenant's blast radius is set by the (namespaced) RoleBinding the
  # Composition creates. CANNOT escape the binding's namespace.
  - apiGroups: ["apps"]
    resources: ["deployments", "replicasets", "statefulsets", "daemonsets"]
    verbs: ["*"]
  - apiGroups: ["batch"]
    resources: ["jobs", "cronjobs"]
    verbs: ["*"]
  - apiGroups: [""]
    resources: ["pods", "services", "configmaps", "persistentvolumeclaims",
                "serviceaccounts", "events"]
    verbs: ["*"]
  # Secrets read-only — tenants can REFERENCE platform-provisioned Secrets
  # (e.g. ESO-synced Stripe keys, 13.06) but cannot mint new ones cluster-side.
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["networking.k8s.io"]
    resources: ["networkpolicies", "ingresses"]
    verbs: ["get", "list", "watch"]
    # tenants can SEE their NetworkPolicies but cannot edit them — the
    # platform owns the default-deny + allow set (Part 02 ch.06; 13.02).
  - apiGroups: ["autoscaling"]
    resources: ["horizontalpodautoscalers"]
    verbs: ["*"]
