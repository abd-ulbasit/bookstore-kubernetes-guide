# Bookstore Platform, Part 15 ch.08: Flagsmith values for the upstream
# flagsmith/flagsmith chart, version 0.85.0 (appVersion 2.286.0).
#
# Install with the chapter's commands (not run for this guide):
#   helm upgrade --install flagsmith flagsmith/flagsmith \
#     --version 0.85.0 --namespace flagsmith --wait \
#     --values flagsmith-helm-values.yaml
#
# Every key here exists in `helm show values flagsmith/flagsmith
# --version 0.85.0`. The chart renders repository:tag, so each image tag
# carries the digest of the multi-arch index for 2.286.0 after the "@".
# A digest that does not match the tag fails the pull, so the tag cannot
# move underneath the install.

api:
  image:
    repository: docker.flagsmith.com/flagsmith/flagsmith-api
    tag: "2.286.0@sha256:d8f65117c479561f2d88c6ddb53df496abc55a7b31ae6a5a945cfe3213d02109"
  replicacount: 2
  resources:
    requests: { cpu: 100m, memory: 256Mi }
    limits: { cpu: "1", memory: 1Gi }
  # The chart creates no ServiceAccount, so the chapter creates this one.
  serviceAccountName: flagsmith-api
  podSecurityContext:
    runAsNonRoot: true
    # The image sets USER nobody. nobody is UID 65534 in Wolfi's base,
    # and a numeric UID lets the kubelet verify runAsNonRoot.
    runAsUser: 65534
    runAsGroup: 65534
    seccompProfile: { type: RuntimeDefault }
  securityContext:
    readOnlyRootFilesystem: true
  extraEnv:
    # The chart defaults this to true. Turned off so the Django admin
    # has no local-password login.
    ENABLE_ADMIN_ACCESS_USER_PASS: "false"
  # Pods mount the database URL and Django key from the ExternalSecret
  # target (see the chapter), not from literals.
  secretKeyFromExistingSecret:
    enabled: true
    name: flagsmith-api-secrets
    key: django-secret-key
  # The image writes Prometheus files under /tmp. This emptyDir is the
  # only writable path. The mount also reaches the migrate-db init
  # container, which runs the same image.
  volumeMounts:
    - name: tmp
      mountPath: /tmp
  extraVolumes:
    - name: tmp
      emptyDir: {}
  # The API never calls the Kubernetes API, so the token stays out.
  extraTemplateSpec:
    automountServiceAccountToken: false

frontend:
  image:
    repository: docker.flagsmith.com/flagsmith/flagsmith-frontend
    tag: "2.286.0@sha256:79d3642bcfd058478c7035b2f7cc3dc58a779532031d6d945f7a0f9a1fbf6fb1"
  replicacount: 2
  resources:
    requests: { cpu: 50m, memory: 64Mi }
    limits: { cpu: 200m, memory: 256Mi }
  serviceAccountName: flagsmith-frontend
  podSecurityContext:
    runAsNonRoot: true
    # The frontend image also sets USER nobody. See the API note above.
    runAsUser: 65534
    runAsGroup: 65534
    seccompProfile: { type: RuntimeDefault }
  securityContext:
    readOnlyRootFilesystem: true
  volumeMounts:
    - name: tmp
      mountPath: /tmp
  extraVolumes:
    - name: tmp
      emptyDir: {}
  extraTemplateSpec:
    automountServiceAccountToken: false

# The chart's bundled PostgreSQL is a dev database. Off here: the
# database comes from the platform's CNPG cluster through the secret.
devPostgresql:
  enabled: false

databaseExternal:
  enabled: true
  urlFromExistingSecret:
    enabled: true
    name: flagsmith-api-secrets
    key: DATABASE_URL

# Metrics: scraped through a ServiceMonitor, which needs the Prometheus
# Operator CRDs from kube-prometheus-stack.
serviceMonitor:
  enabled: true

# The SSE component is off, so its autoscaler is off too.
hpa:
  sse:
    enabled: false

# Two chart gaps, covered outside the values file:
# - The migrate-db init container gets no resources block from the chart.
#   The LimitRange in flagsmith-namespace.yaml supplies its memory limit
#   and requests at admission. A render-time Trivy scan still reports
#   that container for a missing CPU limit, which the baseline does not
#   ask for.
# - The chart still renders a Secret named flagsmith with an empty
#   DATABASE_URL. No pod reads it. The pods read flagsmith-api-secrets.
