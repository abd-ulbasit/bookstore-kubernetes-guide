# Bookstore Platform v2, Part 13 ch.10: the cost dashboard as a ConfigMap.
# The kube-prometheus-stack Grafana sidecar loads every ConfigMap labelled
# grafana_dashboard: "1" from prometheus-system (ch.13.09 step 1), so this is
# not a GrafanaDashboard CRD: no grafana-operator is installed in Part 13.
# The panels read the recording rules in opencost-tenant-aggregations.yaml.
#
# Apply:
#   kubectl apply -f examples/bookstore-platform/cost/grafana-cost-dashboard.yaml
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: bookstore-platform-cost
  namespace: prometheus-system
  labels:
    app.kubernetes.io/name: bookstore-platform-cost
    app.kubernetes.io/instance: bookstore-platform-cost
    app.kubernetes.io/part-of: bookstore-platform
    app.kubernetes.io/component: cost-dashboard
    grafana_dashboard: "1"
data:
  bookstore-platform-cost.json: |
    {
      "uid": "bookstore-platform-cost",
      "title": "Bookstore Platform \u2014 Cost",
      "tags": [
        "bookstore-platform",
        "cost",
        "finops"
      ],
      "schemaVersion": 39,
      "time": {
        "from": "now-30d",
        "to": "now"
      },
      "templating": {
        "list": [
          {
            "name": "tenant",
            "type": "query",
            "datasource": "Prometheus",
            "query": "label_values(bookstore:cost_per_hour:by_tenant, tenant)",
            "includeAll": true,
            "multi": true,
            "refresh": 2,
            "label": "Tenant"
          }
        ]
      },
      "panels": [
        {
          "id": 1,
          "type": "stat",
          "title": "Total cost \u2014 last 30 days (USD)",
          "datasource": "Prometheus",
          "gridPos": {
            "h": 6,
            "w": 6,
            "x": 0,
            "y": 0
          },
          "targets": [
            {
              "expr": "sum(bookstore:cost_30d:by_tenant{tenant=~\"$tenant\"})",
              "refId": "A"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "currencyUSD",
              "decimals": 2
            }
          }
        },
        {
          "id": 2,
          "type": "table",
          "title": "Cost per tenant \u2014 last 30 days",
          "datasource": "Prometheus",
          "gridPos": {
            "h": 12,
            "w": 18,
            "x": 6,
            "y": 0
          },
          "targets": [
            {
              "expr": "topk(50, bookstore:cost_30d:by_tenant{tenant=~\"$tenant\"})",
              "format": "table",
              "refId": "A"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "currencyUSD",
              "decimals": 2
            }
          }
        },
        {
          "id": 4,
          "type": "piechart",
          "title": "Cost per workload-class",
          "datasource": "Prometheus",
          "gridPos": {
            "h": 8,
            "w": 12,
            "x": 12,
            "y": 12
          },
          "targets": [
            {
              "expr": "bookstore:cost_per_hour:by_class",
              "legendFormat": "{{class}}",
              "refId": "A"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "currencyUSD",
              "decimals": 2
            }
          }
        },
        {
          "id": 5,
          "type": "timeseries",
          "title": "GPU vs CPU spend per tenant (USD/hour)",
          "datasource": "Prometheus",
          "gridPos": {
            "h": 8,
            "w": 12,
            "x": 0,
            "y": 20
          },
          "targets": [
            {
              "expr": "bookstore:gpu_cost_per_hour:by_tenant{tenant=~\"$tenant\"}",
              "legendFormat": "GPU {{tenant}}",
              "refId": "A"
            },
            {
              "expr": "bookstore:cost_per_hour:by_tenant{tenant=~\"$tenant\"} - bookstore:gpu_cost_per_hour:by_tenant{tenant=~\"$tenant\"}",
              "legendFormat": "CPU {{tenant}}",
              "refId": "B"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "currencyUSD",
              "decimals": 2
            }
          }
        },
        {
          "id": 6,
          "type": "gauge",
          "title": "Unallocated cost % \u2014 should be < 1%",
          "datasource": "Prometheus",
          "gridPos": {
            "h": 8,
            "w": 12,
            "x": 12,
            "y": 20
          },
          "targets": [
            {
              "expr": "100 * (bookstore:cost_unallocated / sum(bookstore:cost_per_hour:by_namespace))",
              "refId": "A"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "percent",
              "decimals": 2,
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "green",
                    "value": null
                  },
                  {
                    "color": "yellow",
                    "value": 1
                  },
                  {
                    "color": "red",
                    "value": 5
                  }
                ]
              }
            }
          }
        }
      ]
    }
