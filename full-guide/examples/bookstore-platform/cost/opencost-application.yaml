# Bookstore Platform v2 — Part 13 ch.10: an Argo CD Application that
# installs OpenCost (opencost/opencost chart) into the `opencost`
# namespace. OpenCost reuses the platform's existing Prometheus
# (kube-prometheus-stack from ch.13.09) — no internal Prometheus.
#
# v1 (Bookstore) ran no OpenCost; Part 12 ch.08 introduced it as a
# concept. v2 wires it as the per-tenant + per-region cost source of
# truth. Per-tenant Allocation queries require the platform's
# `bookstore-platform.example.com/tenant` labels which the Crossplane
# Composition (ch.13.02) stamps on every workload.
#
# !!! CRD-INTRINSIC DRY-RUN
#   `Application` is `argoproj.io/v1alpha1` — Argo CD CRD. WITHOUT
#   Argo CD:
#     no matches for kind "Application" in version "argoproj.io/v1alpha1"
#   EXPECTED.
#
# Apply (after Argo CD + kube-prometheus-stack):
#   kubectl apply -f examples/bookstore-platform/cost/opencost-application.yaml
---
apiVersion: v1
kind: Namespace
metadata:
  name: opencost
  labels:
    app.kubernetes.io/part-of: bookstore-platform
    bookstore-platform.example.com/scope: cost
    pod-security.kubernetes.io/enforce: restricted
    pod-security.kubernetes.io/enforce-version: latest
    pod-security.kubernetes.io/audit: restricted
    pod-security.kubernetes.io/audit-version: latest
    pod-security.kubernetes.io/warn: restricted
    pod-security.kubernetes.io/warn-version: latest
---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: opencost
  namespace: argocd
  labels:
    app.kubernetes.io/name: opencost
    app.kubernetes.io/instance: opencost
    app.kubernetes.io/part-of: bookstore-platform
    app.kubernetes.io/component: cost-aggregator
    app.kubernetes.io/version: "1.121.3"
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    chart: opencost
    repoURL: https://opencost.github.io/opencost-helm-chart
    # Pinned. Production cadence: bump deliberately every quarter.
    targetRevision: "2.5.33"
    helm:
      values: |
        opencost:
          metrics:
            serviceMonitor:
              # Lets Prometheus scrape the opencost_* series. Needs the Prometheus
              # Operator CRDs that kube-prometheus-stack installs (ch.13.09).
              enabled: true
          mcp:
            # The MCP server answers cost queries for every tenant to any pod that
            # can reach port 8081. Off until a platform agent needs it.
            enabled: false
          prometheus:
            internal:
              enabled: false
            external:
              enabled: true
              url: http://kube-prometheus-stack-prometheus.prometheus-system.svc.cluster.local:9090
          exporter:
            defaultClusterId: bookstore-platform-us-east
            extraEnv:
              CLUSTER_REGION: us-east-1
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities:
                drop: ["ALL"]
            # The collector writes under /var/configs. The root filesystem is read
            # only, so that path gets an emptyDir.
            extraVolumeMounts:
              - name: configs
                mountPath: /var/configs
            resources:
              requests:
                cpu: 100m
                memory: 256Mi
              limits:
                cpu: 500m
                memory: 1Gi
          ui:
            # Off. The UI's entrypoint rewrites its own bundle under /var/www at
            # start, which a read-only root filesystem refuses. The API and the
            # Grafana dashboards are the read paths.
            enabled: false
        # Pod level. The images declare user 1001 and no group.
        podSecurityContext:
          runAsNonRoot: true
          runAsUser: 1001
          runAsGroup: 1001
          seccompProfile:
            type: RuntimeDefault
        # OpenCost reads pods, nodes and namespaces through the API, so the pods
        # keep the token. The chart creates a ServiceAccount used by nothing else.
        podAutomountServiceAccountToken: true
        extraVolumes:
          - name: configs
            emptyDir: {}
  destination:
    server: https://kubernetes.default.svc
    namespace: opencost
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=false
      - ServerSideApply=true
