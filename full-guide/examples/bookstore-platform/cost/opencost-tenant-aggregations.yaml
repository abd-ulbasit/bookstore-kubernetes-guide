# Bookstore Platform v2, Part 13 ch.10: PrometheusRule with the per-tenant
# cost recording rules. Every series is one OpenCost exports (its metrics
# page) or one kube-state-metrics series with a label allowlist set in
# ch.13.09 step 1: kube_namespace_labels carries the tenant label, and
# kube_pod_labels carries the workload class. The tenant label is produced
# by label_replace, because kube-state-metrics exports the label under a
# mangled name: label_bookstore_platform_example_com_tenant.
#
# !!! CRD-INTRINSIC DRY-RUN
#   `PrometheusRule` is `monitoring.coreos.com/v1` — Prometheus
#   Operator CRD. WITHOUT kube-prometheus-stack:
#     no matches for kind "PrometheusRule" in version "monitoring.coreos.com/v1"
#   EXPECTED.
#
# Apply:
#   kubectl apply -f examples/bookstore-platform/cost/opencost-tenant-aggregations.yaml
---
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: bookstore-platform-cost-aggregations
  namespace: prometheus-system
  labels:
    app.kubernetes.io/name: bookstore-platform-cost-aggregations
    app.kubernetes.io/instance: bookstore-platform-cost-aggregations
    app.kubernetes.io/part-of: bookstore-platform
    app.kubernetes.io/component: cost-aggregations
    app.kubernetes.io/version: "1.0.0"
    # Picked up by kube-prometheus-stack.
    release: kube-prometheus-stack
spec:
  groups:
    - name: bookstore-platform.cost.recording
      interval: 5m
      rules:
        # USD per hour for each pod: CPU and memory allocation times the
        # price of the node the pod runs on (OpenCost's node price series).
        - record: bookstore:cost_per_hour:by_pod
          expr: |
            sum by (namespace, pod) (
              container_cpu_allocation
                * on (node) group_left() max by (node) (node_cpu_hourly_cost)
              +
              container_memory_allocation_bytes / 1024 / 1024 / 1024
                * on (node) group_left() max by (node) (node_ram_hourly_cost)
            )
        - record: bookstore:cost_per_hour:by_namespace
          expr: |
            sum by (namespace) (bookstore:cost_per_hour:by_pod)
        # Cost per tenant per hour. The join key is the namespace; the
        # tenant label is copied from kube_namespace_labels.
        - record: bookstore:cost_per_hour:by_tenant
          expr: |
            sum by (tenant) (
              bookstore:cost_per_hour:by_namespace
                * on (namespace) group_left(tenant)
                  label_replace(
                    kube_namespace_labels{label_bookstore_platform_example_com_tenant!=""},
                    "tenant", "$1", "label_bookstore_platform_example_com_tenant", "(.+)"
                  )
            )
        # Cost per workload class, from the pod label the platform sets.
        - record: bookstore:cost_per_hour:by_class
          expr: |
            sum by (class) (
              bookstore:cost_per_hour:by_pod
                * on (namespace, pod) group_left(class)
                  label_replace(
                    kube_pod_labels{label_bookstore_platform_example_com_class!=""},
                    "class", "$1", "label_bookstore_platform_example_com_class", "(.+)"
                  )
            )
        # Cost per tenant: rolling 30-day total, bucketed at 1-hour
        # resolution so 30d * 24h = 720 samples.
        - record: bookstore:cost_30d:by_tenant
          expr: |
            sum_over_time(bookstore:cost_per_hour:by_tenant[30d:1h])
        # GPU spend per tenant: the GPU allocation times the node's GPU price.
        - record: bookstore:gpu_cost_per_hour:by_tenant
          expr: |
            sum by (tenant) (
              sum by (namespace) (
                container_gpu_allocation
                  * on (node) group_left() max by (node) (node_gpu_hourly_cost)
              )
              * on (namespace) group_left(tenant)
                label_replace(
                  kube_namespace_labels{label_bookstore_platform_example_com_tenant!=""},
                  "tenant", "$1", "label_bookstore_platform_example_com_tenant", "(.+)"
                )
            )
        # Unallocated cost: namespaces with no tenant label. The label
        # hygiene health metric.
        - record: bookstore:cost_unallocated
          expr: |
            sum(bookstore:cost_per_hour:by_namespace)
              - sum(bookstore:cost_per_hour:by_tenant)
    - name: bookstore-platform.cost.hygiene
      interval: 5m
      rules:
        - alert: BookstoreUnallocatedCostHigh
          expr: |
            bookstore:cost_unallocated
              / sum(bookstore:cost_per_hour:by_namespace) > 0.01
          for: 30m
          labels:
            severity: warn
          annotations:
            summary: "Unallocated cost > 1% of cluster spend"
            description: |
              More than 1% of compute cost sits in namespaces without the
              `bookstore-platform.example.com/tenant` label on the Namespace.
              Diagnose: kubectl get namespaces -L bookstore-platform.example.com/tenant
