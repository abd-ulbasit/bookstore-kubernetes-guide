# Bookstore Platform v2 - Part 15 ch.05: the SecretStore for one tenant.
#
# One SecretStore per tenant namespace, stamped by the Composition. A
# SecretStore can name only a ServiceAccount in its own namespace, so this
# store logs in only as bookstore-platform-eso in bookstore-platform-
# acme-books, and Vault matches that identity only to the acme-books role
# in auth-k8s/role-bookstore-platform.yaml. A ClusterSecretStore cannot
# give that guarantee: it names one ServiceAccount and one role for every
# namespace it serves.
#
# Vault is provisioned by examples/bookstore-platform/terraform/vault.tf.
# This file consumes that Vault. The dev-mode Vault from Part 11 ch.05 also
# works for a local check; only `server` changes.
#
# !!! CRD-INTRINSIC DRY-RUN
#   `SecretStore` is `external-secrets.io/v1`, an ESO CRD. Without ESO
#   installed a client dry-run prints:
#     no matches for kind "SecretStore" in version "external-secrets.io/v1"
#   EXPECTED. After ESO is installed, this applies to the tenant namespace.
#
# Apply (the namespace and ServiceAccount come first, from the chapter):
#   kubectl apply -f examples/bookstore-platform/vault/secret-store.yaml
#   kubectl -n bookstore-platform-acme-books get secretstore \
#     vault-bookstore-platform \
#     -o jsonpath='{.status.conditions[*].type}={.status.conditions[*].status}{"\n"}'
#   # expect Ready=True (ESO logged in to Vault with the tenant ServiceAccount)

apiVersion: external-secrets.io/v1
kind: SecretStore
metadata:
  name: vault-bookstore-platform
  namespace: bookstore-platform-acme-books
  labels:
    app.kubernetes.io/part-of: bookstore-platform
    app.kubernetes.io/managed-by: gitops
spec:
  provider:
    vault:
      # The active Vault node, through the internal-only Service in the
      # vault namespace. No public Ingress reaches it.
      server: "https://vault-active.vault.svc.cluster.local:8200"
      # The KV v2 mount. `path` names the mount only; ESO adds the /data/
      # segment for KV v2 itself.
      path: "secret"
      version: "v2"
      # ESO checks the Vault server certificate against this CA. Never set
      # skipTLSVerify. A SecretStore reads a ConfigMap from its own
      # namespace, so the Composition copies the CA ConfigMap into the
      # tenant namespace. `namespace` is valid only on a ClusterSecretStore.
      caProvider:
        type: ConfigMap
        name: vault-server-ca
        key: ca.crt
      auth:
        kubernetes:
          mountPath: kubernetes
          # The one Vault role for this tenant (see the role file).
          role: bookstore-platform-acme-books
          serviceAccountRef:
            # Same namespace as the store; no namespace field here.
            name: bookstore-platform-eso
            # ESO asks the API server for a token with this audience. It
            # must match the role's audience, or Vault refuses the login.
            audiences:
              - https://vault.bookstore-platform.example.com
