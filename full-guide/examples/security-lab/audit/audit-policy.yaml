# Audit policy for the Part 05 detection lab (chapter 05.08, tier A). The API
# server reads it through --audit-policy-file. The first rule that matches a
# request sets its level. Lab cluster only.
apiVersion: audit.k8s.io/v1
kind: Policy
# Drop the RequestReceived stage, so each request is recorded once, after the
# response, instead of twice.
omitStages:
  - RequestReceived
rules:
  # Secrets and ConfigMaps: record who read or changed what, never the value.
  # A Metadata entry carries no request or response body, so the log cannot
  # leak a secret.
  - level: Metadata
    resources:
      - group: ""
        resources: ["secrets", "configmaps"]
  # A token request mints a credential. Record who asked, not the token.
  - level: Metadata
    resources:
      - group: ""
        resources: ["serviceaccounts/token"]
  # Pod changes: keep the request body, which names the image, the hostPath
  # and the serviceAccountName.
  - level: Request
    verbs: ["create", "update", "patch", "delete"]
    resources:
      - group: ""
        resources: ["pods"]
  # exec, attach and port-forward have no request body. The command is in the
  # request URI, which every level keeps. A WebSocket exec request can be
  # audited with the verb get, so both verbs are listed.
  - level: Request
    verbs: ["create", "get"]
    resources:
      - group: ""
        resources: ["pods/exec", "pods/attach", "pods/portforward"]
  # RBAC changes: keep the request, so a new binding is visible in full. The
  # bind and escalate checks happen in the authorizer, and audit events carry
  # the request verb, so those two verbs never match an event.
  - level: Request
    verbs: ["create", "update", "patch", "delete"]
    resources:
      - group: "rbac.authorization.k8s.io"
        resources: ["roles", "rolebindings", "clusterroles", "clusterrolebindings"]
  # Everything else: who did what, without the body.
  - level: Metadata
