# kind cluster for the three Part 04 scheduling chapters: one control plane and
# two workers. The cluster is named bookstore below, so create it with:
#
#   kind create cluster --config cluster-three-node.yaml
#
# Run the labs only against a cluster you own. The node image is pinned by
# digest to the Kubernetes 1.37.0 image kind v0.33.0 publishes, the same
# digest cluster.yaml uses.
#
# Each worker carries a zone label, zone-a and zone-b, set by hand because
# kind has no zones. No node carries a pool label or a taint. A kubelet may
# not set a label under the node-restriction.kubernetes.io/ prefix, and
# NodeRestriction refuses it, so the dedicated pool label is added by an
# administrator once the node has joined. The pool taint is added the same
# way, with kubectl taint.
kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
name: bookstore
nodes:
  - role: control-plane
    image: kindest/node:v1.37.0@sha256:a1ed56cfb0e7b93589bdf97c8cd566405a265939e3620fc4f5de89adff580ae5
  - role: worker
    image: kindest/node:v1.37.0@sha256:a1ed56cfb0e7b93589bdf97c8cd566405a265939e3620fc4f5de89adff580ae5
    labels:
      topology.kubernetes.io/zone: zone-a
  - role: worker
    image: kindest/node:v1.37.0@sha256:a1ed56cfb0e7b93589bdf97c8cd566405a265939e3620fc4f5de89adff580ae5
    labels:
      topology.kubernetes.io/zone: zone-b
