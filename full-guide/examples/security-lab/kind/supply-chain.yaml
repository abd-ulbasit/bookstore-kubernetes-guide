# kind cluster for the Part 05 supply-chain lab (05.03, tier A). Create it with:
#
#   kind create cluster --config supply-chain.yaml
#
# Run the lab only against a cluster you own. The lab points the nodes at a
# lab registry on the kind network, which needs a containerd registry
# config_path. This cluster carries that setting; the other labs keep the
# default configuration in cluster.yaml. The API server port is fixed so a
# remote lab host can forward it over ssh. A local cluster does not need that.
kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
name: p05-supply
networking:
  apiServerAddress: "127.0.0.1"
  apiServerPort: 36012
containerdConfigPatches:
  - |-
    [plugins."io.containerd.grpc.v1.cri".registry]
      config_path = "/etc/containerd/certs.d"
nodes:
  - role: control-plane
    image: kindest/node:v1.37.0@sha256:a1ed56cfb0e7b93589bdf97c8cd566405a265939e3620fc4f5de89adff580ae5
