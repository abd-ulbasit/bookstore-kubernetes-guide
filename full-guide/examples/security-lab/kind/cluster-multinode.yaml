# kind cluster for the Part 04 scheduling labs: one control plane and two
# workers. Create it from full-guide/ with:
#
#   kind create cluster --config examples/security-lab/kind/cluster-multinode.yaml
#
# The cluster is named sched-lab, so its nodes are sched-lab-control-plane,
# sched-lab-worker and sched-lab-worker2. Run the labs only against a cluster
# you own: they taint a worker and add a cluster-wide admission policy. The
# node image is pinned by digest, the same digest cluster.yaml beside this file
# pins.
kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
name: sched-lab
nodes:
  - role: control-plane
    image: kindest/node:v1.37.0@sha256:a1ed56cfb0e7b93589bdf97c8cd566405a265939e3620fc4f5de89adff580ae5
  - role: worker
    image: kindest/node:v1.37.0@sha256:a1ed56cfb0e7b93589bdf97c8cd566405a265939e3620fc4f5de89adff580ae5
  - role: worker
    image: kindest/node:v1.37.0@sha256:a1ed56cfb0e7b93589bdf97c8cd566405a265939e3620fc4f5de89adff580ae5
