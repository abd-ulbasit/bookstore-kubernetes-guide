# kind cluster for the Part 05 kernel isolation lab (chapter 05.05, tier A).
# Create it with:
#
#   kind create cluster --config kernel-cluster.yaml
#
# The node image is the same Kubernetes 1.37.0 image as cluster.yaml, pinned
# by digest. This config adds no mounts. The lab does not load an AppArmor
# profile: a profile is kernel state shared with the host, so loading one
# from inside a node would change the host's policy. The only step that
# needs this cluster is the optional gVisor step, which installs runsc into
# the node and restarts the node's containerd. Run the labs only on a cluster
# you own.
kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
name: security-lab-kernel
nodes:
  - role: control-plane
    image: kindest/node:v1.37.0@sha256:a1ed56cfb0e7b93589bdf97c8cd566405a265939e3620fc4f5de89adff580ae5
