# Bookstore — Part 07 ch.04 "GitOps with Argo CD": the AppProject fences.
#
# Two AppProjects, two trust levels. Apply this file before anything else.
# The platform team owns it; no Application syncs it.
#
#   platform  — owns the App-of-Apps root and nothing else. It may create
#               Application objects in the argocd namespace, and no other kind.
#   bookstore — the tenant. Every child Application (dev, staging, prod) runs
#               here. It creates workload kinds in the `bookstore` namespace
#               and no Argo CD kinds at all.
#
# Why two: an Application can name any project. If the tenant project could
# create Application objects, a commit to the tenant's path could create one
# in project `default` (which allows everything) and escape the fence. Only the
# root creates Applications, and the root belongs to `platform`.
#
# TRUST ANCHOR. The root syncs `argocd/apps/`. Whoever can commit under that
# path chooses every child's project. This lab keeps it in the same repo as
# the tenant's overlays, so protect the path (CODEOWNERS plus a ruleset that
# requires platform review). In production, move `argocd/apps/` to a repo the
# tenant cannot write to.
#
# PLACEHOLDER: `repoURL` is https://github.com/your-org/bookstore.git.
# Replace `your-org` with your organization.
#
# CRD note: AppProject is argoproj.io/v1alpha1. Before Argo CD is installed,
# a dry-run prints `no matches for kind "AppProject"`. That is expected.
#
# Apply (Argo CD installed; see ch.04 Hands-on step 1):
#   kubectl apply -n argocd -f examples/bookstore/argocd/00-appproject.yaml
---
apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: platform
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  description: Platform. Owns the App-of-Apps root only.
  sourceRepos:
    - https://github.com/your-org/bookstore.git   # PLACEHOLDER
  destinations:
    - namespace: argocd
      server: https://kubernetes.default.svc
  clusterResourceWhitelist: []
  namespaceResourceWhitelist:
    - group: argoproj.io
      kind: Application
---
apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: bookstore
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  description: Bookstore. Scoped GitOps tenant.
  sourceRepos:
    - https://github.com/your-org/bookstore.git   # PLACEHOLDER
  destinations:
    - namespace: bookstore
      server: https://kubernetes.default.svc
  # Cluster-scoped: only what the base ships. Argo CD refuses any other
  # cluster-scoped kind, so a tenant cannot create a CRD or a ClusterRole.
  # A kind cannot name an object, so a commit can still name another
  # Namespace. Name-level control is admission's job (05.07).
  clusterResourceWhitelist:
    - group: ""
      kind: Namespace
    - group: scheduling.k8s.io
      kind: PriorityClass
  # Namespaced: an allow-list by kind, matching what the three overlays render
  # (dev 45, staging 49, prod 48). Argo CD and the Application kind are absent
  # on purpose. The base's Role and RoleBinding are in-namespace only.
  namespaceResourceWhitelist:
    - group: apps
      kind: Deployment
    - group: apps
      kind: StatefulSet
    - group: ""
      kind: Service
    - group: ""
      kind: ServiceAccount
    - group: ""
      kind: ConfigMap
    - group: ""
      kind: Secret
    - group: ""
      kind: ResourceQuota
    - group: ""
      kind: LimitRange
    - group: networking.k8s.io
      kind: Ingress
    - group: networking.k8s.io
      kind: NetworkPolicy
    - group: rbac.authorization.k8s.io
      kind: Role
    - group: rbac.authorization.k8s.io
      kind: RoleBinding
    - group: batch
      kind: Job
    - group: batch
      kind: CronJob
    - group: autoscaling
      kind: HorizontalPodAutoscaler
    - group: policy
      kind: PodDisruptionBudget
