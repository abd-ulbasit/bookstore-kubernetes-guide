# Bookstore — Part 07 ch.05: AnalysisTemplate — catalog success-rate gate.
#
# The Rollout (catalog-rollout.yaml) runs this as a canary GATE. It queries
# PROMETHEUS for the success rate of the CANARY's own Pods, using the metrics
# Part 06 ch.01 made the catalog binary export (app/catalog/main.go):
#   http_requests_total{handler,code}   — a counter, per handler + HTTP status
#
#   success-rate = 1 − ( rate(5xx) / rate(all non-/metrics requests) )
#
# FAIL CLOSED. The query always returns one value, and silence is not a
# success. The canary must serve at least one request per second over the
# two-minute window; below that the query returns 0 and the gate fails. A
# quiet canary therefore aborts the rollout instead of passing on no evidence.
#
# CANARY ONLY. `rollouts_pod_template_hash` limits the query to the canary's
# Pods. The hash comes from the Rollout's `canary-hash` argument, and the
# catalog ServiceMonitor copies the Pod label onto each series (podTargetLabels
# in raw-manifests/80-servicemonitor.yaml). Without the filter, stable traffic
# would dilute a failing canary and a 50% error canary at 10% weight could pass.
#
# successCondition keeps the canary only while success-rate ≥ 0.95. After
# once the failed measurements exceed `failureLimit`, the AnalysisRun fails →
# Argo Rollouts
# ABORTS the rollout and AUTO-ROLLS-BACK to the stable ReplicaSet. The 5xx path
# is real PromQL; the tiny demo binary does not emit 5xx on demand, so the lab
# shows the silent-canary failure rather than a 5xx abort.
#
# CRD-INTRINSIC NOTE: `AnalysisTemplate` is `argoproj.io/v1alpha1` (Argo
# Rollouts CRD). Without the controller installed, a client dry-run prints
# `no matches for kind "AnalysisTemplate"` — EXPECTED, schema-correct (same
# precedent as raw 18-/51-/70-/80-/83-, the Helm/Kustomize CRD extras, and
# ch.04's Argo CD Application/AppProject). Install Argo Rollouts first.
#
# Prometheus address: the Part 06 ch.01 kube-prometheus-stack Service in the
# `monitoring` namespace. The catalog ServiceMonitor (80-) must be scraping
# catalog (its `release: kube-prometheus-stack` label — Part 06 ch.01).
apiVersion: argoproj.io/v1alpha1
kind: AnalysisTemplate
metadata:
  name: catalog-success-rate
  namespace: bookstore
  labels:
    app: catalog
    app.kubernetes.io/part-of: bookstore
spec:
  # Args are passed by the Rollout's analysis step: service-name, namespace and
  # canary-hash (the canary ReplicaSet's pod-template hash). prometheus-port has
  # a default, so it is optional.
  args:
    - name: service-name
    - name: namespace
    - name: canary-hash
    - name: prometheus-port
      value: "9090"
  metrics:
    - name: catalog-success-rate
      # Take a measurement every 20s, sample 5 times before the step proceeds.
      interval: 20s
      count: 5
      # PASS while success-rate ≥ 0.95 (≤5% 5xx). result[0] = the scalar.
      successCondition: result[0] >= 0.95
      # After 3 failing samples the AnalysisRun FAILS → the Rollout aborts and
      # auto-rolls-back to stable. A silent canary fails every sample.
      failureLimit: 3
      provider:
        prometheus:
          # kube-prometheus-stack Prometheus Service (Part 06 ch.01),
          # cross-namespace DNS. Replace if your Prometheus differs.
          address: "http://kube-prometheus-stack-prometheus.monitoring.svc.cluster.local:{{args.prometheus-port}}"
          timeout: 30
          # Each side of the division is restricted to the canary's Pods. The
          # `and on()` clause fails the gate below 1 request per second, and the
          # outer `or on() vector(0)` turns an empty result into 0, so the
          # query always yields a value and no traffic is a failure.
          query: |
            (
              (
                1 - (
                  (sum(rate(http_requests_total{handler!="metrics",code=~"5..",namespace="{{args.namespace}}",rollouts_pod_template_hash="{{args.canary-hash}}"}[2m])) or vector(0))
                  /
                  sum(rate(http_requests_total{handler!="metrics",namespace="{{args.namespace}}",rollouts_pod_template_hash="{{args.canary-hash}}"}[2m]))
                )
              )
              and on()
              (sum(rate(http_requests_total{handler!="metrics",namespace="{{args.namespace}}",rollouts_pod_template_hash="{{args.canary-hash}}"}[2m])) >= 1)
            )
            or on() vector(0)
