# Bookstore per-environment ApplicationSet (Part 15 ch.04). One Argo CD
# Application per environment, each pointed at its overlay. Apply it once to
# the management cluster; Argo CD owns the three Applications after that.
#
# The List generator names the environments. The destination names are the
# kind contexts used in the chapter's walkthrough. A real fleet matches
# clusters on the env label instead, with the matrix generator the chapter
# describes.
apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: bookstore-environments
  namespace: argocd
spec:
  goTemplate: true
  goTemplateOptions: ["missingkey=error"]
  generators:
    - list:
        elements:
          - env: dev
          - env: staging
          - env: prod
  template:
    metadata:
      name: "bookstore-{{ .env }}"
    spec:
      project: default
      source:
        repoURL: "https://github.com/<ORG>/<REPO>"
        targetRevision: main
        path: "full-guide/examples/bookstore/kustomize/overlays/{{ .env }}"
      destination:
        name: "kind-bookstore-platform-{{ .env }}"
      syncPolicy:
        automated: { prune: true, selfHeal: true }
