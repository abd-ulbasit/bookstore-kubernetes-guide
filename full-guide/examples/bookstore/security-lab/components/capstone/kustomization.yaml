# Shared by the vulnerable and the hardened capstone overlays.
#
# Two jobs, and nothing else:
#
# 1. Slim the bookstore to what the capstone's kill chain touches. The
#    catalog, postgres, the migration Job and the ServiceAccounts stay.
#    Storefront, orders, payments-worker and RabbitMQ are removed, with
#    their PodDisruptionBudgets, the autoscaler and the cleanup CronJob, so
#    one small kind cluster can run the set. Redis stays: the catalog's readiness
#    check dials it, and a catalog that is not ready never joins its
#    Service. The payments-worker ServiceAccount stays, because the attack
#    borrows its identity. Drop this component to render the full bookstore.
#
# 2. Rewrite the six cross-namespace DNS names from `bookstore` to
#    `p05-capstone`. The base hard-codes `bookstore` in them, so the
#    renamed namespace would otherwise send the catalog to a Service that
#    does not exist. The namespace transformer does not touch these values.
apiVersion: kustomize.config.k8s.io/v1alpha1
kind: Component

patches:
  - target: {kind: Deployment, name: storefront}
    patch: |-
      $patch: delete
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: storefront
  - target: {kind: Deployment, name: orders}
    patch: |-
      $patch: delete
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: orders
  - target: {kind: Deployment, name: payments-worker}
    patch: |-
      $patch: delete
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: payments-worker
  - target: {kind: Deployment, name: rabbitmq}
    patch: |-
      $patch: delete
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: rabbitmq
  - target: {kind: CronJob, name: cleanup}
    patch: |-
      $patch: delete
      apiVersion: batch/v1
      kind: CronJob
      metadata:
        name: cleanup
  - target: {kind: HorizontalPodAutoscaler, name: catalog}
    patch: |-
      $patch: delete
      apiVersion: autoscaling/v2
      kind: HorizontalPodAutoscaler
      metadata:
        name: catalog
  - target: {kind: PodDisruptionBudget, name: catalog}
    patch: |-
      $patch: delete
      apiVersion: policy/v1
      kind: PodDisruptionBudget
      metadata:
        name: catalog
  - target: {kind: PodDisruptionBudget, name: orders}
    patch: |-
      $patch: delete
      apiVersion: policy/v1
      kind: PodDisruptionBudget
      metadata:
        name: orders
  - target: {kind: PodDisruptionBudget, name: storefront}
    patch: |-
      $patch: delete
      apiVersion: policy/v1
      kind: PodDisruptionBudget
      metadata:
        name: storefront
  # The base's postgres probes allow one second per check, and the liveness
  # probe restarts the container after three misses. On a small lab cluster
  # under load the first initdb outlived those probes, and a restart in the
  # middle of it left a data directory that never created the database. The
  # capstone allows more time to start and to answer. The base keeps its
  # probes.
  - target: {kind: StatefulSet, name: postgres}
    patch: |-
      apiVersion: apps/v1
      kind: StatefulSet
      metadata:
        name: postgres
      spec:
        template:
          spec:
            containers:
              - name: postgres
                livenessProbe:
                  initialDelaySeconds: 180
                  timeoutSeconds: 10
                  failureThreshold: 6
                readinessProbe:
                  timeoutSeconds: 10
  - target: {kind: ConfigMap, name: catalog-config}
    patch: |-
      apiVersion: v1
      kind: ConfigMap
      metadata:
        name: catalog-config
      data:
        REDIS_ADDR: redis.p05-capstone.svc.cluster.local:6379
  # DB_DSN is the sixth env entry of the catalog container, after the
  # POSTGRES_* entries it expands. A JSON 6902 patch replaces its value in
  # place. The test guards the index: if the base moves the entry, the
  # render fails instead of writing the value into the wrong field.
  - target: {kind: Deployment, name: catalog}
    patch: |-
      - op: test
        path: /spec/template/spec/containers/0/env/5/name
        value: DB_DSN
      - op: replace
        path: /spec/template/spec/containers/0/env/5/value
        value: "host=postgres.p05-capstone.svc.cluster.local port=5432 user=$(POSTGRES_USER) password=$(POSTGRES_PASSWORD) dbname=$(POSTGRES_DB) sslmode=disable"
  # The base gives the migration Job 120 seconds in total, including the
  # time its Pod takes to start. On a small lab cluster, postgres and the Pod
  # sandbox can take longer than that, and the Job then fails with
  # DeadlineExceeded before the schema exists. This raises the cap for the
  # capstone only. The base keeps its 120 seconds.
  - target: {kind: Job, name: db-migrate}
    patch: |-
      apiVersion: batch/v1
      kind: Job
      metadata:
        name: db-migrate
      spec:
        activeDeadlineSeconds: 900
        template:
          spec:
            containers:
              - name: migrate
                env:
                  - name: PGHOST
                    value: postgres.p05-capstone.svc.cluster.local
