# Bookstore — Part 02 ch.02 "Services": rabbitmq as a Service/DNS target.
#
# NETWORKING SCAFFOLDING ONLY. The async path (orders publishes, payments-worker
# consumes) needs a broker that exists as a real Deployment + ClusterIP Service
# so DNS (`rabbitmq.bookstore.svc.cluster.local`), kube-proxy routing, and the
# NetworkPolicy egress rule (orders -> rabbitmq, ch.06) have a concrete target.
# Minimal: official `rabbitmq:3.13-management`, no persistence. Durable
# storage / clustering is Part 03. The login is not the image's stock `guest`:
# RABBITMQ_DEFAULT_USER and RABBITMQ_DEFAULT_PASS come from the db-credentials
# Secret (16-), so the broker creates that one user and no `guest` account.
# orders and payments-worker read the matching AMQP_URL from the same Secret.
#
# Two ports: 5672 (AMQP, used by orders/payments-worker) and 15672 (the
# management UI, handy for `kubectl port-forward` inspection in hands-on).
#
# Part 05 ch.02 (Pod Security) increment: the `bookstore` namespace enforces
# the PSA `restricted` standard (00-namespace.yaml) for EVERY pod, rabbitmq
# included. rabbitmq is the most demanding stock image here: it writes the
# Mnesia DB + Erlang cookie under /var/lib/rabbitmq, and its entrypoint normally
# does root-level cookie-permission setup. To make it BOTH restricted-valid AND
# bootable we run directly as the non-root rabbitmq UID/GID 999, set fsGroup
# 999, and back /var/lib/rabbitmq with an emptyDir the kubelet chowns to 999.
# drop ALL + no-privilege-escalation + runAsNonRoot + seccomp RuntimeDefault =
# restricted. The rest of the Part 01 ch.01 baseline holds too: the image is
# pinned by digest and the root FS is read-only. `restricted` asks for neither.
# labs/05-02.sh in examples/security-lab applies this file under restricted and
# records the broker reaching Ready. The startupProbe below covers the broker's
# boot, which runs longer than the liveness probe's first failures allow.
#
# Requires:
#   kubectl apply -f examples/bookstore/raw-manifests/00-namespace.yaml
#   kubectl apply -f examples/bookstore/raw-manifests/16-db-credentials.yaml  # the login
# Apply:
#   kubectl apply -f examples/bookstore/raw-manifests/13-rabbitmq.yaml
apiVersion: apps/v1
kind: Deployment
metadata:
  name: rabbitmq
  namespace: bookstore
  labels:
    app: rabbitmq
    component: queue
    app.kubernetes.io/part-of: bookstore
spec:
  replicas: 1                       # single broker for the guide
  selector:
    matchLabels:
      app: rabbitmq
  template:
    metadata:
      labels:
        app: rabbitmq               # selected by the Service in 40-services.yaml
        component: queue
    spec:
      # --- Part 05 ch.01: dedicated identity, no API token mounted (rabbitmq
      # never calls kube-apiserver). No Bookstore Pod uses the `default` SA.
      serviceAccountName: rabbitmq-sa
      automountServiceAccountToken: false
      # --- Part 05 ch.02: pod-level securityContext (PSA `restricted`). Run as
      # the non-root rabbitmq UID/GID 999; fsGroup 999 owns the data emptyDir
      # so Mnesia + the Erlang cookie are writable without the image's root step.
      securityContext:
        runAsNonRoot: true
        runAsUser: 999
        runAsGroup: 999
        fsGroup: 999
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: rabbitmq
          # Official image; ships AMQP + mgmt UI.
          image: rabbitmq@sha256:e582c0bc7766f3342496d8485efb5a1df782b5ce3886ad017e2eaae442311f69  # rabbitmq:3.13-management
          # --- Part 05 ch.02: container securityContext. drop ALL +
          # no-privilege-escalation + (pod) runAsNonRoot + seccomp
          # RuntimeDefault = restricted. The read-only root FS is the baseline:
          # the broker writes only to the emptyDirs mounted below.
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          # The broker's only user, from the Secret (16-). With a default user
          # set, the broker does not create the stock `guest` account.
          env:
            - name: RABBITMQ_DEFAULT_USER
              valueFrom:
                secretKeyRef: { name: db-credentials, key: RABBITMQ_DEFAULT_USER }
            - name: RABBITMQ_DEFAULT_PASS
              valueFrom:
                secretKeyRef: { name: db-credentials, key: RABBITMQ_DEFAULT_PASS }
          ports:
            - name: amqp
              containerPort: 5672
            - name: management
              containerPort: 15672
          # A broker boots in tens of seconds on a slow disk, and liveness must
          # not kill it before it listens. The startup probe holds liveness off
          # for up to 5 minutes (60 checks, 5s apart).
          startupProbe:
            tcpSocket: { port: amqp }
            periodSeconds: 5
            failureThreshold: 60
          readinessProbe:
            tcpSocket: { port: amqp }
            initialDelaySeconds: 15
            periodSeconds: 10
          livenessProbe:
            tcpSocket: { port: amqp }
            initialDelaySeconds: 30
            periodSeconds: 15
          # RabbitMQ sets its memory alarm from the container limit. At 512Mi, a
          # boot on a busy lab host raised the alarm and the port stayed closed
          # for the whole rollout wait. At 1Gi the same boot reached Ready.
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 1Gi
          # --- Part 05 ch.02: Mnesia DB + Erlang cookie dir on an emptyDir
          # (chowned to fsGroup 999). Ephemeral — matches "no persistence".
          volumeMounts:
            - name: data
              mountPath: /var/lib/rabbitmq
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: data
          emptyDir:
            sizeLimit: 256Mi
        - name: tmp
          emptyDir:
            sizeLimit: 32Mi
