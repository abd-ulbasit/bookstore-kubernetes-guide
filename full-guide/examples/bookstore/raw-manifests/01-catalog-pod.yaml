# Bookstore: first manifest (Part 00, ch.06 "The declarative API model"),
# carrying the security baseline from Part 01 ch.01.
#
# catalog as a single BARE Pod. A bare Pod has no controller restoring it if it
# dies, so it graduates to a Deployment in Part 01
# (04-replicasets-and-deployments.md). What it does have from the first
# manifest on is the baseline every Bookstore workload carries; each field is
# explained, against the threat it answers, in 01-core-workloads/01-pods.md.
#
# Needs the `bookstore` namespace (Pod Security `restricted`) and the
# `catalog-sa` ServiceAccount, both created in Part 00 ch.07 step 6. Part 01
# ch.01 step 1 checks both before this manifest is applied:
#   kubectl apply -n bookstore -f examples/bookstore/raw-manifests/01-catalog-pod.yaml
# Both dry runs need a reachable cluster, because kubectl reads the API
# discovery first. Part 00 ch.06 shows the server-side and client-side forms:
#   kubectl apply --dry-run=client -n bookstore -f examples/bookstore/raw-manifests/01-catalog-pod.yaml
# The image must be on the node first: `kind load docker-image bookstore/catalog:dev`.
apiVersion: v1                 # core API group, version v1
kind: Pod                      # GVK = (core, v1, Pod)
metadata:
  name: catalog                # unique within (namespace, kind)
  labels:                      # identifying — what selectors will match later
    app: catalog               # the canonical label other objects will select on
    component: backend
spec:                          # DESIRED state (you write this; status is observed)
  serviceAccountName: catalog-sa          # its own identity, never `default`
  automountServiceAccountToken: false     # the app never calls the API: no token
  securityContext:             # Pod level: applies to every container
    runAsNonRoot: true
    runAsUser: 65532           # the UID the image declares (distroless nonroot)
    runAsGroup: 65532
    seccompProfile:
      type: RuntimeDefault
  containers:
    - name: catalog            # container name (unique within the Pod)
      image: bookstore/catalog:dev   # the image built in ch.02
      imagePullPolicy: IfNotPresent  # use the locally loaded image (ch.07 kind load)
      ports:
        - name: http
          containerPort: 8080  # the port the Go app listens on
      env:
        - name: PORT           # the app reads PORT (defaults to 8080)
          value: "8080"
      securityContext:         # container level
        allowPrivilegeEscalation: false
        readOnlyRootFilesystem: true
        capabilities:
          drop: ["ALL"]
      resources:               # sized per Part 01 ch.03
        requests:
          cpu: 50m
          memory: 64Mi
        limits:
          memory: 128Mi
      volumeMounts:
        - name: tmp
          mountPath: /tmp      # writable paths come from emptyDir
  volumes:
    - name: tmp
      emptyDir:
        sizeLimit: 64Mi    # every emptyDir is capped (Part 03 ch.03)
