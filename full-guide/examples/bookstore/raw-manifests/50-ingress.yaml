# Bookstore — Part 02 ch.04 "Ingress": one external entrypoint, TLS-terminated.
#
# Ingress is L7 HTTP routing into the cluster: host + path rules map to the
# in-cluster Services from 40-services.yaml. An Ingress CONTROLLER (Traefik in
# ch.04) watches Ingress objects and programs a reverse proxy; the Ingress
# object alone does nothing without a controller (see ch.04).
#
# Routing (host bookstore.localdev.me — *.localdev.me resolves to 127.0.0.1,
# convenient for local kind; swap for your domain in production):
#   /            -> storefront:80   (the UI; catch-all)
#   /api/books   -> catalog:80
#   /api/orders  -> orders:80
# This file is the PORTABLE form: class `traefik`, `Prefix` paths only, no
# controller-specific annotation, so any controller reads it the same way.
#
# One thing it cannot express. The storefront calls /api/books and
# /api/orders (app/storefront/index.html), but the services serve /books and
# /orders (app/catalog/main.go, app/orders/main.go). A request that reaches
# them as /api/books is a 404, so something at the edge must strip the /api
# prefix. Traefik does it with a Middleware, a custom resource, so it lives in
# 50-ingress-traefik.yaml (this Ingress plus the Middleware and the annotation
# that attaches it). The Helm chart (ingress.traefikRewrite.enabled) and the
# Kustomize `traefik-rewrite` component carry the same pair, off by default
# because a Middleware needs the Traefik CRDs and the default render stays
# free of CRD kinds.
#
# TLS is terminated at the Ingress using a Secret holding a cert+key. For
# local use, generate a self-signed cert (see ch.04 hands-on) and create the
# Secret `bookstore-tls`; in production this is cert-manager/ACME.
#
# This is the Ingress form. 51-gateway.yaml is the EQUIVALENT expressed with
# Gateway API and is a MUTUALLY EXCLUSIVE ALTERNATIVE — apply 50- OR 51-,
# never both (they'd bind the same hostname/paths via two different data
# planes). Both are dry-run valid; pick one stack. See ch.05.
#
# Requires:
#   kubectl apply -f examples/bookstore/raw-manifests/40-services.yaml
#   # Traefik installed under `restricted` (ch.04 step 2), class `traefik`
#   # TLS Secret (ch.04):
#   #   openssl req -x509 -nodes -days 365 -newkey rsa:2048 \
#   #     -keyout tls.key -out tls.crt -subj "/CN=bookstore.localdev.me" \
#   #     -addext "subjectAltName=DNS:bookstore.localdev.me"
#   #   kubectl create secret tls bookstore-tls -n bookstore \
#   #     --cert=tls.crt --key=tls.key
# Apply:
#   kubectl apply -f examples/bookstore/raw-manifests/50-ingress.yaml
#   kubectl get ingress -n bookstore
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: bookstore
  namespace: bookstore
  labels:
    app.kubernetes.io/part-of: bookstore
spec:
  ingressClassName: traefik         # which controller owns this Ingress
  tls:
    - hosts:
        - bookstore.localdev.me
      secretName: bookstore-tls     # cert+key Secret terminates TLS here
  rules:
    - host: bookstore.localdev.me
      http:
        paths:
          - path: /api/books
            pathType: Prefix
            backend:
              service:
                name: catalog
                port:
                  number: 80
          - path: /api/orders
            pathType: Prefix
            backend:
              service:
                name: orders
                port:
                  number: 80
          - path: /
            pathType: Prefix                   # everything else -> the UI
            backend:
              service:
                name: storefront
                port:
                  number: 80
