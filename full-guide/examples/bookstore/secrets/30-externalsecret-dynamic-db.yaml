# Bookstore — Part 11 ch.05 "Secrets at scale": DYNAMIC secrets. A
# VaultDynamicSecret generator asks Vault's DATABASE secrets engine for a new,
# short-lived Postgres role on each refresh, and an ExternalSecret writes the
# returned username and password into one Secret.
#
# LAB ONLY. The VAULT-SIDE SETUP below uses sslmode=disable, so the CREATE ROLE
#   statements and their passwords cross the cluster network in clear, and the
#   username/password pair is a static superuser that stays valid. A production setup
#   uses sslmode=verify-full with a Postgres certificate, and rotates the root
#   credential with `vault write -force database/rotate-root/bookstore-pg`.
#
# STATIC vs DYNAMIC (the core idea this file teaches)
#   20-externalsecret-db-credentials.yaml syncs a STATIC value: one password in
#   Vault KV, and rotation means changing it. A dynamic credential has no
#   stored password. Vault mints a unique role per request with a TTL and
#   revokes it when the lease ends, so a leaked dynamic credential is dead
#   after its lease and revocation is one API call.
#
# WHY A GENERATOR, NOT A remoteRef
#   The Vault provider in ESO reads KV paths only, and sends other engines to
#   the generator. A remoteRef on database/creds/... would be read as a KV path
#   and fail. The generator is a separate object, so this file has two.
#
# VAULT-SIDE SETUP (the `vault` CLI it assumes; dev mode):
#   vault secrets enable database
#   vault write database/config/bookstore-pg \
#     plugin_name=postgresql-database-plugin \
#     allowed_roles="bookstore-app" \
#     connection_url="postgresql://{{username}}:{{password}}@postgres.bookstore.svc.cluster.local:5432/bookstore?sslmode=disable" \
#     username="bookstore" password="devpassword"   # the bootstrap admin (demo)
#   vault write database/roles/bookstore-app \
#     db_name=bookstore-pg \
#     creation_statements="CREATE ROLE \"{{name}}\" WITH LOGIN PASSWORD '{{password}}' VALID UNTIL '{{expiration}}'; GRANT SELECT ON ALL TABLES IN SCHEMA public TO \"{{name}}\";" \
#     default_ttl="1h" max_ttl="24h"
#   (bookstore-ro policy in 00- already allows read on database/creds/bookstore-app.)
#
# HONEST SCOPE: the Bookstore's Deployments read DB_DSN from the Secret's keys
# at container start (Part 03 ch.02). A rotated username therefore needs a
# rollout to reach the app. This file shows the pattern and the production
# direction. The static 20- file is the drop-in replacement for 16-.
#
# !!! CRD-INTRINSIC DRY-RUN (precedent: 10-/20-) !!!
#   VaultDynamicSecret is a generators.external-secrets.io/v1alpha1 CRD that the
#   ESO chart installs. Before ESO is installed, a client dry-run prints
#   `no matches for kind "VaultDynamicSecret"`. That is expected.
#
# Requires: ESO 2.12.0 installed with its CRDs; Vault database engine configured
#   (above); 05- and 10- applied.
# Apply:
#   kubectl apply -f examples/bookstore/secrets/30-externalsecret-dynamic-db.yaml
#   kubectl get secret bookstore-db-dynamic -n bookstore -o jsonpath='{.data.username}' | base64 -d
#   # after the next refresh the username and password DIFFER: Vault minted new ones.
apiVersion: generators.external-secrets.io/v1alpha1
kind: VaultDynamicSecret
metadata:
  name: bookstore-db-dynamic-gen
  namespace: bookstore
  labels:
    app.kubernetes.io/part-of: bookstore
spec:
  path: "database/creds/bookstore-app"   # the Vault role's credential endpoint
  method: "GET"
  provider:
    server: "http://vault.vault.svc.cluster.local:8200"
    auth:
      kubernetes:
        mountPath: "kubernetes"
        role: "bookstore-eso"            # 00-: bound to policy bookstore-ro
        serviceAccountRef:
          name: "bookstore-eso"          # 05-: a token is requested for this SA
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: bookstore-db-dynamic
  namespace: bookstore
  labels:
    app.kubernetes.io/part-of: bookstore
spec:
  # Shorter than the role's default_ttl (1h in the Vault setup above), so each
  # refresh mints a credential that stays alive for its whole TTL.
  refreshInterval: "30m"
  target:
    name: bookstore-db-dynamic      # a SEPARATE Secret (not db-credentials):
    creationPolicy: Owner           # this is the dynamic-creds demo, additive
    template:
      type: Opaque
  dataFrom:
    # One generator read per refresh: username and password come from the same
    # lease, so they always match each other.
    - sourceRef:
        generatorRef:
          apiVersion: generators.external-secrets.io/v1alpha1
          kind: VaultDynamicSecret
          name: bookstore-db-dynamic-gen
