# Bookstore — Part 11 ch.05 "Secrets at scale": the ServiceAccount whose
# identity External Secrets Operator (ESO) presents to Vault's Kubernetes auth
# method. The SecretStore (10-) names it, and 00-vault-policy-and-role.yaml
# binds it to the bookstore-ro policy: read secret/data/bookstore/db and
# database/creds/bookstore-app, and nothing else.
#
# WHY THIS SA HAS NO RBAC AND NO MOUNTED TOKEN:
#   * ESO does not mount this token into a Pod. The ESO controller asks the
#     API server for a short-lived token for this ServiceAccount (TokenRequest,
#     which its RBAC allows) and presents that token to Vault.
#     automountServiceAccountToken: false is therefore safe.
#   * The ESO controller writes the db-credentials Secret, not this SA. A Role
#     that let this SA write Secrets would give anyone holding its token that
#     write access in the namespace, and the sync does not need it, so it is
#     not here.
#
# Built-in kind: a client dry-run is clean with no CRD installed.
# Requires: kubectl apply -f examples/bookstore/raw-manifests/00-namespace.yaml
# Apply (BEFORE the SecretStore/ExternalSecret):
#   kubectl apply -f examples/bookstore/secrets/05-eso-serviceaccount.yaml
apiVersion: v1
kind: ServiceAccount
metadata:
  name: bookstore-eso
  namespace: bookstore
  labels:
    app.kubernetes.io/part-of: bookstore
automountServiceAccountToken: false
