# Bookstore: Part 12 ch.05, the restricted shape of one notebook Pod.
#
# ILLUSTRATIVE. The hub builds this Pod from the values in the chapter
# (KubeSpawner settings: uid, fsGid, serviceAccountName, the pod and container
# security contexts, and automount off). Apply it only as a server dry run,
# to check that the shape passes the restricted Pod Security level:
#
#   kubectl apply --dry-run=server -n jupyter -f <this file>
#
# The image is pinned by digest. Its config User is 1000, so runAsUser 1000
# is set on the container and runAsNonRoot is true on the Pod.
apiVersion: v1
kind: Pod
metadata:
  name: jupyter-singleuser-illustrative
  namespace: jupyter
  labels:
    app: jupyterhub
    component: singleuser-server
    release: jupyterhub
    hub.jupyter.org/network-access-hub: "true"
spec:
  serviceAccountName: jupyterhub-singleuser
  automountServiceAccountToken: false
  restartPolicy: OnFailure
  securityContext:
    runAsNonRoot: true
    fsGroup: 100
    seccompProfile:
      type: RuntimeDefault
  containers:
    - name: notebook
      image: quay.io/jupyter/scipy-notebook:2024-08-12@sha256:a8925f5242a701edd718a4c1afc3bdeabb7dcb9ae6ff55116db790379a6f6e04
      args: ["start-singleuser.sh"]
      ports:
        - containerPort: 8888
          name: http
      env:
        - name: HOME
          value: /home/jovyan
        - name: JUPYTER_RUNTIME_DIR
          value: /home/jovyan/.local/share/jupyter/runtime
        - name: JUPYTER_DATA_DIR
          value: /home/jovyan/.local/share/jupyter
        - name: PIP_CACHE_DIR
          value: /home/jovyan/.cache/pip
      resources:
        requests:
          cpu: "250m"
          memory: 512Mi
        limits:
          cpu: "2"
          memory: 2Gi
      readinessProbe:
        httpGet: { path: /api, port: 8888 }
        initialDelaySeconds: 10
        periodSeconds: 5
      livenessProbe:
        httpGet: { path: /api, port: 8888 }
        initialDelaySeconds: 30
        periodSeconds: 30
      securityContext:
        runAsUser: 1000
        allowPrivilegeEscalation: false
        readOnlyRootFilesystem: true
        capabilities:
          drop: ["ALL"]
      volumeMounts:
        - name: home
          mountPath: /home/jovyan
        - name: tmp
          mountPath: /tmp
        - name: cache
          mountPath: /home/jovyan/.cache
  volumes:
    - name: home
      # The hub replaces this with the per-user PVC it creates for the user.
      persistentVolumeClaim:
        claimName: jupyter-home-illustrative
    - name: tmp
      emptyDir:
        sizeLimit: 256Mi
    - name: cache
      emptyDir:
        sizeLimit: 512Mi
