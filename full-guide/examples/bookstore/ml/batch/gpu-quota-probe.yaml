# Bookstore: Part 12 ch.03 "Batch and gang scheduling": a Pod that asks for
# five GPUs in a namespace whose hard ResourceQuota allows four.
#
# DELIBERATE DENIAL. The namespace ResourceQuota (requests.nvidia.com/gpu=4,
# created in the chapter's Hands-on) rejects this Pod at admission, before any
# scheduling. The request is secure (restricted-compliant, the baseline from
# Part 01 ch.01); it is over quota on purpose so the cap can be seen working.
#
# Apply with a server dry run, so nothing is stored. Apply
# recommender-batch-serviceaccount.yaml first:
#   kubectl apply --dry-run=server -f gpu-quota-probe.yaml
#
# Expected: the API server refuses it with "exceeded quota". Changing the two
# "5" values to "4" makes the same dry run succeed.
apiVersion: v1
kind: Pod
metadata:
  name: gpu-quota-probe
  namespace: bookstore-ml
  labels:
    app.kubernetes.io/part-of: bookstore-ml
    app.kubernetes.io/component: recommender-train
spec:
  restartPolicy: Never
  serviceAccountName: recommender-batch   # recommender-batch-serviceaccount.yaml
  automountServiceAccountToken: false
  securityContext:
    runAsNonRoot: true
    runAsUser: 65532
    runAsGroup: 65532
    seccompProfile:
      type: RuntimeDefault
  containers:
    - name: train
      image: busybox@sha256:73aaf090f3d85aa34ee199857f03fa3a95c8ede2ffd4cc2cdb5b94e566b11662   # busybox:1.36
      command: ["/bin/sh", "-c", "sleep 3600"]
      securityContext:
        allowPrivilegeEscalation: false
        readOnlyRootFilesystem: true
        capabilities:
          drop: ["ALL"]
      resources:
        requests:
          cpu: 250m
          memory: 64Mi
          nvidia.com/gpu: "5"
        limits:
          cpu: 500m
          memory: 128Mi
          nvidia.com/gpu: "5"
      volumeMounts:
        - name: scratch
          mountPath: /tmp
  volumes:
    - name: scratch
      emptyDir:
        sizeLimit: 64Mi
