# Bookstore: Part 12 ch.03 "Batch and gang scheduling". Values for the pinned
# Kueue chart (oci://registry.k8s.io/kueue/charts/kueue, version 0.17.0), passed
# with -f. Everything not listed here is the chart default, copied verbatim.
#
# Three changes from the defaults:
#
# 1. manageJobsWithoutQueueName: true. Kueue's configuration reference says that
#    with this flag set, Jobs that lack the kueue.x-k8s.io/queue-name label are
#    suspended and never started unless they are assigned a queue. With the
#    default (false) such a Job is unmanaged and starts at once, outside the
#    ClusterQueue quota. managedJobsNamespaceSelector limits the flag to
#    namespaces labelled app.kubernetes.io/part-of=bookstore-ml, the label the
#    ch.01 namespace carries. Other namespaces are not managed at all.
#
#    The flag applies to every integration listed under frameworks. The chart
#    default also lists pod, deployment and statefulset. This file removes
#    those three: with the flag on, a bare Pod, Deployment or StatefulSet in
#    bookstore-ml that carries no queue label is suspended and never starts,
#    so the probes, the rendezvous check and the serving Pods of later chapters
#    would wait for a queue they are never given. Jobs, JobSets and the
#    training operators' jobs stay managed. The chart still renders the
#    mpod, mdeployment and mstatefulset webhooks, with failurePolicy Ignore.
#    For an integration that is not listed, Kueue installs a no-op handler
#    there, so those webhooks gate nothing.
#
# 2. waitForPodsReady is on. A workload that Kueue admitted must reach
#    PodsReady within 5 minutes, and blockAdmission stops Kueue from admitting
#    the next workload until it does. Quota is counted logically, so Kueue can
#    admit a gang that the scheduler then places only in part. This setting
#    evicts such a gang after the timeout and holds the queue while it waits.
#    It does not make placement atomic. In Kueue v0.17.0 the block being
#    present turns the feature on; the struct has no enable field.
#
# 3. The controller image is pinned by digest. The tag v0.17.0 is kept in front
#    of the digest, so the reference reads as the chart's own tag plus the
#    digest that was pulled.
#
# Install with:
#   helm install kueue oci://registry.k8s.io/kueue/charts/kueue \
#     --version 0.17.0 -n kueue-system -f kueue-values.yaml --wait
controllerManager:
  manager:
    image:
      tag: v0.17.0@sha256:368d2053ffd9783d4e7e76405d0c7e43917b307050f10b362a71c5890d379df0
managerConfig:
  controllerManagerConfigYaml: |-
    apiVersion: config.kueue.x-k8s.io/v1beta2
    kind: Configuration
    health:
      healthProbeBindAddress: :8081
    metrics:
      bindAddress: :8443
    # enableClusterQueueResources: true
    webhook:
      port: 9443
    leaderElection:
      leaderElect: true
      resourceName: c1f6bfd2.kueue.x-k8s.io
    controller:
      groupKindConcurrency:
        Job.batch: 5
        Pod: 5
        Workload.kueue.x-k8s.io: 5
        LocalQueue.kueue.x-k8s.io: 1
        ClusterQueue.kueue.x-k8s.io: 1
        ResourceFlavor.kueue.x-k8s.io: 1
    clientConnection:
      qps: 50
      burst: 100
    #pprofBindAddress: :8083
    waitForPodsReady:
      timeout: 5m
      recoveryTimeout: 3m
      blockAdmission: true
    #  requeuingStrategy:
    #    timestamp: Eviction
    #    backoffLimitCount: null # null indicates infinite requeuing
    #    backoffBaseSeconds: 60
    #    backoffMaxSeconds: 3600
    manageJobsWithoutQueueName: true
    managedJobsNamespaceSelector:
      matchLabels:
        app.kubernetes.io/part-of: bookstore-ml
    #internalCertManagement:
    #  enable: false
    #  webhookServiceName: ""
    #  webhookSecretName: ""
    integrations:
      frameworks:
      - "batch/job"
      - "kubeflow.org/mpijob"
      - "ray.io/rayjob"
      - "ray.io/rayservice"
      - "ray.io/raycluster"
      - "jobset.x-k8s.io/jobset"
      - "trainer.kubeflow.org/trainjob"
      - "kubeflow.org/paddlejob"
      - "kubeflow.org/pytorchjob"
      - "kubeflow.org/tfjob"
      - "kubeflow.org/xgboostjob"
      - "kubeflow.org/jaxjob"
      - "workload.codeflare.dev/appwrapper"
    #  - "sparkoperator.k8s.io/sparkapplication"
      - "leaderworkerset.x-k8s.io/leaderworkerset"
    #  externalFrameworks:
    #  - "Foo.v1.example.com"
    #fairSharing:
    #  preemptionStrategies: [LessThanOrEqualToFinalShare, LessThanInitialShare]
    #admissionFairSharing:
    #  usageHalfLifeTime: "168h" # 7 days
    #  usageSamplingInterval: "5m"
