# Bookstore: Part 12 ch.03 "Batch and gang scheduling". The ServiceAccount the
# three ch.03 workloads run as: recommender-jobset.yaml, unlabelled-probe.yaml
# and gpu-quota-probe.yaml. Without it they would run as the namespace's
# `default` ServiceAccount, and this Part does not run anything as `default`.
#
# The account has no RoleBinding, so it cannot read Pods, Secrets or any other
# object in the namespace, and no token is mounted into the Pods.
#
# Apply this file before the three workloads. A server dry run of a Pod fails
# with "serviceaccount not found" until the account exists in the namespace.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: recommender-batch
  namespace: bookstore-ml
  labels:
    app.kubernetes.io/part-of: bookstore-ml
    app.kubernetes.io/component: recommender-batch
automountServiceAccountToken: false
