# Bookstore: Part 12 ch.03 "Batch and gang scheduling": a Job with NO queue
# label, to show the queue bypass being closed.
#
# This Job is secure (restricted-compliant) but it names no LocalQueue. With
# kueue-values.yaml (manageJobsWithoutQueueName: true, scoped to namespaces
# labelled app.kubernetes.io/part-of=bookstore-ml), Kueue manages it, keeps it
# suspended and creates no Pods. With the chart default (false) it would start
# at once, outside the ClusterQueue quota. The namespace ResourceQuota still
# caps any GPU it asked for, either way.
#
# Expected, not yet captured: the Job reports spec.suspend true and no Pods.
apiVersion: batch/v1
kind: Job
metadata:
  name: unlabelled-probe
  namespace: bookstore-ml
  labels:
    app.kubernetes.io/part-of: bookstore-ml
spec:
  backoffLimit: 0
  template:
    metadata:
      labels:
        app.kubernetes.io/part-of: bookstore-ml
    spec:
      restartPolicy: Never
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: probe
          image: busybox@sha256:73aaf090f3d85aa34ee199857f03fa3a95c8ede2ffd4cc2cdb5b94e566b11662   # busybox:1.36
          command: ["/bin/sh", "-c", "echo this Job was not queued"]
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          resources:
            requests:
              cpu: 100m
              memory: 32Mi
            limits:
              cpu: 200m
              memory: 64Mi
          volumeMounts:
            - name: scratch
              mountPath: /tmp
      volumes:
        - name: scratch
          emptyDir:
            sizeLimit: 16Mi
