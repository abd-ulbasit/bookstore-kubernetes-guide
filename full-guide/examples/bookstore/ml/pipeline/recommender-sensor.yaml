# Bookstore, Part 12 ch.07 "ML pipelines and workflows": Argo Events
# `Sensor`. It turns an event from recommender-eventsource.yaml into a Workflow
# that runs the recommender-pipeline WorkflowTemplate in bookstore-ml.
#
# !!! CRD-INTRINSIC DRY-RUN (same precedent as recommender-workflow.yaml) !!!
#   `Sensor` is an Argo Events CRD (argoproj.io/v1alpha1). Without Argo Events
#   installed, a client dry-run prints:
#     no matches for kind "Sensor" in version "argoproj.io/v1alpha1"
#   That is expected. Install the chart first (argo-events-values.yaml).
#
# WHO CALLS THE API
#   The Sensor's Pod creates the Workflow with its own ServiceAccount token.
#   That ServiceAccount lives in argo-events, so the Role that allows the
#   create sits in bookstore-ml and its RoleBinding names the argo-events
#   ServiceAccount. A Pod cannot use a ServiceAccount from another namespace,
#   which is why the Sensor's ServiceAccount is in argo-events.
#
# WHAT THE ROLE ALLOWS
#   create on workflows in bookstore-ml, and nothing else. A create cannot be
#   narrowed to one name (RBAC resourceNames does not apply to create), so a
#   compromised Sensor could submit any Workflow in bookstore-ml, and any
#   ServiceAccount in it. The Workflow this trigger builds is fixed by this
#   file. Keep who may submit Workflows to this Sensor and the release
#   pipeline (ch.07 "Threats and controls").
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: recommender-sensor
  namespace: argo-events
  labels:
    app.kubernetes.io/part-of: bookstore-ml
    app.kubernetes.io/component: ml-pipeline-events
# The Sensor calls the Kubernetes API, so its token stays mounted. This is the
# one dedicated ServiceAccount that needs one.
automountServiceAccountToken: true
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: recommender-sensor
  namespace: bookstore-ml
  labels:
    app.kubernetes.io/part-of: bookstore-ml
    app.kubernetes.io/component: ml-pipeline-events
rules:
  - apiGroups: ["argoproj.io"]
    resources: ["workflows"]
    verbs: ["create"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: recommender-sensor
  namespace: bookstore-ml
  labels:
    app.kubernetes.io/part-of: bookstore-ml
    app.kubernetes.io/component: ml-pipeline-events
subjects:
  - kind: ServiceAccount
    name: recommender-sensor
    namespace: argo-events
roleRef:
  kind: Role
  name: recommender-sensor
  apiGroup: rbac.authorization.k8s.io
---
apiVersion: argoproj.io/v1alpha1
kind: Sensor
metadata:
  name: recommender-dataset-ready
  namespace: argo-events
  labels:
    app.kubernetes.io/part-of: bookstore-ml
    app.kubernetes.io/component: ml-pipeline-events
spec:
  eventBusName: default
  template:
    serviceAccountName: recommender-sensor
    securityContext:
      runAsNonRoot: true
      runAsUser: 65532
      runAsGroup: 65532
      seccompProfile:
        type: RuntimeDefault
    container:
      securityContext:
        allowPrivilegeEscalation: false
        readOnlyRootFilesystem: true
        capabilities:
          drop: ["ALL"]
      resources:
        requests: { cpu: "50m",  memory: "64Mi" }
        limits:   { cpu: "200m", memory: "128Mi" }
      volumeMounts:
        - { name: tmp, mountPath: /tmp }
    volumes:
      - name: tmp
        emptyDir: {}
  dependencies:
    - name: dataset-ready
      eventSourceName: recommender-dataset    # the EventSource above
      eventName: dataset-ready                # the webhook route name above
  triggers:
    - template:
        name: trigger-recommender-pipeline
        # The k8s trigger creates a Workflow that references the
        # WorkflowTemplate by name, so the pipeline's shape lives in one place.
        k8s:
          operation: create
          source:
            resource:
              apiVersion: argoproj.io/v1alpha1
              kind: Workflow
              metadata:
                generateName: recommender-pipeline-
                namespace: bookstore-ml
                labels:
                  app.kubernetes.io/part-of: bookstore-ml
                  app.kubernetes.io/component: ml-pipeline
                  ml.bookstore/trigger: dataset-ready
              spec:
                serviceAccountName: argo-workflow
                workflowTemplateRef:
                  name: recommender-pipeline
                # To pass the dataset URI from the event body, add a
                # spec.arguments.parameters entry with a dataKey source. It is
                # left out here to keep the example small.
