# Bookstore, Part 12 ch.07 "ML pipelines and workflows": the recommender
# pipeline as an Argo Workflows `WorkflowTemplate` that runs the
# train -> eval -> register -> promote DAG.
#
# !!! CRD-INTRINSIC DRY-RUN (same precedent as raw-manifests/51-/70-/83-,
#     argocd/, operators/, chaos/, ml/batch/, ml/serve/recommender-inference-
#     service.yaml) !!!
#   `WorkflowTemplate` is an Argo Workflows CRD (argoproj.io/v1alpha1).
#   Without Argo Workflows installed, a client dry-run prints:
#     no matches for kind "WorkflowTemplate" in version "argoproj.io/v1alpha1"
#   That is expected. Install the chart first (argo-workflows-values.yaml).
#
# The first document (ServiceAccounts, Roles and RoleBindings) dry-runs cleanly
# anywhere; it is applied before the WorkflowTemplate.
#
# WHAT IT DOES (the four steps of the MLOps loop)
#   1. train   , runs `bookstore/recommender-train:dev` (the SAME image as
#                 ../train/recommender-train-job.yaml) and writes `model.joblib`
#                 to the shared PVC `recommender-model`.
#   2. eval    , runs a tiny Python evaluator in the same train image. It
#                 mounts the model read-only, writes its metrics to /tmp,
#                 gates on `min-score`, and emits two output parameters:
#                 `score` and `model-sha256` (the digest of the exact bytes it
#                 evaluated).
#   3. register, stamps the model URI, score, model digest and dataset
#                 lineage into a ConfigMap. KIND-RUNNABLE PROXY for a real
#                 model registry (MLflow / KFP Model Registry).
#   4. promote , annotates and rolls the `recommender` Deployment so its Pod
#                 re-reads the model. In prod this step is a GitOps commit
#                 that bumps the InferenceService `storageUri` (Part 07 ch.04).
#
# IDENTITY: one ServiceAccount per step that calls the API
#   argo-workflow       the default for every step; its only right is the
#                       executor's (workflowtaskresults). Train and eval get no
#                       API token at all.
#   recommender-register  may get, create and patch ConfigMaps in bookstore-ml.
#   recommender-promote   may get, list, watch and patch the one Deployment
#                         named `recommender`.
# Every ServiceAccount that runs a step also holds the executor Role, because
# the wait sidecar in each step Pod uses the step's identity to report results.
#
# PSA, every workflow Pod, the step container and the wait sidecar included,
# meets the restricted level. The pod-level settings come from podSpecPatch
# below; the wait sidecar's settings come from the chart's `executor` values
# (argo-workflows-values.yaml).
---
# Identity for the default step and the executor. The wait sidecar uses this
# token because `executor.serviceAccountName` names it below.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: argo-workflow
  namespace: bookstore-ml
  labels:
    app.kubernetes.io/part-of: bookstore-ml
    app.kubernetes.io/component: ml-pipeline
automountServiceAccountToken: true
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: recommender-register
  namespace: bookstore-ml
  labels:
    app.kubernetes.io/part-of: bookstore-ml
    app.kubernetes.io/component: ml-pipeline
automountServiceAccountToken: true
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: recommender-promote
  namespace: bookstore-ml
  labels:
    app.kubernetes.io/part-of: bookstore-ml
    app.kubernetes.io/component: ml-pipeline
automountServiceAccountToken: true
---
# The executor's own rights. The chart's default workflow Role grants exactly
# these two verbs on workflowtaskresults, and nothing else is needed here.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: pipeline-executor
  namespace: bookstore-ml
  labels:
    app.kubernetes.io/part-of: bookstore-ml
    app.kubernetes.io/component: ml-pipeline
rules:
  - apiGroups: ["argoproj.io"]
    resources: ["workflowtaskresults"]
    verbs: ["create", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: pipeline-executor
  namespace: bookstore-ml
  labels:
    app.kubernetes.io/part-of: bookstore-ml
    app.kubernetes.io/component: ml-pipeline
subjects:
  - kind: ServiceAccount
    name: argo-workflow
    namespace: bookstore-ml
  - kind: ServiceAccount
    name: recommender-register
    namespace: bookstore-ml
  - kind: ServiceAccount
    name: recommender-promote
    namespace: bookstore-ml
roleRef:
  kind: Role
  name: pipeline-executor
  apiGroup: rbac.authorization.k8s.io
---
# register: create is the verb that cannot be narrowed by name. RBAC ignores
# resourceNames on create, so this identity can create any ConfigMap in
# bookstore-ml. Keep secrets out of ConfigMaps, and give the registry its own
# namespace once the registry is real (Part 12 ch.08).
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: recommender-register
  namespace: bookstore-ml
  labels:
    app.kubernetes.io/part-of: bookstore-ml
    app.kubernetes.io/component: ml-pipeline
rules:
  - apiGroups: [""]
    resources: ["configmaps"]
    verbs: ["get", "create", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: recommender-register
  namespace: bookstore-ml
  labels:
    app.kubernetes.io/part-of: bookstore-ml
    app.kubernetes.io/component: ml-pipeline
subjects:
  - kind: ServiceAccount
    name: recommender-register
    namespace: bookstore-ml
roleRef:
  kind: Role
  name: recommender-register
  apiGroup: rbac.authorization.k8s.io
---
# promote: the verbs are limited to one named Deployment. The name must match
# the `DEPLOY` value in the promote-step script. Changing one without the other
# breaks the step, which fails closed.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: recommender-promote
  namespace: bookstore-ml
  labels:
    app.kubernetes.io/part-of: bookstore-ml
    app.kubernetes.io/component: ml-pipeline
rules:
  - apiGroups: ["apps"]
    resources: ["deployments"]
    resourceNames: ["recommender"]
    verbs: ["get", "list", "watch", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: recommender-promote
  namespace: bookstore-ml
  labels:
    app.kubernetes.io/part-of: bookstore-ml
    app.kubernetes.io/component: ml-pipeline
subjects:
  - kind: ServiceAccount
    name: recommender-promote
    namespace: bookstore-ml
roleRef:
  kind: Role
  name: recommender-promote
  apiGroup: rbac.authorization.k8s.io
---
# The WorkflowTemplate: train -> eval -> register -> promote.
apiVersion: argoproj.io/v1alpha1
kind: WorkflowTemplate
metadata:
  name: recommender-pipeline
  namespace: bookstore-ml
  labels:
    app.kubernetes.io/part-of: bookstore-ml
    app.kubernetes.io/component: ml-pipeline
    ml.bookstore/path: argo-workflows
spec:
  entrypoint: main
  # The default identity for every step. Steps that call the API set their
  # own serviceAccountName below.
  serviceAccountName: argo-workflow
  # Step containers get no API token by default. The wait sidecar gets the
  # executor ServiceAccount's token instead, through `executor` below. A
  # step that calls the API turns its token back on in its own template.
  automountServiceAccountToken: false
  executor:
    serviceAccountName: argo-workflow
  # ttlStrategy GCs the Workflow object and its Pods after the run.
  ttlStrategy:
    secondsAfterCompletion: 600
    secondsAfterFailure: 1800
  # Wall-clock cap so a runaway pipeline does not hold the queue.
  activeDeadlineSeconds: 1800
  # One retry for transient infrastructure errors. `OnError` does not retry a
  # step whose script exits non-zero (a failed eval gate is not retried).
  # promote opts out at the task level.
  retryStrategy:
    limit: 1
    retryPolicy: OnError
    backoff:
      duration: "30s"
      factor: 2
      maxDuration: "5m"
  arguments:
    parameters:
      - name: train-image
        value: "bookstore/recommender-train:dev"
      - name: model-pvc
        value: "recommender-model"
      - name: seed
        value: "42"
      - name: top-k
        value: "10"
      - name: min-score
        value: "0.05"           # eval gate: avg top-1 cosine must exceed this
      # Lineage parameters, copied into the register step's ConfigMap.
      # The placeholders are honest defaults. In prod, pin the dataset URI to
      # a versioned object (s3://…/dataset.parquet) and the image to a digest
      # (`@sha256:<digest>`).
      - name: dataset-uri
        value: "pvc://recommender-model/dataset/"
      - name: image-sha
        value: "bookstore/recommender-train:dev"
  # Pod-level settings for every workflow Pod. The wait sidecar's own settings
  # come from the chart's `executor` values.
  podSpecPatch: |
    securityContext:
      runAsNonRoot: true
      runAsUser: 65532
      runAsGroup: 65532
      fsGroup: 65532
      seccompProfile:
        type: RuntimeDefault
  volumes:
    - name: model
      persistentVolumeClaim:
        claimName: "{{workflow.parameters.model-pvc}}"
    - name: scratch
      emptyDir:
        sizeLimit: 64Mi
  templates:
    # ───────────────────────────────────────────────────────────────────────
    # main, the DAG: train -> eval -> register -> promote.
    # ───────────────────────────────────────────────────────────────────────
    - name: main
      dag:
        tasks:
          - name: train
            template: train-step
          - name: eval
            template: eval-step
            depends: "train.Succeeded"
            arguments:
              parameters:
                - { name: min-score, value: "{{workflow.parameters.min-score}}" }
          - name: register
            template: register-step
            depends: "eval.Succeeded"
            arguments:
              parameters:
                - { name: score, value: "{{tasks.eval.outputs.parameters.score}}" }
                - { name: model-sha256, value: "{{tasks.eval.outputs.parameters.model-sha256}}" }
          - name: promote
            template: promote-step
            depends: "register.Succeeded"
            # promote is not idempotent: `kubectl annotate` may commit before
            # `rollout restart` fails, leaving a half-promoted state. Opt out
            # of the spec-level retry for this task only.
            retryStrategy:
              limit: 0
    # ───────────────────────────────────────────────────────────────────────
    # train, the same image as ml/train/recommender-train-job.yaml. It writes
    # /workspace/model/model.joblib on the shared PVC. It holds no API token.
    # ───────────────────────────────────────────────────────────────────────
    - name: train-step
      container:
        image: "{{workflow.parameters.train-image}}"
        imagePullPolicy: IfNotPresent
        env:
          - name: MODEL_DIR
            value: /workspace/model
          - name: SEED
            value: "{{workflow.parameters.seed}}"
          - name: TOP_K
            value: "{{workflow.parameters.top-k}}"
          - name: N_BOOKS
            value: "200"
          - name: N_CUSTOMERS
            value: "800"
          - name: N_ORDERS
            value: "5000"
        resources:
          requests: { cpu: "250m", memory: "256Mi" }
          limits:   { cpu: "1",    memory: "512Mi" }
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities: { drop: ["ALL"] }
        volumeMounts:
          - { name: model,   mountPath: /workspace/model }
          - { name: scratch, mountPath: /tmp }
    # ───────────────────────────────────────────────────────────────────────
    # eval, reads model.joblib from the PVC read-only, computes the average
    # top-1 cosine similarity, and gates on min-score. Metrics go to /tmp
    # because the model directory is read-only here. The digest of the
    # evaluated bytes is emitted for the register step.
    # ───────────────────────────────────────────────────────────────────────
    - name: eval-step
      inputs:
        parameters:
          - name: min-score
      script:
        image: "{{workflow.parameters.train-image}}"
        imagePullPolicy: IfNotPresent
        command: ["python"]
        source: |
          import hashlib, io, json, os, statistics, sys
          import joblib

          model_dir = os.environ.get("MODEL_DIR", "/workspace/model")
          min_score = float(os.environ["MIN_SCORE"])
          model_path = os.path.join(model_dir, "model.joblib")
          # Read the bytes once, hash exactly those bytes, and load the same
          # bytes. Hashing a second read could describe a different file.
          with open(model_path, "rb") as f:
              data = f.read()
          digest = hashlib.sha256(data).hexdigest()
          # joblib is pickle: loading runs code. This load is safe only while
          # the file is written by this pipeline's own train step. Any other
          # writer to the PVC makes it unsafe. The serving predictor does not
          # check this digest yet; see Part 12 ch.06 for the gap.
          artifact = joblib.load(io.BytesIO(data))
          neigh = artifact["neighbours"]
          # Average top-1 cosine similarity across all books with at least
          # one neighbour. This proves the model learnt SOMETHING above
          # random for the planted-affinity synthetic dataset.
          top1 = [float(v[0][1]) for v in neigh.values() if v]
          score = statistics.fmean(top1) if top1 else 0.0
          metrics = {
              "kind": artifact["kind"],
              "n_books": artifact["n_books"],
              "n_customers": artifact["n_customers"],
              "n_orders": artifact["n_orders"],
              "top_k": artifact["top_k"],
              "avg_top1_cosine": round(score, 6),
              "min_score_gate": min_score,
              "passed": score >= min_score,
          }
          with open("/tmp/metrics.json", "w") as f:
              json.dump(metrics, f, indent=2)
          with open("/tmp/score", "w") as f:
              f.write(f"{score:.6f}")
          # Lineage: the digest of the exact bytes this run evaluated.
          with open("/tmp/model-sha256", "w") as f:
              f.write(digest)
          print(json.dumps(metrics, indent=2), flush=True)
          if not metrics["passed"]:
              print(f"[eval] FAIL: {score} < gate {min_score}", file=sys.stderr,
                    flush=True)
              sys.exit(2)
        env:
          - name: MODEL_DIR
            value: /workspace/model
          - name: MIN_SCORE
            value: "{{inputs.parameters.min-score}}"
        resources:
          requests: { cpu: "100m", memory: "256Mi" }
          limits:   { cpu: "500m", memory: "512Mi" }
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities: { drop: ["ALL"] }
        volumeMounts:
          - { name: model,   mountPath: /workspace/model, readOnly: true }
          - { name: scratch, mountPath: /tmp }
      outputs:
        parameters:
          - name: score
            valueFrom: { path: /tmp/score }
          - name: model-sha256
            valueFrom: { path: /tmp/model-sha256 }
    # ───────────────────────────────────────────────────────────────────────
    # register, KIND-RUNNABLE PROXY for a real model registry. Writes a
    # ConfigMap that stamps the model URI, score, model digest, timestamp,
    # workflow name and dataset lineage. Runs as recommender-register, the
    # only identity here that may write ConfigMaps.
    # Chainguard's kubectl image, pinned by index digest. The -dev variant has
    # the /bin/sh the script runs under. Its user is 65532.
    # ───────────────────────────────────────────────────────────────────────
    - name: register-step
      serviceAccountName: recommender-register
      automountServiceAccountToken: true
      inputs:
        parameters:
          - name: score
          - name: model-sha256
      script:
        image: cgr.dev/chainguard/kubectl:latest-dev@sha256:ee760c803cc3856d99f13dfd989bce461d2b324ae49e70b72c717f3bfaba9cbb
        imagePullPolicy: IfNotPresent
        command: ["/bin/sh"]
        source: |
          set -eu
          CM="recommender-model-registry-{{workflow.name}}"
          MODEL_URI="pvc://{{workflow.parameters.model-pvc}}/model.joblib"
          SCORE="{{inputs.parameters.score}}"
          SHA="{{inputs.parameters.model-sha256}}"
          NOW="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          kubectl -n bookstore-ml create configmap "$CM" \
            --from-literal=model_uri="$MODEL_URI" \
            --from-literal=model_sha256="$SHA" \
            --from-literal=score="$SCORE" \
            --from-literal=registered_at="$NOW" \
            --from-literal=workflow="{{workflow.name}}" \
            --from-literal=dataset_uri="{{workflow.parameters.dataset-uri}}" \
            --from-literal=image_sha="{{workflow.parameters.image-sha}}" \
            --dry-run=client -o yaml \
            | kubectl -n bookstore-ml apply -f -
          kubectl -n bookstore-ml label configmap "$CM" \
            app.kubernetes.io/part-of=bookstore-ml \
            app.kubernetes.io/component=recommender-model-registry \
            ml.bookstore/score="$SCORE" --overwrite
          echo "[register] stamped $CM uri=$MODEL_URI sha256=$SHA score=$SCORE at=$NOW"
        env:
          # kubectl writes its discovery cache under $HOME; the root
          # filesystem is read-only, so point HOME at the writable /tmp.
          - name: HOME
            value: /tmp
        resources:
          requests: { cpu: "50m",  memory: "64Mi" }
          limits:   { cpu: "200m", memory: "128Mi" }
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities: { drop: ["ALL"] }
        volumeMounts:
          - { name: scratch, mountPath: /tmp }
    # ───────────────────────────────────────────────────────────────────────
    # promote, KIND-RUNNABLE PROXY for the real promote step. Annotates the
    # recommender Deployment and restarts it, so the serving Pod re-reads
    # model.joblib from the PVC. Runs as recommender-promote. If the Deployment
    # is missing, the step FAILS: a promotion that did not happen must not
    # report success.
    # ───────────────────────────────────────────────────────────────────────
    - name: promote-step
      serviceAccountName: recommender-promote
      automountServiceAccountToken: true
      script:
        image: cgr.dev/chainguard/kubectl:latest-dev@sha256:ee760c803cc3856d99f13dfd989bce461d2b324ae49e70b72c717f3bfaba9cbb
        imagePullPolicy: IfNotPresent
        command: ["/bin/sh"]
        source: |
          set -eu
          DEPLOY="recommender"
          NOW="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          kubectl -n bookstore-ml get deploy "$DEPLOY" >/dev/null
          kubectl -n bookstore-ml annotate deploy "$DEPLOY" \
            ml.bookstore/promoted-from="{{workflow.name}}" \
            ml.bookstore/promoted-at="$NOW" --overwrite
          kubectl -n bookstore-ml rollout restart deploy "$DEPLOY"
          kubectl -n bookstore-ml rollout status deploy "$DEPLOY" --timeout=120s
          echo "[promote] $DEPLOY restarted with the new model (workflow {{workflow.name}})"
        env:
          - name: HOME
            value: /tmp
        resources:
          requests: { cpu: "50m",  memory: "64Mi" }
          limits:   { cpu: "200m", memory: "128Mi" }
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities: { drop: ["ALL"] }
        volumeMounts:
          - { name: scratch, mountPath: /tmp }
