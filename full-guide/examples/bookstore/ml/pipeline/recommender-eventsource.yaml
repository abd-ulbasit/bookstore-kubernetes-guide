# Bookstore, Part 12 ch.07 "ML pipelines and workflows": Argo Events
# `EventSource`. A webhook listener that turns "a new training dataset is
# available" (an HTTP POST from the dataset-publishing pipeline) into an
# event. recommender-sensor.yaml turns that event into a Workflow run.
#
# !!! CRD-INTRINSIC DRY-RUN (same precedent as recommender-workflow.yaml) !!!
#   `EventSource` is an Argo Events CRD (argoproj.io/v1alpha1). Without Argo
#   Events installed, a client dry-run prints:
#     no matches for kind "EventSource" in version "argoproj.io/v1alpha1"
#   That is expected. Install the chart first (argo-events-values.yaml).
#
# WHAT IT DOES
#   Listens on :12000 at /recommender-dataset-ready. A POST is accepted only
#   with `Authorization: Bearer <token>`, where the token is the value in the
#   Secret recommender-dataset-token (created by the chapter, never stored in
#   this file). The webhook's authSecret field is the upstream bearer-token
#   check (Argo Events v1.9.11 OpenAPI: WebhookEventSource.authSecret).
#
# WHAT IT DOES NOT DO
#   It does not encrypt traffic. Add serverCertSecret and serverKeySecret
#   (TLS, same upstream spec) or put it behind an Ingress with mTLS, as
#   Part 12 ch.07 "Production notes" explains. recommender-eventsource-allow.yaml
#   limits which pods may reach the port.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: recommender-eventsource
  namespace: argo-events
  labels:
    app.kubernetes.io/part-of: bookstore-ml
    app.kubernetes.io/component: ml-pipeline-events
# The EventSource pod never calls the Kubernetes API, so it gets no token.
# (The Argo Events Template has no automount field, so the ServiceAccount
# carries it.)
automountServiceAccountToken: false
---
apiVersion: argoproj.io/v1alpha1
kind: EventSource
metadata:
  name: recommender-dataset
  namespace: argo-events
  labels:
    app.kubernetes.io/part-of: bookstore-ml
    app.kubernetes.io/component: ml-pipeline-events
spec:
  eventBusName: default
  template:
    serviceAccountName: recommender-eventsource
    securityContext:
      runAsNonRoot: true
      runAsUser: 65532
      runAsGroup: 65532
      seccompProfile:
        type: RuntimeDefault
    container:
      securityContext:
        allowPrivilegeEscalation: false
        readOnlyRootFilesystem: true
        capabilities:
          drop: ["ALL"]
      resources:
        requests: { cpu: "50m",  memory: "64Mi" }
        limits:   { cpu: "200m", memory: "128Mi" }
      volumeMounts:
        - { name: tmp, mountPath: /tmp }
    volumes:
      - name: tmp
        emptyDir: {}
  service:
    ports:
      - port: 12000
        targetPort: 12000
  webhook:
    # The route name `dataset-ready` is the name the Sensor's dependency uses.
    dataset-ready:
      port: "12000"
      endpoint: /recommender-dataset-ready
      method: POST
      authSecret:
        name: recommender-dataset-token
        key: token
