# Bookstore, Part 12 chapter 02: the "scale training up onto a GPU" artifact
# for the recommendations model.
#
# !!! NEEDS A GPU NODE. THE CPU PATH IS CHAPTER 03 AND CHAPTER 04 !!!
#   The Bookstore recommendations model (item co-occurrence; see ../README.md
#   and ../dataset/README.md) is deliberately tiny and runs CPU-only. This file
#   is the GPU shape of the same Job. It requests nvidia.com/gpu: 1, so it
#   schedules only on a node that the GPU Operator has given a GPU. On a
#   cluster without one, kind for example, it stays Pending, and the scheduler
#   says why. Chapter 02 shows that message.
#
# Two documents: a ServiceAccount of its own, and the Job. The Job is a built-in
# batch/v1 kind with no CRD, so it dry-runs anywhere:
#   kubectl apply --dry-run=client -f examples/bookstore/ml/gpu/recommender-train-gpu.yaml
#   kubectl apply --dry-run=server -n bookstore-ml \
#     -f examples/bookstore/ml/gpu/recommender-train-gpu.yaml
# Validating needs no GPU. Scheduling does.
#
# PSA: the namespace is bookstore-ml from Part 12 chapter 01, at restricted.
# The base image declares no user, so it runs as root unless the Pod says
# otherwise. This spec names UID 65532, sets runAsNonRoot, drops every
# capability and keeps the root filesystem read-only, and it still asks for a
# GPU. GPU workload Pods are never exempt from restricted. The privileged
# parts of the GPU stack run in the gpu-operator namespace, not here.
#
# GPU NODE FENCE (Part 04 chapter 02): the toleration gets the Pod past the GPU
# pool's NoSchedule taint, and the required nodeAffinity keeps it on a GPU
# node. The nvidia.com/gpu.present label is set by the GPU Operator from the
# PCI labels that Node Feature Discovery writes, not by GPU Feature Discovery.
#
# The container command is a STUB. The real training image arrives with
# chapter 04. It echoes what it would do on a GPU, so this file shows the shape
# without inventing output.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: recommender-train-gpu
  namespace: bookstore-ml
  labels:
    app.kubernetes.io/part-of: bookstore-ml
    app.kubernetes.io/component: recommender-train
automountServiceAccountToken: false
---
apiVersion: batch/v1
kind: Job
metadata:
  name: recommender-train-gpu
  namespace: bookstore-ml
  labels:
    app.kubernetes.io/part-of: bookstore-ml
    app.kubernetes.io/component: recommender-train
    ml.bookstore/path: gpu-scale-up
spec:
  backoffLimit: 2                 # bounded retries (Part 01 ch.07)
  activeDeadlineSeconds: 1800     # hard wall-clock cap for a training Job
  ttlSecondsAfterFinished: 600    # GC the Job and its Pod after they finish
  template:
    metadata:
      labels:
        app.kubernetes.io/part-of: bookstore-ml
        app.kubernetes.io/component: recommender-train
    spec:
      restartPolicy: Never        # Job pods: Never | OnFailure (never Always)
      serviceAccountName: recommender-train-gpu
      automountServiceAccountToken: false
      tolerations:                # PERMISSION past the GPU pool taint
        - key: nvidia.com/gpu
          operator: Exists
          effect: NoSchedule
      affinity:
        nodeAffinity:             # REQUIRED: only GPU nodes (GPU Operator label)
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - key: nvidia.com/gpu.present
                    operator: In
                    values: ["true"]
      securityContext:            # pod-level, restricted-compliant
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: train
          # nvidia/cuda:12.4.1-base-ubuntu22.04, pinned by its index digest.
          # The image declares no user, so the UID above is ours to choose.
          # Replace the image with the recommender training image in chapter
          # 04. The GPU request and the restricted securityContext stay the same.
          image: nvidia/cuda@sha256:0f6bfcbf267e65123bcc2287e2153dedfc0f24772fb5ce84afe16ac4b2fada95
          command: ["/bin/sh", "-c"]
          args:
            - |
              set -e
              echo "[recommender-train-gpu] GPU scale-up path."
              echo "On a real GPU node this would:"
              echo "  1) load the (synthetic, seeded) Bookstore orders dataset"
              echo "  2) build the customer x book interaction matrix"
              echo "  3) compute book x book similarity ON THE GPU and keep top-K"
              echo "  4) write the model artifact (chapter 04 owns the real training)"
              echo "Detecting GPU (representative; real output is hardware-specific):"
              command -v nvidia-smi >/dev/null 2>&1 && nvidia-smi || \
                echo "  nvidia-smi not present in this base layer; the real"
              echo "  training image bundles the CUDA runtime and the recommender."
              echo "[recommender-train-gpu] stub complete (real code: chapter 04)."
          resources:
            requests:
              cpu: "500m"
              memory: 512Mi
              # No nvidia.com/gpu here: an extended resource's request is copied
              # from its limit, and the two must be equal (no overcommit, no
              # fractional GPU). See the chapter's "Why limits == requests".
            limits:
              cpu: "1"
              memory: 1Gi
              nvidia.com/gpu: "1"   # one whole GPU; mirrored to requests
          securityContext:          # container-level, restricted-compliant
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: scratch
              mountPath: /tmp
      volumes:
        - name: scratch             # restricted-allowed volume type
          emptyDir:
            sizeLimit: 256Mi
