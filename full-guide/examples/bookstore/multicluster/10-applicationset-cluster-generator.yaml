# Bookstore — Part 11 ch.06 "Multi-cluster & fleet": an Argo CD ApplicationSet
# with a CLUSTER GENERATOR that delivers the Bookstore to EVERY registered
# fleet member from ONE object. This is the fleet-scale version of the Part 07
# ch.04 App-of-Apps (one root → N hand-written Applications): here ONE
# ApplicationSet + one template → N AUTO-GENERATED Applications, one per
# cluster Secret that carries the fleet label.
#
# BUILDS ON Part 07 ch.04 (does NOT re-teach Argo CD basics)
#   The NEW idea is the *generator*: a controller that templates Applications
#   from a data source. The `clusters` generator's data source is the set of
#   cluster Secrets Argo CD stores (label argocd.argoproj.io/secret-type=cluster).
#   This chapter writes those Secrets by hand, with a short-lived token scoped
#   to one namespace on each member. Do NOT use `argocd cluster add` for them:
#   it binds a cluster-admin-equivalent ClusterRole and stores a token that
#   never expires (see the chapter, "Fleet credentials").
#
# !!! CRD-INTRINSIC DRY-RUN (identical precedent to argocd/ + 18-/51-/70-/83-)
#   `ApplicationSet` is `argoproj.io/v1alpha1` (the Argo CD ApplicationSet
#   controller CRD). WITHOUT Argo CD (+ the ApplicationSet controller, bundled
#   with the argo-cd Helm chart) installed, a client dry-run prints:
#     no matches for kind "ApplicationSet" in version "argoproj.io/v1alpha1"
#   EXPECTED, schema-correct — same precedent as examples/bookstore/argocd/
#   *.yaml (Part 07 ch.04). Whole-dir dry-run prints this for CRD-backed files
#   only and continues. The field names were checked against the applicationsets
#   CRD that argo-cd chart 10.11.6 renders (spec.syncPolicy.preserveResourcesOnDeletion,
#   status.resources).
#
# PLACEHOLDER: `repoURL` is the generic placeholder
# https://github.com/your-org/bookstore — replace `your-org` with your fork
# (same convention as examples/bookstore/argocd/apps/*.yaml). The PATH points
# at the fleet overlays in ../fleet-overlays/, which drop the cluster-scoped
# objects (see ../fleet-components/).
#
# PER-CLUSTER VALUE: the generator exposes per-cluster fields ({{.name}},
# {{.server}}, and any labels you set on the cluster Secret, e.g.
# {{.metadata.labels.env}}). Below, the cluster's `env` label selects which
# fleet overlay it gets — demonstrating a per-cluster overlay value WITHOUT
# hand-writing an Application per cluster.
#
# Requires: Argo CD installed (the chapter's hub step); one cluster Secret per
#   member, labelled `bookstore.example.com/fleet=true` and `env=<overlay>`;
#   the `bookstore-fleet` AppProject (05-appproject-fleet.yaml).
# Apply:
#   kubectl apply -n argocd -f examples/bookstore/multicluster/10-applicationset-cluster-generator.yaml
#   kubectl get applicationset,applications -n argocd
apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: bookstore-fleet
  namespace: argocd
  labels:
    app.kubernetes.io/part-of: bookstore
spec:
  goTemplate: true
  goTemplateOptions: ["missingkey=error"]
  generators:
    # CLUSTER generator: one set of params per cluster Secret Argo CD holds.
    # `selector` narrows to members carrying the fleet label, so a cluster
    # Secret that is not labelled is never templated.
    - clusters:
        selector:
          matchLabels:
            bookstore.example.com/fleet: "true"
  template:
    metadata:
      # One Application per cluster: bookstore-<clustername>.
      name: 'bookstore-{{.name}}'
      labels:
        app.kubernetes.io/part-of: bookstore
    spec:
      project: bookstore-fleet           # the fleet AppProject: the guardrail
      source:
        repoURL: https://github.com/your-org/bookstore.git   # PLACEHOLDER — replace your-org
        targetRevision: main
        # PER-CLUSTER OVERLAY: the cluster Secret's `env` label (dev|staging)
        # picks the fleet overlay. The overlays reuse the Part 07 overlays and
        # drop the cluster-scoped objects; no hand-written Application per cluster.
        path: 'examples/bookstore/multicluster/fleet-overlays/{{.metadata.labels.env}}'
      destination:
        name: '{{.name}}'                # the Argo CD cluster name, allowed by the project
        namespace: bookstore
      syncPolicy:
        automated:
          prune: true
          selfHeal: true
        syncOptions:
          - CreateNamespace=false        # the platform team owns the PSA-labelled namespace
        retry:
          limit: 5
          backoff: { duration: 5s, factor: 2, maxDuration: 3m }
