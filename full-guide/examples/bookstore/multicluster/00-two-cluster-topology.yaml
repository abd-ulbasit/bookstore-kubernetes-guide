# Bookstore — Part 11 ch.06 "Multi-cluster & fleet": the TWO-CLUSTER lab
# topology. Multi-cluster GENUINELY needs more than one cluster — there is no
# single-cluster shortcut for "deliver to a fleet". This file is the honest,
# reproducible 2-kind-cluster setup the chapter Hands-on uses, plus the kind
# configs, as a NOT-APPLIED doc carrier. The header lists the chapter's steps
# in the chapter's order. The real artifacts are the `kind` commands, the Helm
# install and the `register_member` function in chapter section 3. Same
# honesty pattern as the guide's apiserver-level cluster/ files.
#
# WHY TWO CLUSTERS (the chapter's "when/why multi-cluster")
#   blast radius (a cluster-wide failure / bad upgrade is contained to one),
#   region/latency (run close to users), hard tenancy/regulatory isolation,
#   and per-environment separation. The cost: cross-cluster service discovery,
#   data gravity (stateful systems can't trivially span clusters — Postgres),
#   fleet observability/policy, and operational multiplication. One BIG
#   cluster (namespaces + RBAC + quotas, Part 08 ch.04) is simpler and right
#   until one of those forcing functions applies — the chapter argues this.
#
# ── THE TWO-CLUSTER LAB (the chapter's order; this file is never applied) ──
#   # 0. Two kind clusters (the kind configs are below):
#   kind create cluster --name bookstore-hub --config /tmp/kind-hub.yaml
#   kind create cluster --name bookstore-east --config /tmp/kind-east.yaml
#
#   # 1. Argo CD on the HUB: chart 10.11.6 (renders Argo CD v3.5.6) in a
#   #    namespace labelled restricted first, with the three images pinned by
#   #    digest. The full command is in the chapter, section 1.
#   kubectl config use-context kind-bookstore-hub
#   helm install argocd argo/argo-cd -n argocd --version 10.11.6 --wait \
#     --set global.image.tag=... --set dex.image.tag=... --set redis.image.tag=...
#
#   # 2. Scope each member's identity before the hub holds a credential for it:
#   #    a namespace, a ServiceAccount that does not mount its token, and a Role
#   #    in bookstore only. The manifest is in the chapter, section 2.
#
#   # 3. Register the members with register_member (chapter section 3). It
#   #    writes each cluster Secret from the INTERNAL kind address, which the
#   #    Argo CD pods can reach. Do NOT run `argocd cluster add`: it installs a
#   #    ClusterRole with * on everything and stores a token that never expires.
#   register_member member-secret-east.yaml kind-bookstore-east bookstore-east
#   register_member member-secret-hub.yaml kind-bookstore-hub bookstore-hub
#   #    Each Secret carries bookstore.example.com/fleet=true and an env label:
#   #    env=staging for east and env=dev for the hub. The ApplicationSet reads
#   #    env to pick the overlay: overlays/staging and overlays/dev.
#
#   # 4. The fleet AppProject and the ApplicationSet (one object -> a fleet):
#   kubectl apply -n argocd -f examples/bookstore/multicluster/05-appproject-fleet.yaml
#   kubectl apply -n argocd -f examples/bookstore/multicluster/10-applicationset-cluster-generator.yaml
#   kubectl get applications -n argocd          # bookstore-hub + bookstore-east
#
#   NON-LOCALLY-TRIVIAL BIT (called out, not faked): cross-cluster SERVICE
#   discovery/networking (a Service in cluster A reachable from B) needs a
#   multi-cluster mesh / Submariner / the MCS API — NOT shown end-to-end on
#   kind here (it needs non-overlapping pod CIDRs + a tunnel). The chapter
#   explains it conceptually; the runnable lab is fleet DELIVERY (above),
#   which is fully reproducible with two kind clusters.
#
# ── kind configs the commands reference ────────────────────────────────────
#   # /tmp/kind-hub.yaml
#   kind: Cluster
#   apiVersion: kind.x-k8s.io/v1alpha4
#   name: bookstore-hub
#   # /tmp/kind-east.yaml  (distinct podSubnet — required if you LATER add
#   # cross-cluster networking; harmless otherwise)
#   kind: Cluster
#   apiVersion: kind.x-k8s.io/v1alpha4
#   name: bookstore-east
#   networking:
#     podSubnet: "10.245.0.0/16"
#     serviceSubnet: "10.97.0.0/16"
apiVersion: v1
kind: ConfigMap
metadata:
  name: bookstore-multicluster-topology-NOT-APPLIED
  namespace: bookstore
  labels:
    app.kubernetes.io/part-of: bookstore
  annotations:
    note: >-
      DOC CARRIER ONLY — deliberately NOT part of any apply flow. The real
      artifacts are the `kind create cluster` and Helm commands in the header,
      and the register_member function in the chapter (a reproducible
      two-kind-cluster fleet). Wrapped in a never-applied ConfigMap so the file
      is YAML-valid for the repo's dry-run sweep without implying it is a
      resource to create.
data:
  README: "See the header. The 2-cluster lab is kind and helm commands, not kubectl apply of this file."
