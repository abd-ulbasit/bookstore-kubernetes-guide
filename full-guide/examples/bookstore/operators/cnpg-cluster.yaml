# Bookstore: Part 08 ch.05 "Operators and CRDs". The Postgres data tier on the
# CloudNativePG operator (chart cnpg/cloudnative-pg 0.29.1, operator 1.30.1).
#
# This is an ALTERNATIVE to raw-manifests/20-postgres-statefulset.yaml, not a
# deletion of it. Run one of the two as the Bookstore database, never both.
# The canonical StatefulSet stays unchanged on disk.
#
# Cluster is a CRD (postgresql.cnpg.io/v1). Before the operator is installed,
# a client dry-run fails with `no matches for kind "Cluster"`. That is the
# expected result: the type does not exist yet. Chapter 05 installs the
# operator first.
#
# The operator reads its database password from a basic-auth Secret named
# cnpg-app-credentials. This file carries no password. Chapter 05 creates the
# Secret at run time, with a generated password, before this file is applied.
#
# No backup stanza here. Continuous WAL archiving needs a real bucket and its
# credentials. An archive that cannot write holds WAL on the data volume until
# it fills. This chapter does not teach WAL archiving or PITR. The CloudNativePG
# backup documentation covers both.
apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: bookstore-db                # Services: bookstore-db-rw, -ro and -r
  namespace: bookstore
  labels:
    app: postgres
    app.kubernetes.io/part-of: bookstore
spec:
  # Three instances: one primary and two streaming replicas, with automated
  # failover. The single-replica StatefulSet in 20- cannot fail over.
  instances: 3

  # PostgreSQL 16, the major the canonical StatefulSet runs. Pinned by digest.
  # The operator applies minor upgrades through its own rollout.
  imageName: ghcr.io/cloudnative-pg/postgresql:16.10-minimal-trixie@sha256:294fd7631f8d66fa54bf6ffa2948af685a20fb695fe748a6bafa71c42f1233b7

  # Upgrade the primary last, after the replicas. The operator switches the
  # primary on its own. Use "supervised" to make that switch a manual step.
  primaryUpdateStrategy: unsupervised

  # Off. When on, the operator manages a superuser password Secret. The app
  # needs only the owner role below.
  enableSuperuserAccess: false

  # Bootstrap: create database `bookstore` owned by role `bookstore`, with the
  # password from the basic-auth Secret that chapter 05 creates.
  bootstrap:
    initdb:
      database: bookstore
      owner: bookstore
      secret:
        name: cnpg-app-credentials

  # One PVC per instance, created and resized by the operator.
  storage:
    size: 1Gi

  # Pods the operator creates are bounded like any workload: requests and a
  # memory limit (baseline, 01.03).
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      memory: 512Mi

  # Deprecated upstream, and due for removal. Off here: write a PodMonitor by
  # hand to scrape the instances (Part 06).
  monitoring:
    enablePodMonitor: false

  # Labels every object the operator generates inherits, including the
  # instance Pods. cnpg-networkpolicy.yaml selects instances by app: postgres,
  # which the Cluster's own labels do not reach.
  inheritedMetadata:
    labels:
      app: postgres
