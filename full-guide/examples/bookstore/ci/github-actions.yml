# Bookstore, Part 07 ch.03 "CI/CD pipeline".
#
# A thin caller. The pipeline itself is the reusable workflow
# .github/workflows/bookstore-pipeline.yml, which runs every stage for ONE
# service: secrets, SAST, dependency scan, image lint, image scan, SBOM,
# signing, manifest scan, workflow hardening and a ZAP baseline. This file
# fans it out over the four services and adds the one job that is not a
# check: bump-manifests, which proposes the new digests in a pull request.
# "CI builds, CD deploys, Git is the trigger", and for prod the trigger is a
# reviewed merge.
#
# WHERE THIS FILE LIVES vs WHERE IT RUNS. GitHub only runs workflows from
# .github/workflows/ at the repository root. The guide keeps every Bookstore
# artifact under examples/bookstore/, so this is the readable source of truth.
# In a Bookstore repo, copy this file AND bookstore-pipeline.yml into
# .github/workflows/, and copy ci/ to the repo root next to app/ and
# kustomize/. Nothing here names an organization: the registry path comes
# from the repository owner.
#
# SUPPLY-CHAIN TIE-IN (Part 05 ch.03). The Kyverno digest and verifyImages
# policies ship in Audit because the guide's own bookstore/<svc>:dev Pods are
# tag-based and unsigned. This pipeline is how you earn Enforce: it pushes
# by digest and signs keyless, so a cluster can require a digest and verify
# the signature against this workflow's identity.

name: bookstore-ci

# Pull requests run every check and publish nothing. Only a push to main
# (a merged PR) signs, pushes and proposes the promotion. A fork PR gets no
# OIDC token and no write token, so it can never reach the publish path.
on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

permissions: {}

# One in-flight run per branch; a newer push cancels the older one.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pipeline:
    name: pipeline (${{ matrix.service }})
    strategy:
      fail-fast: false
      matrix:
        service: [catalog, orders, payments-worker, storefront]
    # The most this call may use. The reusable workflow narrows it per job.
    permissions:
      contents: read
      actions: read
      packages: write
      id-token: write
      attestations: write
    # GitHub also accepts `uses: $/.github/...` for a file in this repository, and
    # zizmor prefers it; actionlint 1.7.12 does not parse it yet.
    uses: ./.github/workflows/bookstore-pipeline.yml # zizmor: ignore[self-repository]
    with:
      service: ${{ matrix.service }}
      publish: ${{ github.event_name == 'push' }}
      dast: ${{ matrix.service != 'payments-worker' }}
      # The whole-repository stages (secrets, manifests, workflow-hardening)
      # run on one leg. The other legs' sign jobs do not wait for them, but
      # bump-manifests needs every leg, so a red repository-wide job still
      # stops the promotion PR.
      repo-wide: ${{ matrix.service == 'catalog' }}

  # ---------------------------------------------------------------------------
  # bump-manifests: the CI -> GitOps seam. CI does not `kubectl apply`. It
  # writes the signed digests into the prod overlay's images/ Component and
  # opens a pull request. Merging the PR is the deploy: Argo CD (ch.04) sees
  # the merge commit and reconciles.
  #
  # The edit targets overlays/prod/images/, a file that holds only the image
  # pins. `kustomize edit` rewrites the whole file it touches, so pointed at
  # the full overlay it turned a one-line pin into 288 changed lines that a
  # reviewer could not read.
  #
  # Why a PR and not `git push origin HEAD:main`: a direct push sent every
  # merge to prod with no reviewer and no staging step. Set up in YOUR repo:
  #   - a ruleset on main that requires an approving review, so the bot
  #     cannot merge its own PR;
  #   - "Allow GitHub Actions to create and approve pull requests"
  #     (Settings -> Actions -> General);
  #   - a GitHub App token for the PR if its checks must run: the
  #     pull_request runs GitHub creates for a PR opened with GITHUB_TOKEN
  #     never start a job. (The guide's own release workflow dispatches the
  #     checks on the PR's branch instead; see bookstore-release.yml.)
  # ---------------------------------------------------------------------------
  bump-manifests:
    name: bump-manifests (GitOps source -> Argo syncs)
    needs: pipeline
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: step-security/harden-runner@dc2769abcc0fcfbadfc1df54081c1608579ef6b2 # v2.22.2
        with:
          egress-policy: audit

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Download the per-service digests
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: digest-*
          merge-multiple: true
          path: digests

      - name: Install kustomize (pinned release, checksum-verified)
        env:
          KUSTOMIZE_VERSION: "5.8.3"
          # sha256 of kustomize_v5.8.3_linux_amd64.tar.gz, from the release's
          # checksums.txt and GitHub's own asset digest (they agree).
          KUSTOMIZE_SHA256: cb9e31198d3f63b44848bd0afc4c8efc56e6cfef9c93a4a39a211940e6decd61
        run: |
          set -euo pipefail
          curl -fsSL -o kustomize.tar.gz \
            "https://github.com/kubernetes-sigs/kustomize/releases/download/kustomize%2Fv${KUSTOMIZE_VERSION}/kustomize_v${KUSTOMIZE_VERSION}_linux_amd64.tar.gz"
          echo "${KUSTOMIZE_SHA256}  kustomize.tar.gz" | sha256sum -c -
          tar -xzf kustomize.tar.gz kustomize
          sudo install -m 0755 kustomize /usr/local/bin/kustomize
          rm -f kustomize kustomize.tar.gz

      - name: Pin the built digests into the prod overlay
        env:
          OWNER: ${{ github.repository_owner }}
        run: |
          set -euo pipefail
          cd kustomize/overlays/prod/images
          for svc in catalog orders payments-worker storefront; do
            f="${GITHUB_WORKSPACE}/digests/${svc}.digest"
            [ -s "$f" ] || { echo "::error::missing digest for ${svc}"; exit 1; }
            digest="$(cat "$f")"
            case "$digest" in sha256:*) ;; *) echo "::error::bad digest for ${svc}: ${digest}"; exit 1 ;; esac
            kustomize edit set image \
              "bookstore/${svc}=ghcr.io/${OWNER,,}/bookstore-${svc}@${digest}"
          done

      - name: Open the promotion PR (merging it is the deploy trigger)
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8.1.1
        with:
          branch: ci/bump-prod-images
          delete-branch: true
          add-paths: kustomize/overlays/prod/images/kustomization.yaml
          commit-message: "ci: bump prod images to ${{ github.sha }} (signed digests)"
          committer: "bookstore-ci[bot] <bookstore-ci[bot]@users.noreply.github.com>"
          author: "bookstore-ci[bot] <bookstore-ci[bot]@users.noreply.github.com>"
          title: "Promote ${{ github.sha }} to prod (signed digests)"
          body: |
            Pins every Bookstore image in `overlays/prod/images` to the digest CI just
            built, scanned, signed and attested.

            Merging this PR is the production deploy: Argo CD syncs the merge
            commit. Review the digests, check staging, then merge. To roll
            back, revert the merge commit.
          labels: promotion
