# ZAP baseline rule settings for the Bookstore pipeline (Part 07 ch.03).
#
# Format, tab separated: <rule id> <IGNORE|INFO|WARN|FAIL> <note>
# The pipeline fails on any WARN or FAIL. INFO keeps a finding in the report
# but stops it failing the build, so each INFO line below is a decision: it
# names the rule, who it applies to, why it is accepted, and the date it
# must be revisited (never more than 12 months out). The first baseline run
# on 2026-10-30 raised exactly these nine rules across catalog, orders and
# storefront; every rule not listed here still fails the build.
10020	INFO	storefront: no X-Frame-Options or frame-ancestors yet. Fix is a headers block in the storefront nginx.conf. Revisit by 2027-04-30.
10021	INFO	catalog, orders, storefront: no X-Content-Type-Options: nosniff. The JSON APIs send an explicit Content-Type. Revisit by 2027-04-30.
10027	INFO	storefront: ZAP's suspicious-comments rule matches text in index.html. Informational. Revisit by 2027-04-30.
10036	INFO	storefront: the nginx Server header shows a version. Fix is server_tokens off. Revisit by 2027-04-30.
10038	INFO	storefront: no Content-Security-Policy. Needs a policy checked against the inline script in index.html. Revisit by 2027-04-30.
10049	INFO	catalog, orders, storefront: responses carry no Cache-Control. The book list is public data. Revisit by 2027-04-30.
10063	INFO	storefront: no Permissions-Policy. Fix is a headers block in the storefront nginx.conf. Revisit by 2027-04-30.
10109	INFO	storefront: ZAP notes it is a modern web application. Informational by nature. Revisit by 2027-04-30.
90004	INFO	catalog, orders, storefront: no cross-origin isolation headers (COEP, COOP, CORP). Revisit by 2027-04-30.
