{{/*
  All 10 NetworkPolicies (raw-manifests 60-networkpolicy.yaml): flip the ns to
  default-DENY then ALLOW only the edges the app needs. NetworkPolicy is a
  built-in kind so this defaults ON (networkPolicy.enabled). ENFORCEMENT needs
  a CNI that implements it: kind's default CNI, kindnet, does since kind
  v0.24.0 (no Calico needed), and the runtime gate relies on that. A denied
  request proves enforcement (ch.06 step 0). Namespace names (kube-system /
  traefik / monitoring) are parameterized for portability.
*/}}
{{- if .Values.networkPolicy.enabled }}
{{- $np := .Values.networkPolicy }}
{{- $ns := include "bookstore.namespace" . }}
# 1) Baseline default-deny: select ALL Pods, allow NOTHING either direction.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny-all
  namespace: {{ $ns }}
  labels:
    {{- include "bookstore.commonLabels" . | nindent 4 }}
spec:
  podSelector: {}
  policyTypes: ["Ingress", "Egress"]
---
# 2) MANDATORY: allow every Pod egress to cluster DNS (CoreDNS). Without this,
#    default-deny egress breaks ALL name resolution.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-dns-egress
  namespace: {{ $ns }}
  labels:
    {{- include "bookstore.commonLabels" . | nindent 4 }}
spec:
  podSelector: {}
  policyTypes: ["Egress"]
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ $np.dnsNamespace }}
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - { protocol: UDP, port: 53 }
        - { protocol: TCP, port: 53 }
---
# 3) Traefik -> storefront/catalog/orders.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-ingress-to-http-tiers
  namespace: {{ $ns }}
  labels:
    {{- include "bookstore.commonLabels" . | nindent 4 }}
spec:
  podSelector:
    matchExpressions:
      - key: app
        operator: In
        values: ["storefront", "catalog", "orders"]
  policyTypes: ["Ingress"]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ $np.ingressControllerNamespace }}
      ports:
        - { protocol: TCP, port: 8080 }
---
# 4) storefront -> catalog and storefront -> orders. These two edges carry
#    traffic only if you enable the server-side proxy block in
#    app/storefront/nginx.conf, which ships commented out. The browser reaches
#    the APIs through the edge, which rule 3 covers. The guide keeps these
#    edges because chapter 02.06 uses them to show that a connection needs both
#    ends. In a real cluster you delete an allow nothing uses.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-storefront-to-apis
  namespace: {{ $ns }}
  labels:
    {{- include "bookstore.commonLabels" . | nindent 4 }}
spec:
  podSelector:
    matchExpressions:
      - key: app
        operator: In
        values: ["catalog", "orders"]
  policyTypes: ["Ingress"]
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app: storefront
      ports:
        - { protocol: TCP, port: 8080 }
---
# 5) The data tier: who may open a connection to postgres (:5432) and to
#    redis (:6379). One policy selects both pods and each rule names its own
#    port, so a rule reaches the one pod that listens on it. Clients: catalog,
#    orders, db-migrate and cleanup for postgres; catalog for redis.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-data-tier-ingress
  namespace: {{ $ns }}
  labels:
    {{- include "bookstore.commonLabels" . | nindent 4 }}
spec:
  podSelector:
    matchExpressions:
      - key: app
        operator: In
        values: ["postgres", "redis"]
  policyTypes: ["Ingress"]
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app: catalog
        - podSelector:
            matchLabels:
              app: orders
        - podSelector:
            matchLabels:
              app: db-migrate
        - podSelector:
            matchLabels:
              app: cleanup
      ports:
        - { protocol: TCP, port: 5432 }
    - from:
        - podSelector:
            matchLabels:
              app: catalog
      ports:
        - { protocol: TCP, port: 6379 }
---
# 6) orders -> rabbitmq (publishes) AND payments-worker -> rabbitmq (consumes).
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-orders-to-rabbitmq
  namespace: {{ $ns }}
  labels:
    {{- include "bookstore.commonLabels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      app: rabbitmq
  policyTypes: ["Ingress"]
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app: orders
        - podSelector:
            matchLabels:
              app: payments-worker
      ports:
        - { protocol: TCP, port: 5672 }
---
# 7) Egress side of the backend edges: catalog, orders and the db-migrate and
#    cleanup batch Pods open connections to postgres, redis and rabbitmq.
#    Each destination still decides who it admits (rules 5 and 6).
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-backend-egress
  namespace: {{ $ns }}
  labels:
    {{- include "bookstore.commonLabels" . | nindent 4 }}
spec:
  podSelector:
    matchExpressions:
      - key: app
        operator: In
        values: ["catalog", "orders", "db-migrate", "cleanup"]
  policyTypes: ["Egress"]
  egress:
    - to:
        - podSelector:
            matchLabels:
              app: postgres
      ports:
        - { protocol: TCP, port: 5432 }
    - to:
        - podSelector:
            matchLabels:
              app: redis
      ports:
        - { protocol: TCP, port: 6379 }
    - to:
        - podSelector:
            matchLabels:
              app: rabbitmq
      ports:
        - { protocol: TCP, port: 5672 }
---
# 8) Egress side of storefront -> catalog/orders. These carry traffic only if
#    you enable the server-side proxy block in app/storefront/nginx.conf, which
#    ships commented out. The guide keeps this rule because chapter 02.06 uses
#    the edge to show that a connection needs both ends. In a real cluster you
#    delete an allow nothing uses.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-storefront-egress
  namespace: {{ $ns }}
  labels:
    {{- include "bookstore.commonLabels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      app: storefront
  policyTypes: ["Egress"]
  egress:
    - to:
        - podSelector:
            matchLabels:
              app: catalog
      ports:
        - { protocol: TCP, port: 8080 }
    - to:
        - podSelector:
            matchLabels:
              app: orders
      ports:
        - { protocol: TCP, port: 8080 }
---
# 9) Egress side of payments-worker -> rabbitmq.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-payments-worker-egress
  namespace: {{ $ns }}
  labels:
    {{- include "bookstore.commonLabels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      app: payments-worker
  policyTypes: ["Egress"]
  egress:
    - to:
        - podSelector:
            matchLabels:
              app: rabbitmq
      ports:
        - { protocol: TCP, port: 5672 }
---
# 10) allow the monitoring namespace to SCRAPE /metrics on the 3 metrics tiers.
#     INTENTIONALLY ONE-SIDED: the source (Prometheus) is cross-namespace and
#     not policy-restricted, so only this destination Ingress half exists.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-monitoring-scrape
  namespace: {{ $ns }}
  labels:
    {{- include "bookstore.commonLabels" . | nindent 4 }}
spec:
  podSelector:
    matchExpressions:
      - key: app
        operator: In
        values: ["catalog", "orders", "payments-worker"]
  policyTypes: ["Ingress"]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ $np.monitoringNamespace }}
      ports:
        - { protocol: TCP, port: 8080 }
{{- end }}
