# Bookstore — Part 11 ch.03 "API Priority & Fairness": give the BookstoreTenant
# operator's apiserver traffic its OWN PriorityLevel and FlowSchema, so a buggy
# reconcile (a hot-loop LIST/WATCH/UPDATE storm) drains only its own queue and
# cannot starve the control plane for everyone else.
#
# FlowSchema and PriorityLevelConfiguration are built-in objects
# (flowcontrol.apiserver.k8s.io/v1, GA in Kubernetes v1.29). Unlike the CRD and
# webhook files in this directory, this file needs no operator, CRD or
# controller installed before the server accepts it:
#   kubectl apply --dry-run=server -f config/apf/bookstore-operator-apf.yaml
#
# Model: the apiserver tries FlowSchemas in matchingPrecedence order (lowest
# number first) and uses the first one whose subjects and rules match the
# request. That FlowSchema names a PriorityLevelConfiguration, which gives the
# request a share of concurrency and a fair queue. A flood that matches this
# FlowSchema fills only this level's queues.
apiVersion: flowcontrol.apiserver.k8s.io/v1
kind: PriorityLevelConfiguration
metadata:
  name: bookstore-operator
spec:
  type: Limited # bounded (NOT Exempt — Exempt is unthrottled, for system traffic only)
  limited:
    # Share of the apiserver's total concurrency this level may use. Low on
    # purpose: a teaching operator should never be able to crowd out workload
    # controllers. Concurrency is shared proportionally to all levels' shares.
    nominalConcurrencyShares: 10
    # May lend up to half its unused concurrency to other levels when idle...
    lendablePercent: 50
    # ...and borrow up to 20% on top of its nominal share when others are idle.
    borrowingLimitPercent: 20
    limitResponse:
      type: Queue # queue excess requests rather than 429 immediately
      queuing:
        queues: 16
        handSize: 4 # shuffle-sharding: isolates a bad flow from good ones
        queueLengthLimit: 25 # beyond this, requests get 429 (Too Many Requests)
---
apiVersion: flowcontrol.apiserver.k8s.io/v1
kind: FlowSchema
metadata:
  name: bookstore-operator
spec:
  # Lower number = higher precedence. system-nodes is 500, service-accounts is
  # 9000 and global-default is 9900 (see the built-in list in the chapter). 600
  # matches the operator's traffic before the service-accounts flow, so it
  # lands in its bounded level instead of the shared workload-low bucket. The
  # value is not 500 because two FlowSchemas at the same precedence tie.
  matchingPrecedence: 600
  priorityLevelConfiguration:
    name: bookstore-operator
  distinguisherMethod:
    # Fan out fairness per-namespace so one tenant namespace's churn does not
    # starve another within the operator's own level.
    type: ByNamespace
  rules:
    - subjects:
        - kind: ServiceAccount
          serviceAccount:
            name: bookstore-operator-controller-manager
            namespace: bookstore-operator-system
      resourceRules:
        - verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
          apiGroups: ["bookstore.example.com", "", "apps"]
          resources: ["bookstoretenants", "bookstoretenants/status", "namespaces", "configmaps", "services", "deployments"]
          namespaces: ["*"]
