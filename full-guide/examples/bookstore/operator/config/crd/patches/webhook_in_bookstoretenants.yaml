# Turns on the conversion webhook for BookstoreTenant. controller-gen writes
# the CRD schema but not the conversion stanza, so kustomize adds it here. The
# apiserver calls /convert on the operator's Service for every read or write
# of a version other than the storage version (v1beta1). See the chapter.
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: bookstoretenants.bookstore.example.com
spec:
  conversion:
    strategy: Webhook
    webhook:
      conversionReviewVersions: ["v1"]
      clientConfig:
        service:
          name: bookstore-operator-webhook-service
          namespace: bookstore-operator-system
          path: /convert
