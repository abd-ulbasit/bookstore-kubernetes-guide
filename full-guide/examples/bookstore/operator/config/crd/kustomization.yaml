# config/crd: the BookstoreTenant CRD. `make install` does:
#   kustomize build config/crd | kubectl apply -f -
# The generated schema is patched with the conversion webhook and the
# cert-manager CA injection, so `make manifests` can regenerate the schema
# without losing either setting.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - bookstore.example.com_bookstoretenants.yaml
patches:
  - path: patches/webhook_in_bookstoretenants.yaml
  - path: patches/cainjection_in_bookstoretenants.yaml
