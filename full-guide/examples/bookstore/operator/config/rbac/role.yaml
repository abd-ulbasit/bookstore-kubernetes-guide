---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: bookstore-operator-manager-role
rules:
- apiGroups:
  - ""
  resources:
  - configmaps
  - namespaces
  - services
  verbs:
  - create
  - get
  - list
  - update
  - watch
- apiGroups:
  - apps
  resources:
  - deployments
  verbs:
  - create
  - get
  - list
  - update
  - watch
- apiGroups:
  - bookstore.example.com
  resources:
  - bookstoretenants
  verbs:
  - get
  - list
  - update
  - watch
- apiGroups:
  - bookstore.example.com
  resources:
  - bookstoretenants/finalizers
  - bookstoretenants/status
  verbs:
  - update
- apiGroups:
  - events.k8s.io
  resources:
  - events
  verbs:
  - create
  - patch
