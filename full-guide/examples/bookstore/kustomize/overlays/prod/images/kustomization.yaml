# Bookstore PRODUCTION image pins.
#
# This file holds the `images:` list and nothing else, on purpose. The release
# workflow (.github/workflows/bookstore-release.yml) promotes a signed image by
# running `kustomize edit set image` in THIS directory, and `kustomize edit`
# rewrites the whole file it touches: it re-indents lists, sorts keys and moves
# comments. Run on the full prod overlay, it turned a one-line pin into 143
# added and 145 removed lines that nobody could review, and merging that PR is
# the production deploy. Kept in a file of its own, the edit can touch only this
# small file.
#
# A pin is either name + newName + newTag (an immutable tag) or name + newName
# + digest (what promotion writes: the digest the registry computed, which the
# release workflow signed). `images:` rewrites both the name and the tag, so no
# Deployment YAML is hand-edited. The placeholder registry below is replaced
# one service at a time as each service is promoted.
#
# Keep the file in the shape `kustomize edit` writes: lists not indented, keys
# in alphabetical order, entries sorted by name. Comments belong above
# `apiVersion`; the tool hoists a comment inside the list above the list.
#
# The prod overlay includes this directory with `components:`.
apiVersion: kustomize.config.k8s.io/v1alpha1
kind: Component
images:
- digest: sha256:eaa26ada0a2e1575026a5e71e74572ed0bfdde80f50012e91a7be28f0de16ced
  name: bookstore/catalog
  newName: ghcr.io/abd-ulbasit/bookstore-catalog
- digest: sha256:78ad1a65b9647607b5903035685a864882f8f38f85a45c21d86089f4f7371caf
  name: bookstore/orders
  newName: ghcr.io/abd-ulbasit/bookstore-orders
- name: bookstore/payments-worker
  newName: registry.example.com/bookstore/payments-worker
  newTag: 1.0.0
- name: bookstore/storefront
  newName: registry.example.com/bookstore/storefront
  newTag: 1.0.0
