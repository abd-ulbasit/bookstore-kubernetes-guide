# Bookstore — Part 02 ch.06 "Network policies": zero-trust the namespace.
#
# By default every Pod can talk to every other Pod (default-ALLOW). These
# policies flip the `bookstore` namespace to default-DENY and then ALLOW only
# the edges the app actually needs. NetworkPolicy is ADDITIVE/whitelist: once
# any policy selects a Pod for a direction, ONLY explicitly allowed traffic in
# that direction is permitted.
#
# !!! CNI REQUIREMENT !!!  NetworkPolicy is enforced by the CNI, not the API
# server. kind's default CNI, kindnet, enforces it since kind v0.24.0, so no
# Calico or Cilium is needed on kind. The runtime gate (G4) deploys these
# policies on kind v0.33.0, and an edge with no allow shows up as a connection
# timeout. The engine's start line is only a start check: a denied request
# proves enforcement (ch.06 step 0). A CNI without a policy engine (a managed
# cluster with its policy setting off, an older kind) accepts these objects and
# enforces nothing, which looks the same until something depends on them.
#
# !!! DNS EGRESS !!!  default-deny egress also blocks DNS. Every Pod that
# resolves a Service name needs egress to kube-dns/CoreDNS (UDP+TCP 53) or the
# whole app breaks with name-resolution failures. The allow-dns-egress policy
# below is mandatory; this is the single most common NetworkPolicy outage.
#
# !!! BOTH ENDS !!!  egress is ALSO default-denied, so every Pod-to-Pod edge
# needs an allow on BOTH sides: an Ingress rule on the destination AND an
# Egress rule on the source. storefront->catalog/orders therefore needs the
# destination Ingress (rule 4) AND the source Egress (rule 8); the backend
# callers catalog/orders likewise (rules 5/6 ingress + rule 7 egress).
#
# selectors verified against the real pod labels:
#   storefront app: storefront (11-)  catalog         app: catalog        (10-)
#   orders     app: orders     (14-)  postgres        app: postgres       (20-)
#   rabbitmq   app: rabbitmq   (13-)  payments-worker app: payments-worker (19-)
#   redis      app: redis      (12-)  db-migrate      app: db-migrate     (21-)
#   cleanup    app: cleanup    (22-)
#   traefik + monitoring namespaces matched by ns label below
#
# Part 06 ch.04 increment (additive — all 8 prior policies are unchanged
# except rule 6, which GAINS payments-worker as an allowed source; two new
# policies are appended):
#  • payments-worker -> rabbitmq (the worker consumes the "orders" queue,
#    app/payments-worker/main.go). Like every backend edge this needs BOTH
#    ends: rule 6's Ingress on rabbitmq now also admits app: payments-worker,
#    and a new Egress policy (rule 9) lets payments-worker reach rabbitmq:5672.
#  • Prometheus scrape (Part 06 ch.01): kube-prometheus-stack runs in the
#    `monitoring` namespace and must reach the /metrics ports of catalog,
#    orders and payments-worker (all :8080). default-deny Ingress (rule 1)
#    blocks that, so a new Ingress policy (rule 10) admits the monitoring
#    namespace to those three tiers on 8080. Without it every ServiceMonitor
#    target shows "context deadline exceeded" once a policy CNI is enforcing.
#
# Requires (objects to enforce against):
#   kubectl apply -f examples/bookstore/raw-manifests/00-namespace.yaml
#   kubectl apply -f examples/bookstore/raw-manifests/{10,11,13,14,19,20}-*.yaml
#   # a policy-enforcing CNI for ENFORCEMENT (kindnet on kind, ch.06 step 0)
# Apply:
#   kubectl apply -f examples/bookstore/raw-manifests/60-networkpolicy.yaml
#   kubectl get networkpolicy -n bookstore
---
# 1) Baseline default-deny: select ALL Pods, allow NOTHING in either
#    direction. Every allow below is added on top of this.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny-all
  namespace: bookstore
  labels:
    app.kubernetes.io/part-of: bookstore
spec:
  podSelector: {}                   # {} = every Pod in the namespace
  policyTypes: ["Ingress", "Egress"]
  # no ingress: / egress: rules => deny all of both
---
# 2) MANDATORY: allow every Pod egress to cluster DNS (CoreDNS in
#    kube-system). Without this, default-deny egress breaks all name
#    resolution. Matches the kube-system namespace + the kube-dns Service
#    pods (label k8s-app=kube-dns, the upstream CoreDNS label).
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-dns-egress
  namespace: bookstore
  labels:
    app.kubernetes.io/part-of: bookstore
spec:
  podSelector: {}                   # applies to every Pod in the namespace
  policyTypes: ["Egress"]
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - { protocol: UDP, port: 53 }
        - { protocol: TCP, port: 53 }
---
# 3) Traefik (the ingress controller of ch.04 and ch.05) -> storefront /
#    catalog / orders. Traefik lives in its own namespace; allow it to reach
#    the three HTTP-fronted tiers on 8080. Namespace match uses the immutable
#    kubernetes.io/metadata.name label (= the traefik namespace; adjust if you
#    installed the controller elsewhere).
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-ingress-to-http-tiers
  namespace: bookstore
  labels:
    app.kubernetes.io/part-of: bookstore
spec:
  podSelector:
    matchExpressions:
      - key: app
        operator: In
        values: ["storefront", "catalog", "orders"]
  policyTypes: ["Ingress"]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: traefik
      ports:
        - { protocol: TCP, port: 8080 }
---
# 4) storefront -> catalog and storefront -> orders. These two edges carry
#    traffic only if you enable the server-side proxy block in
#    app/storefront/nginx.conf, which ships commented out. The browser reaches
#    the APIs through the edge, which rule 3 covers. The guide keeps these
#    edges because chapter 02.06 uses them to show that a connection needs both
#    ends. In a real cluster you delete an allow nothing uses.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-storefront-to-apis
  namespace: bookstore
  labels:
    app.kubernetes.io/part-of: bookstore
spec:
  podSelector:
    matchExpressions:
      - key: app
        operator: In
        values: ["catalog", "orders"]
  policyTypes: ["Ingress"]
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app: storefront
      ports:
        - { protocol: TCP, port: 8080 }
---
# 5) The data tier: who may open a connection to postgres (:5432) and to
#    redis (:6379). Ingress rules ON the two data pods. The matching egress
#    allowance for each client is rule 7 (egress is also default-denied, so
#    BOTH sides must permit it).
#      postgres :5432  catalog (books table), orders (INSERT), the db-migrate
#                      Job and the cleanup CronJob (both run psql)
#      redis    :6379  catalog (the cache; REDIS_ADDR is set from Part 03)
#    One policy selects both pods, and each rule names its own port. Only
#    postgres listens on 5432 and only redis on 6379, so a rule reaches
#    exactly one of them.
#    The first version of this file admitted only catalog to postgres and
#    nobody to redis. That held while the services ran without a database,
#    and broke the moment orders, db-migrate and the cache were wired in
#    (Part 03): orders and the migration Job could not reach postgres and
#    catalog could not reach redis. The runtime gate (G4) found it, because it
#    starts every workload on a cluster that enforces these policies.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-data-tier-ingress
  namespace: bookstore
  labels:
    app.kubernetes.io/part-of: bookstore
spec:
  podSelector:
    matchExpressions:
      - key: app
        operator: In
        values: ["postgres", "redis"]
  policyTypes: ["Ingress"]
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app: catalog
        - podSelector:
            matchLabels:
              app: orders
        - podSelector:
            matchLabels:
              app: db-migrate
        - podSelector:
            matchLabels:
              app: cleanup
      ports:
        - { protocol: TCP, port: 5432 }
    - from:
        - podSelector:
            matchLabels:
              app: catalog
      ports:
        - { protocol: TCP, port: 6379 }
---
# 6) orders -> rabbitmq (orders PUBLISHES order events) AND
#    payments-worker -> rabbitmq (payments-worker CONSUMES them). Both speak
#    AMQP 5672 to the same broker, so this single Ingress rule on rabbitmq
#    admits BOTH source apps. The matching egress allowances are rule 7
#    (orders, with catalog) and rule 9 (payments-worker).
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-orders-to-rabbitmq
  namespace: bookstore
  labels:
    app.kubernetes.io/part-of: bookstore
spec:
  podSelector:
    matchLabels:
      app: rabbitmq
  policyTypes: ["Ingress"]
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app: orders
        - podSelector:
            matchLabels:
              app: payments-worker      # Part 06 ch.04: the queue consumer
      ports:
        - { protocol: TCP, port: 5672 }
---
# 7) Egress side of the backend edges. default-deny egress (rule 1) also
#    blocks every connection to the data tier and the broker unless the SOURCE
#    Pod is granted egress too. (DNS egress is rule 2; this adds the data-plane
#    egress for the Pods that open connections: catalog, orders and the two
#    batch Pods that run psql, db-migrate and cleanup.) The source grants a
#    superset on purpose. Each destination still decides who it admits (rules
#    5 and 6), so orders can reach redis here but redis refuses it, and the
#    batch Pods are granted the broker here but the broker refuses them.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-backend-egress
  namespace: bookstore
  labels:
    app.kubernetes.io/part-of: bookstore
spec:
  podSelector:
    matchExpressions:
      - key: app
        operator: In
        values: ["catalog", "orders", "db-migrate", "cleanup"]
  policyTypes: ["Egress"]
  egress:
    - to:
        - podSelector:
            matchLabels:
              app: postgres
      ports:
        - { protocol: TCP, port: 5432 }
    - to:
        - podSelector:
            matchLabels:
              app: redis
      ports:
        - { protocol: TCP, port: 6379 }
    - to:
        - podSelector:
            matchLabels:
              app: rabbitmq
      ports:
        - { protocol: TCP, port: 5672 }
---
# 8) Egress side of the storefront->catalog/orders edges. These carry traffic
#    only if you enable the server-side proxy block in
#    app/storefront/nginx.conf, which ships commented out. The guide keeps this
#    rule because chapter 02.06 uses the edge to show that a connection needs
#    both ends: default-deny egress (rule 1) blocks storefront's calls unless
#    storefront is granted egress, and rule 4 is the matching INGRESS. In a
#    real cluster you delete an allow nothing uses. Pair with the mandatory DNS
#    egress (rule 2) so storefront can resolve the Service names first.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-storefront-egress
  namespace: bookstore
  labels:
    app.kubernetes.io/part-of: bookstore
spec:
  podSelector:
    matchLabels:
      app: storefront
  policyTypes: ["Egress"]
  egress:
    - to:
        - podSelector:
            matchLabels:
              app: catalog
      ports:
        - { protocol: TCP, port: 8080 }
    - to:
        - podSelector:
            matchLabels:
              app: orders
      ports:
        - { protocol: TCP, port: 8080 }
---
# 9) Part 06 ch.04 — Egress side of payments-worker -> rabbitmq. default-deny
#    egress (rule 1) also blocks the worker's AMQP connection unless the
#    SOURCE Pod is granted egress. Rule 6 is the matching INGRESS (on
#    rabbitmq, now admitting app: payments-worker); this is the SOURCE egress
#    that completes the both-ends requirement. Pair with the mandatory DNS
#    egress (rule 2, podSelector {} — already covers payments-worker) so the
#    worker can resolve rabbitmq.bookstore.svc.cluster.local first.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-payments-worker-egress
  namespace: bookstore
  labels:
    app.kubernetes.io/part-of: bookstore
spec:
  podSelector:
    matchLabels:
      app: payments-worker
  policyTypes: ["Egress"]
  egress:
    - to:
        - podSelector:
            matchLabels:
              app: rabbitmq
      ports:
        - { protocol: TCP, port: 5672 }
---
# 10) Part 06 ch.01 — allow the monitoring namespace (kube-prometheus-stack,
#     installed in ch.01) to SCRAPE the /metrics endpoints of the three
#     metrics-exposing tiers on :8080. default-deny Ingress (rule 1) blocks
#     Prometheus otherwise and every ServiceMonitor (80-) / PodMonitor target
#     reports a scrape timeout. Namespace match uses the immutable
#     kubernetes.io/metadata.name label (= the namespace Prometheus runs in;
#     adjust if you installed kube-prometheus-stack elsewhere). storefront is
#     deliberately NOT here — the nginx UI exposes no Prometheus metrics.
#
#     INTENTIONALLY ONE-SIDED (contrast the "both-ends" rules 4-9). The
#     intra-namespace backend edges need an egress half because BOTH endpoints
#     live in this default-DENY namespace (rule 1 also denies egress). This
#     edge is CROSS-namespace: the source (Prometheus) is in the `monitoring`
#     namespace, which kube-prometheus-stack does NOT place under a
#     default-deny NetworkPolicy — so Prometheus already has unrestricted
#     egress and needs NO egress rule. NetworkPolicy is per-namespace; only
#     the destination side (`bookstore`) is locked down, so this destination
#     Ingress is the ONLY half there is to add. Not a missing half — the
#     source side simply isn't policy-restricted.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-monitoring-scrape
  namespace: bookstore
  labels:
    app.kubernetes.io/part-of: bookstore
spec:
  podSelector:
    matchExpressions:
      - key: app
        operator: In
        values: ["catalog", "orders", "payments-worker"]
  policyTypes: ["Ingress"]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: monitoring
      ports:
        - { protocol: TCP, port: 8080 }
