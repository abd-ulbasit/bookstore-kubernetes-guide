# Bookstore Part 11 ch.09: a small kube-burner (v2.8.7) workload config. It
# creates and then deletes Bookstore-shaped Deployments and ConfigMaps, and
# reports pod-latency percentiles.
#
# This is a kube-burner config, not a Kubernetes object. Never kubectl apply it.
# Run it from this directory, so the objectTemplate paths resolve whether they
# are read relative to the config file or the working directory:
#   cd examples/bookstore/platform
#   kube-burner init -c kube-burner-bookstore.yaml --log-level=info
#
# Every object lands in bookstore-perf, its own namespace. The namespace carries
# the restricted Pod Security labels, and the pod template is restricted too.
# Jobs are small on purpose: a single kind node is far below the scalability
# envelope, so only the method transfers, not the numbers.
global:
  measurements:
    - name: podLatency
jobs:
  - name: bookstore-perf-create
    jobType: create
    jobIterations: 10
    qps: 5
    burst: 10
    namespacedIterations: false
    namespace: bookstore-perf
    waitWhenFinished: true
    podWait: false
    objects:
      - objectTemplate: bookstore-perf-deploy.yml
        replicas: 1
      - objectTemplate: bookstore-perf-cm.yml
        replicas: 1
  - name: bookstore-perf-delete
    jobType: delete
    waitWhenFinished: true
    objects:
      - kind: Deployment
        apiVersion: apps/v1
        labelSelector: { bookstore.example.com/perf: "true" }
      - kind: ConfigMap
        apiVersion: v1
        labelSelector: { bookstore.example.com/perf: "true" }
