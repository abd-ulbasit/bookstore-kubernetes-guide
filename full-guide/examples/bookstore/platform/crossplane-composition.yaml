# Bookstore — Part 11 ch.10 "Platform engineering": the Composition — the
# RECIPE that expands ONE BookstoreEnvironment (crossplane-xrd.yaml) into the
# guide's GUARDED-NAMESPACE stack. This is where "guardrails by construction"
# is real: the developer's 2-field request can ONLY become this hardened/
# bounded/isolated set of objects, because the Composition is the sole producer
# and the provider's ServiceAccount is bound only to the kinds it lists
# (ch.10 "Threats and controls", E10).
#
# WHAT IT PROVISIONS (= the guide's stack, Parts 01-08, made self-service):
#   - Namespace  pod-security.kubernetes.io/enforce=restricted  (Part 05 ch.02)
#   - RoleBinding to the built-in ClusterRole `view`, in the tenant namespace
#                                                 (Part 05 ch.01, read-only)
#   - ResourceQuota + LimitRange  bounded                (Part 01 ch.03 / 08 ch.04)
#   - NetworkPolicy  default-deny ingress+egress                  (Part 02 ch.06)
# Each is wrapped in a NAMESPACED provider-kubernetes `Object`
# (kubernetes.m.crossplane.io/v1alpha1) in the XR's own namespace, so Crossplane
# reconciles it continuously (operator pattern, ch.02, generalised: delete one
# by hand and it is healed back; ch.10 §3).
#
# WHY NAMESPACED OBJECTS: a namespaced XR may compose only resources in its own
# namespace (Crossplane v2 docs, composite resource definitions). The
# cluster-scoped kubernetes.crossplane.io Object is the legacy form and is not
# used here.
#
# WHY THE `view` ROLE, NOT A CUSTOM ROLE: a provider that creates a Role granting
# pods, services and configmaps must already hold those permissions, or the API
# server refuses the create (escalation check). Binding `view` needs only the
# `bind` verb on clusterroles/view (ch.10 Hands-on, the provider ClusterRole).
#
# REQUIRES (ch.10 Hands-on step 1), IN THIS ORDER: Crossplane installed, the
# provider-kubernetes and function-patch-and-transform packages Healthy, and the
# namespaced ProviderConfig `default` in the request namespace. The Function
# must be Healthy before this Composition is applied, or its pipeline never runs.
#
# !!! CRD-INTRINSIC DRY-RUN (same precedent as argocd/, operator/, multicluster/)
#   `Composition` is `apiextensions.crossplane.io/v1`, a Crossplane CRD. Before
#   Crossplane is installed a client dry-run prints:
#     no matches for kind "Composition" in version "apiextensions.crossplane.io/v1"
#   EXPECTED. Schema checked against the Crossplane v2.4.3 CRD.
#
# ADDITIVE: NEW file; touches no canonical Bookstore manifest, Helm chart,
# Kustomize overlay, the operator, the argocd/ or multicluster/ trees, or any
# existing examples/bookstore/** file.
#
# Apply (after the XRD is Established — ch.10 Hands-on step 2):
#   kubectl apply -f examples/bookstore/platform/crossplane-composition.yaml
apiVersion: apiextensions.crossplane.io/v1
kind: Composition
metadata:
  name: bookstore-guarded-namespace
  labels:
    app.kubernetes.io/part-of: bookstore
spec:
  compositeTypeRef:
    apiVersion: platform.bookstore.example.com/v1alpha1
    kind: BookstoreEnvironment
  mode: Pipeline
  pipeline:
    - step: render-guarded-namespace
      functionRef:
        name: function-patch-and-transform
      input:
        apiVersion: pt.fn.crossplane.io/v1beta1
        kind: Resources
        resources:
          # --- 1. The PSA-restricted Namespace (Part 05 ch.02) ---
          - name: namespace
            base:
              apiVersion: kubernetes.m.crossplane.io/v1alpha1
              kind: Object
              spec:
                providerConfigRef: { kind: ProviderConfig, name: default }
                forProvider:
                  manifest:
                    apiVersion: v1
                    kind: Namespace
                    metadata:
                      # the REAL namespace name — patched per-tenant below
                      # (the composed Object's own name is framework-managed,
                      # NEVER patched — that is the footgun this avoids).
                      name: bookstore-tenant-REPLACED
                      labels:
                        app.kubernetes.io/part-of: bookstore
                        app.kubernetes.io/managed-by: crossplane
                        # THE GUARDRAIL: enforce restricted PSA (Part 05 ch.02).
                        pod-security.kubernetes.io/enforce: restricted
                        pod-security.kubernetes.io/enforce-version: latest
                        pod-security.kubernetes.io/audit: restricted
                        pod-security.kubernetes.io/warn: restricted
            patches:
              # ONLY patch the wrapped manifest's namespace name.
              - type: FromCompositeFieldPath
                fromFieldPath: spec.tenant
                toFieldPath: spec.forProvider.manifest.metadata.name
                transforms:
                  - type: string
                    string: { fmt: "bookstore-tenant-%s", type: Format }
              # surface the provisioned namespace back onto the XR status
              - type: ToCompositeFieldPath
                fromFieldPath: spec.forProvider.manifest.metadata.name
                toFieldPath: status.namespace

          # --- 2. RoleBinding: the tenant group reads the namespace, via `view` ---
          - name: rolebinding
            base:
              apiVersion: kubernetes.m.crossplane.io/v1alpha1
              kind: Object
              spec:
                providerConfigRef: { kind: ProviderConfig, name: default }
                forProvider:
                  manifest:
                    apiVersion: rbac.authorization.k8s.io/v1
                    kind: RoleBinding
                    metadata:
                      name: bookstore-tenant
                      namespace: bookstore-tenant-REPLACED
                      labels: { app.kubernetes.io/part-of: bookstore }
                    roleRef:
                      # built-in read-only role: no Secrets, no RBAC, no exec.
                      # The provider needs only `bind` on this one name.
                      apiGroup: rbac.authorization.k8s.io
                      kind: ClusterRole
                      name: view
                    subjects:
                      # generic placeholder group — map to the real tenant
                      # group in your IdP (Part 05 ch.01); no real principal.
                      - kind: Group
                        apiGroup: rbac.authorization.k8s.io
                        name: bookstore-tenant-REPLACED
            patches:
              - type: FromCompositeFieldPath
                fromFieldPath: spec.tenant
                toFieldPath: spec.forProvider.manifest.metadata.namespace
                transforms:
                  - type: string
                    string: { fmt: "bookstore-tenant-%s", type: Format }
              - type: FromCompositeFieldPath
                fromFieldPath: spec.tenant
                toFieldPath: spec.forProvider.manifest.subjects[0].name
                transforms:
                  - type: string
                    string: { fmt: "bookstore-tenant-%s", type: Format }

          # --- 3. ResourceQuota (Part 01 ch.03 / Part 08 ch.04) ---
          - name: resourcequota
            base:
              apiVersion: kubernetes.m.crossplane.io/v1alpha1
              kind: Object
              spec:
                providerConfigRef: { kind: ProviderConfig, name: default }
                forProvider:
                  manifest:
                    apiVersion: v1
                    kind: ResourceQuota
                    metadata:
                      name: bookstore-tenant
                      namespace: bookstore-tenant-REPLACED
                      labels: { app.kubernetes.io/part-of: bookstore }
                    spec:
                      hard:
                        # One quota for every tenant. The XRD has no size
                        # field, so no request can pick another total.
                        requests.cpu: "2"
                        requests.memory: 2Gi
                        limits.cpu: "4"
                        limits.memory: 4Gi
                        pods: "20"
            patches:
              - type: FromCompositeFieldPath
                fromFieldPath: spec.tenant
                toFieldPath: spec.forProvider.manifest.metadata.namespace
                transforms:
                  - type: string
                    string: { fmt: "bookstore-tenant-%s", type: Format }

          # --- 4. LimitRange (Part 01 ch.03) ---
          - name: limitrange
            base:
              apiVersion: kubernetes.m.crossplane.io/v1alpha1
              kind: Object
              spec:
                providerConfigRef: { kind: ProviderConfig, name: default }
                forProvider:
                  manifest:
                    apiVersion: v1
                    kind: LimitRange
                    metadata:
                      name: bookstore-tenant
                      namespace: bookstore-tenant-REPLACED
                      labels: { app.kubernetes.io/part-of: bookstore }
                    spec:
                      limits:
                        - type: Container
                          default: { cpu: 250m, memory: 128Mi }
                          defaultRequest: { cpu: 50m, memory: 64Mi }
                          min: { cpu: 10m, memory: 16Mi }
                          max: { cpu: "2", memory: 1Gi }
            patches:
              - type: FromCompositeFieldPath
                fromFieldPath: spec.tenant
                toFieldPath: spec.forProvider.manifest.metadata.namespace
                transforms:
                  - type: string
                    string: { fmt: "bookstore-tenant-%s", type: Format }

          # --- 5. NetworkPolicy: default-deny ingress+egress (Part 02 ch.06) ---
          - name: networkpolicy-default-deny
            base:
              apiVersion: kubernetes.m.crossplane.io/v1alpha1
              kind: Object
              spec:
                providerConfigRef: { kind: ProviderConfig, name: default }
                forProvider:
                  manifest:
                    apiVersion: networking.k8s.io/v1
                    kind: NetworkPolicy
                    metadata:
                      name: default-deny
                      namespace: bookstore-tenant-REPLACED
                      labels: { app.kubernetes.io/part-of: bookstore }
                    spec:
                      # selects ALL pods; no ingress/egress rules = deny all.
                      # A real golden path adds explicit allow policies on top
                      # (Part 02 ch.06 default-deny + explicit-allow pattern).
                      podSelector: {}
                      policyTypes: ["Ingress", "Egress"]
            patches:
              - type: FromCompositeFieldPath
                fromFieldPath: spec.tenant
                toFieldPath: spec.forProvider.manifest.metadata.namespace
                transforms:
                  - type: string
                    string: { fmt: "bookstore-tenant-%s", type: Format }
