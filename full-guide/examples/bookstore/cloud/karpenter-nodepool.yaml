# Bookstore, Part 10 ch.06 "Node autoscaling, cost & multi-cloud": Karpenter
# objects for the Bookstore's node tiers. Two NodePools (the stateless tiers,
# and the data tier that Postgres must use) share one EC2NodeClass.
#
# Karpenter is a node autoscaler for AWS/EKS that provisions JUST-IN-TIME,
# RIGHT-SIZED nodes from a broad instance-type set in response to UNschedulable
# Pods, and CONSOLIDATES (removes/replaces under-used nodes) — instead of
# scaling fixed node groups like the Cluster Autoscaler. Two kinds tell
# Karpenter HOW it may provision nodes for the Bookstore:
#   • NodePool      — the provisioning + disruption POLICY (instance families,
#                     capacity type, taints, limits, consolidation, expiry).
#   • EC2NodeClass  is the AWS-specific node TEMPLATE (AMI, the IAM role the
#                     node uses, subnet/security-group discovery by tag).
#
# CRD-BACKED. NodePool and EC2NodeClass are not built-in Kubernetes kinds. They
# come from the karpenter-crd chart (pinned to 1.15.1, the same version as the
# controller chart), which must be installed before these objects apply. With
# no CRDs installed, a client dry-run prints:
#       error: resource mapping not found ... no matches for kind "NodePool"
#       in version "karpenter.sh/v1"
#       error: ... no matches for kind "EC2NodeClass" in version
#       "karpenter.k8s.aws/v1"
# That is expected and is not a defect in this file. Once the CRDs exist, a
# server-side dry-run validates the schema and the CEL rules.
#
# Karpenter is AWS/EKS-only in this file. GKE's node auto-provisioning and
# Autopilot are Google's own; AKS Node Autoprovision runs Karpenter with the
# AKS provider. The CONCEPT (JIT right-sized nodes + consolidation) is portable;
# these objects are not (ch.06 tabulates what is and isn't portable).
#
# Requires (to apply, not just read):
#   - an EKS cluster (Part 10 ch.02) with the karpenter-crd and karpenter charts
#     installed (ch.06 section 2), and the controller's identity (ch.03)
#   - the node IAM role `KarpenterNodeRole-<cluster>` to exist
#   - subnets and security groups TAGGED `karpenter.sh/discovery: <cluster>`
#   - for the data pool, the owner change to 20-postgres-statefulset.yaml in
#     ch.06 section 4; this file does not edit the canonical manifests
#
# !!! AMI PIN (required before applying) !!!
# The EC2NodeClass below carries the placeholder `al2023@v<RELEASE>`. Replace
# <RELEASE> with an AL2023 release you have reviewed for your Kubernetes minor
# before the first apply. `al2023@latest` is not used: it moves every node to a
# new AMI release with no review, and Karpenter's own documentation says it is
# not recommended for production.
#
# Apply (Karpenter-enabled EKS only):
#   kubectl apply -f examples/bookstore/cloud/karpenter-nodepool.yaml
#   kubectl get nodepool,ec2nodeclass
#   # a pending Bookstore Pod that does not fit triggers JIT provisioning;
#   # `kubectl get nodeclaims -w` shows Karpenter create a right-sized node.
apiVersion: karpenter.sh/v1
kind: NodePool
metadata:
  name: bookstore-stateless
  labels:
    app.kubernetes.io/part-of: bookstore
spec:
  # The Pod template Karpenter provisions FOR. Karpenter inspects pending Pods'
  # requests + constraints and launches a node that fits them, from the types
  # these requirements allow.
  template:
    metadata:
      labels:
        # Bookstore stateless tiers (storefront/catalog/orders/payments-worker)
        # can target this pool via nodeSelector/affinity if desired. Postgres
        # does not run here: it runs only on bookstore-data (below).
        bookstore.io/node-pool: stateless
    spec:
      # Let Karpenter pick from a BROAD instance set: a wide set gives it more
      # options to fit pending Pods without buying a much larger node.
      requirements:
        - key: kubernetes.io/arch
          operator: In
          values: ["amd64"]
        - key: kubernetes.io/os
          operator: In
          values: ["linux"]
        - key: karpenter.sh/capacity-type
          operator: In
          values: ["spot", "on-demand"]      # spot is allowed for stateless only
        - key: karpenter.k8s.aws/instance-category
          operator: In
          values: ["c", "m", "r"]            # general/compute/mem families
        - key: karpenter.k8s.aws/instance-size
          operator: NotIn
          values: ["nano", "micro"]          # too small for the app pods
      # The node template (AWS specifics) — references the EC2NodeClass below.
      nodeClassRef:
        group: karpenter.k8s.aws
        kind: EC2NodeClass
        name: bookstore-default
      # Node lifetime and drain. Expiry drains a node after 720h (about 30
      # days). terminationGracePeriod caps how long a drain waits for each Pod.
      # It bypasses blocked PodDisruptionBudgets, so it must exceed the longest
      # preStop plus grace period the stateless tiers rely on.
      expireAfter: 720h
      terminationGracePeriod: 1m
  # Disruption = consolidation: Karpenter removes/replaces nodes whose Pods can
  # be safely repacked elsewhere, shrinking the bill (ch.06 / Part 06 ch.06).
  disruption:
    consolidationPolicy: WhenEmptyOrUnderutilized
    consolidateAfter: 1m
    budgets:
      - nodes: "10%"                          # at most 10% of nodes disrupted
                                              #   at once; voluntary disruption
                                              #   only, honours PDBs (Part 06 ch.05)
  # Limits cap the CPU and memory this pool may provision. They do not cap
  # dollars: prices vary by instance type and capacity type. They do bound how
  # far a scale-up can go (ch.06 threats table; Part 06 ch.04).
  limits:
    cpu: "200"
    memory: 200Gi
---
apiVersion: karpenter.sh/v1
kind: NodePool
metadata:
  name: bookstore-data
  labels:
    app.kubernetes.io/part-of: bookstore
spec:
  template:
    metadata:
      labels:
        # Postgres must REQUIRE this label (the owner change in ch.06 section 4).
        # A label alone attracts Pods; the taint below keeps everything else out.
        dedicated: database
    spec:
      taints:
        # Only Pods that tolerate dedicated=database:NoSchedule land here.
        # Postgres's canonical manifest tolerates it; the stateless tiers do not.
        - key: dedicated
          value: database
          effect: NoSchedule
      requirements:
        - key: kubernetes.io/arch
          operator: In
          values: ["amd64"]
        - key: kubernetes.io/os
          operator: In
          values: ["linux"]
        - key: karpenter.sh/capacity-type
          operator: In
          values: ["on-demand"]              # never spot for the data tier
      nodeClassRef:
        group: karpenter.k8s.aws
        kind: EC2NodeClass
        name: bookstore-default
      # Expiry drains a node, and Postgres is a singleton with no replica to
      # take over. Roll these nodes in a planned window, not by expiry.
      expireAfter: 8760h
  disruption:
    # Empty nodes are removed; occupied data nodes are never consolidated away
    # from under Postgres.
    consolidationPolicy: WhenEmpty
  limits:
    cpu: "16"
    memory: 64Gi
---
apiVersion: karpenter.k8s.aws/v1
kind: EC2NodeClass
metadata:
  name: bookstore-default
  labels:
    app.kubernetes.io/part-of: bookstore
spec:
  amiFamily: AL2023                           # the node OS image family
  amiSelectorTerms:
    # Pin a reviewed AL2023 release (family@version). Replace <RELEASE> before
    # applying. See the AMI PIN note in the header above.
    - alias: al2023@v<RELEASE>
  # The node's INSTANCE role (distinct from the Karpenter CONTROLLER's IRSA/Pod
  # Identity role — ch.03). Keep it minimal: only what the kubelet/CNI/CSI need
  # (ch.03 "keep the node role tiny; block the metadata endpoint").
  role: "KarpenterNodeRole-bookstore"         # placeholder cluster name
  # Discover subnets + security groups by TAG (set on the VPC resources by the
  # cluster IaC — Part 10 ch.02). Multi-AZ subnets so Karpenter can spread
  # nodes across AZs (Part 10 ch.01).
  subnetSelectorTerms:
    - tags:
        karpenter.sh/discovery: "bookstore"   # placeholder cluster name
  securityGroupSelectorTerms:
    - tags:
        karpenter.sh/discovery: "bookstore"
  # Encrypted, sized root volume for the node (data PVs are separate cloud
  # disks — Part 10 ch.05; this is just the node's own disk).
  blockDeviceMappings:
    - deviceName: /dev/xvda
      ebs:
        volumeSize: 50Gi
        volumeType: gp3
        encrypted: true
  metadataOptions:
    # IMDSv2 + a hop limit of 1, so a container on the pod network cannot reach
    # the node's instance metadata to take the node role. Workload identity
    # (ch.03) only holds if this escape is closed.
    httpEndpoint: enabled
    httpTokens: required
    httpPutResponseHopLimit: 1
