# The namespace half of the exceptions registry (docs/design/2026-10-29-security-first-rewrite.md,
# section 5.4). The scanner half is .trivyignore.yaml at the repository root.
#
# Every namespace the guide labels above `restricted` (baseline or privileged, in
# any of enforce, audit or warn) has one entry here, and every entry must still
# be in use: `make gates-registry` checks both directions. Each entry has:
#
#   namespace  the namespace name
#   level      baseline or privileged: the most permissive level the guide sets on it
#   reason     why the component or lab cannot run under restricted
#   upstream   the upstream document that demands the privilege, or the Pod
#              Security Standards page for a lab that shows it on purpose
#   chapter    the chapter that explains the exception, relative to full-guide/
#   expires    YYYY-MM-DD; still ahead, and no more than 12 months out

exceptions:
  - namespace: falco
    level: privileged
    reason: >-
      The Falco DaemonSet mounts host paths, among them the runtime sockets,
      and restricted and baseline both forbid hostPath. The chapter's Terraform
      sets the chart's least-privileged mode (driver.modernEbpf.leastPrivileged),
      which drops privileged and adds CAP_BPF, CAP_PERFMON, CAP_SYS_RESOURCE and
      CAP_SYS_PTRACE. The host paths still need the privileged level. Falco is
      one of two privileged namespaces in the bookstore-platform Terraform tree;
      the other is kube-system, for Cilium.
    upstream: https://falco.org/docs/concepts/event-sources/kernel/
    chapter: 14-eks-in-production-a-to-z/13-runtime-defense-and-container-security.md
    expires: 2027-06-30

  - namespace: node-logs
    level: privileged
    reason: >-
      The chapter's log agent reads the node's pod log directory, /var/log/pods,
      through a hostPath volume. The Pod Security Standards forbid hostPath at
      baseline, and the restricted profile does not list it among its allowed
      volume types, so only privileged admits the agent. The namespace holds that
      one agent and keeps audit and warn at restricted. The chapter deletes it at
      the end of the lab.
    upstream: https://kubernetes.io/docs/concepts/security/pod-security-standards/#baseline
    chapter: 01-core-workloads/06-daemonsets.md
    expires: 2027-06-30

  - namespace: kube-system
    level: privileged
    reason: >-
      The Cilium agent DaemonSet uses host networking, hostPath mounts,
      capabilities such as NET_ADMIN and SYS_ADMIN, and Unconfined seccomp and
      AppArmor profiles in the chart's default render. The baseline level forbids
      each of these, so the namespace carries the privileged level. The Cilium
      operator shares the namespace and runs with hostNetwork by chart default.
      This is the second privileged namespace in the bookstore-platform tree;
      falco is the other.
    upstream: https://kubernetes.io/docs/concepts/security/pod-security-standards/
    chapter: 14-eks-in-production-a-to-z/15-cilium-ebpf-on-eks.md
    expires: 2027-06-30

  - namespace: monitoring
    level: privileged
    reason: >-
      The kube-prometheus-stack node-exporter DaemonSet reads host metrics
      through hostNetwork and hostPath volumes for /proc, /sys and the root
      filesystem, and baseline forbids both. The chapter turns off the shared
      host PID namespace, keeps only those host mounts, and labels warn and
      audit restricted, so the dry run names node-exporter alone.
    upstream: https://kubernetes.io/docs/concepts/security/pod-security-standards/
    chapter: 06-production-readiness/01-observability-metrics.md
    expires: 2027-10-31

  - namespace: crossplane-system
    level: baseline
    reason: >-
      Only the provider and function pods that Crossplane creates from packages
      are left under this exception. The default pod template Crossplane gives
      them sets no seccomp profile and drops no capabilities, so restricted
      rejects them; baseline admits them, since no pod is privileged or uses a
      host namespace. The chart's own Deployments meet restricted with the
      values in 13.02 section 1. Audit and warn stay at restricted to show the
      gap.
    upstream: https://github.com/crossplane/crossplane/blob/v2.4.3/internal/controller/pkg/runtime/runtime.go
    chapter: 13-grand-capstone-bookstore-platform/02-tenancy-and-crossplane-onboarding.md
    expires: 2027-06-30

  - namespace: istio-node
    level: privileged
    reason: >-
      The Istio ambient node agents, istio-cni and ztunnel, need CAP_SYS_ADMIN,
      CAP_NET_ADMIN and CAP_NET_RAW and mount host paths, which baseline forbids.
      They also run as root, which restricted forbids. The namespace holds only
      these two agents, apart from istiod, so only they carry the privilege.
    upstream: https://kubernetes.io/docs/concepts/security/pod-security-standards/#baseline
    chapter: 13-grand-capstone-bookstore-platform/04-real-auth-keycloak-irsa-istio-jwt.md
    expires: 2027-06-30

  - namespace: kafka-system
    level: baseline
    reason: >-
      The KafkaConnect build in this namespace runs the Kaniko executor. The
      image declares no user and sets USER=root, so restricted rejects the build
      pod, and baseline admits it with no added capability. The Strimzi operator
      and the Kafka pods are set to meet restricted. The namespace keeps audit and
      warn at restricted.
    upstream: https://strimzi.io/docs/operators/0.40.0/configuring.html
    chapter: 13-grand-capstone-bookstore-platform/05-search-and-product-discovery.md
    expires: 2027-06-30

  - namespace: istio-system
    level: privileged
    reason: >-
      The Istio ambient node agents need privileges that restricted and baseline
      both refuse. istio-cni-node runs as root with NET_ADMIN, NET_RAW, SYS_ADMIN
      and DAC_OVERRIDE and mounts hostPath volumes such as /opt/cni/bin and
      /etc/cni/net.d. ztunnel runs as root with NET_ADMIN, SYS_ADMIN and NET_RAW.
      The namespace holds these node agents and istiod, nothing from the
      Bookstore.
    upstream: https://istio.io/latest/docs/setup/additional-setup/pod-security-admission/
    chapter: 11-advanced-production-patterns/04-service-mesh.md
    expires: 2027-06-30

  - namespace: chaos-mesh
    level: privileged
    reason: >-
      The Chaos Mesh chaos-daemon DaemonSet sets hostPID, mounts the node's
      container runtime socket, /sys and /lib/modules through hostPath, and runs
      a privileged container, so it can enter a target Pod's namespaces to inject
      network and stress faults. Baseline forbids hostPID, hostPath and privileged
      containers, and the capability list that replaces privileged would add
      SYS_ADMIN and NET_ADMIN, which baseline also forbids. The namespace holds the
      daemon, the controller and the dashboard. Audit and warn stay at restricted,
      so the controller and dashboard warnings stay visible.
    upstream: https://github.com/chaos-mesh/chaos-mesh/blob/v2.8.7/helm/chaos-mesh/values.yaml
    chapter: 11-advanced-production-patterns/07-chaos-engineering.md
    expires: 2027-06-30

  - namespace: velero
    level: privileged
    reason: >-
      Only the chapter's file-system-backup variant needs this. Its Velero node
      agent reads pod volumes through a hostPath volume (/var/lib/kubelet/pods)
      and runs as root, and the Pod Security Standards forbid hostPath at
      baseline, so only privileged admits it. The chapter's default install
      takes CSI snapshots with the node agent off and runs in a restricted
      namespace, which needs no exception. The namespace keeps audit and warn at
      restricted. The Velero controller itself runs under the restricted rules.
    upstream: https://velero.io/docs/v1.18/file-system-backup/
    chapter: 08-day-2-operations/02-backup-and-dr.md
    expires: 2027-06-30

  - namespace: node-debug
    level: privileged
    reason: >-
      A node debugger Pod, from kubectl debug node with the sysadmin profile,
      shares the node's host IPC, network and PID namespaces and mounts the
      node's root filesystem through a hostPath volume. The Pod Security
      Standards forbid host namespaces and hostPath at baseline, so only
      privileged admits it. The namespace holds only node debugger Pods, is
      granted to on-call only, and keeps audit and warn at restricted. The
      chapter shows the same Pod refused in a restricted namespace.
    upstream: https://kubernetes.io/docs/concepts/security/pod-security-standards/#privileged
    chapter: 08-day-2-operations/03-troubleshooting-playbook.md
  - namespace: gpu-operator
    level: privileged
    reason: >-
      The NVIDIA GPU Operator's node DaemonSets need host access. The driver and
      the container toolkit run privileged with hostPID and host root mounts, and
      the device plugin, DCGM exporter and GPU feature discovery run privileged
      with hostPath mounts. Node feature discovery mounts hostPath volumes too.
      Baseline forbids privileged containers and hostPath volumes, so only
      privileged admits the stack. Workload Pods never join this namespace, and
      audit and warn stay at restricted.
    upstream: https://docs.nvidia.com/datacenter/cloud-native/gpu-operator/latest/getting-started.html
    chapter: 12-kubernetes-for-machine-learning/02-gpus-and-accelerators.md
    expires: 2027-06-30
  - namespace: p05-recon-app
    level: baseline
    reason: >-
      The Part 05 recon lab needs an application with a weak start: a root Pod
      that names no ServiceAccount and keeps the default token. Baseline admits
      that Pod, and restricted does not. The namespace enforces baseline, warns
      at restricted, and holds that one marked Pod. The lab script deletes the
      namespace at the end.
    upstream: https://kubernetes.io/docs/concepts/security/pod-security-standards/
    chapter: 05-security/00-the-attackers-view.md
    expires: 2027-10-31

  - namespace: p05-rbac
    level: baseline
    reason: >-
      The Part 05 RBAC lab holds a victim Pod and seven identities that each
      carry one ordinary-looking grant. Path A creates a Pod that sets no
      securityContext, to show that a grant to create Pods lets a caller borrow
      a ServiceAccount and its token. Baseline admits that Pod, and restricted
      does not. The lab script deletes the namespace at the end.
    upstream: https://kubernetes.io/docs/concepts/security/pod-security-standards/
    chapter: 05-security/01-authn-authz-rbac.md
    expires: 2027-10-31

  - namespace: p05-02-attack
    level: privileged
    reason: >-
      The Part 05 Pod Security lab runs Pods that are insecure on purpose:
      privileged, hostPID, hostPath and a mounted runtime socket. They show what
      each field allows on a kind node. Only privileged admits them. The
      namespace holds those marked Pods and nothing else, and the lab script
      deletes it at the end.
    upstream: https://kubernetes.io/docs/concepts/security/pod-security-standards/
    chapter: 05-security/02-pod-security.md
    expires: 2027-10-31

  - namespace: p05-02-baseline
    level: baseline
    reason: >-
      The Part 05 Pod Security lab applies a default Pod with no securityContext
      to show what baseline admits and what it warns about at restricted.
      Baseline admits that Pod, and restricted does not. The namespace warns at
      restricted. The lab script deletes it at the end.
    upstream: https://kubernetes.io/docs/concepts/security/pod-security-standards/
    chapter: 05-security/02-pod-security.md
    expires: 2027-10-31

  - namespace: kernel-attack
    level: privileged
    reason: >-
      The Part 05 kernel isolation lab runs one Pod with the Unconfined seccomp
      profile, to show what a filter-free Pod can call that a RuntimeDefault Pod
      cannot. The restricted and baseline levels both refuse the Unconfined
      profile, so only privileged admits it. The namespace holds that one marked
      Pod, and the lab script deletes it at the end. Every other Pod in the lab
      runs in kernel-restricted.
    upstream: https://kubernetes.io/docs/concepts/security/pod-security-standards/
    chapter: 05-security/05-kernel-isolation.md
    expires: 2027-10-31

  - namespace: kube-bench
    level: privileged
    reason: >-
      The kube-bench Job reads the node's files and process table as root. Its
      upstream manifest sets hostPID and mounts the hostPath directories
      /var/lib/etcd, /etc/kubernetes and /usr/bin. Baseline forbids both host
      namespaces and hostPath, so only privileged admits the Job. The Part 05
      control plane lab runs it once, then deletes the namespace.
    upstream: https://github.com/aquasecurity/kube-bench/blob/main/job.yaml
    chapter: 05-security/06-control-plane-and-node-hardening.md
    expires: 2027-10-31

  - namespace: attack
    level: privileged
    reason: >-
      The Part 05 audit and response lab runs a Pod that mounts the node's root
      filesystem with hostPath, as the attack the chapter then audits, detects
      and responds to. Baseline forbids hostPath, so only privileged admits it.
      The namespace holds the lab's marked Pods and the build identity that
      creates them, and the lab script deletes it at the end.
    upstream: https://kubernetes.io/docs/concepts/security/pod-security-standards/
    chapter: 05-security/08-audit-detection-and-incident-response.md
    expires: 2027-10-31

  - namespace: p05-09-exception
    level: baseline
    reason: >-
      The Part 05 registry lab applies this namespace at baseline with a reason
      and an expiry on it, to show that the admission rule admits a namespace
      below restricted that carries its record. The lab script deletes it at the
      end.
    upstream: https://kubernetes.io/docs/concepts/security/pod-security-standards/
    chapter: 05-security/09-running-security-on-a-platform-team.md
    expires: 2027-10-31

  - namespace: p05-09-no-expiry
    level: baseline
    reason: >-
      The Part 05 registry lab applies this namespace at baseline with no reason
      and no expiry, to show that the admission rule refuses it. The rule
      refuses it, so it is never created. It is registered because the chapter's
      manifest labels it baseline and the registry gate reads that label.
    upstream: https://kubernetes.io/docs/concepts/security/pod-security-standards/
    chapter: 05-security/09-running-security-on-a-platform-team.md
    expires: 2027-10-31

  - namespace: p05-09-too-long
    level: baseline
    reason: >-
      The Part 05 registry lab applies this namespace at baseline with an expiry
      more than 365 days out, to show that the admission rule refuses it. The
      rule refuses it, so it is never created. It is registered because the
      chapter's manifest labels it baseline and the registry gate reads that
      label.
    upstream: https://kubernetes.io/docs/concepts/security/pod-security-standards/
    chapter: 05-security/09-running-security-on-a-platform-team.md
    expires: 2027-10-31

  - namespace: p05-capstone
    level: privileged
    reason: >-
      The Part 05 capstone applies a deliberately weak Bookstore overlay to this
      namespace, so that the foothold Pod and the borrowed Pod the attack chain
      needs are admitted. The namespace is privileged in the vulnerable phase
      only. The hardened overlay does not apply that label, and the base's
      restricted label stands. The lab script deletes the namespace at the end.
    upstream: https://kubernetes.io/docs/concepts/security/pod-security-standards/
    chapter: 05-security/10-capstone-attack-and-harden-the-bookstore.md
    expires: 2027-10-31

  - namespace: p05-capstone-bench
    level: privileged
    reason: >-
      The capstone runs kube-bench once, as a Job in this namespace. Its
      upstream manifest sets hostPID and mounts hostPath directories, which
      baseline forbids, so only privileged admits the Job. The lab script
      deletes the namespace at the end.
    upstream: https://github.com/aquasecurity/kube-bench/blob/main/job.yaml
    chapter: 05-security/10-capstone-attack-and-harden-the-bookstore.md
    expires: 2027-10-31

  - namespace: kubeflow
    level: baseline
    reason: >-
      The pinned Kubeflow Training Operator release (v1.9.4) runs its controller
      image as UID 0 (the image configuration records User 0), and its Deployment
      sets no runAsNonRoot, seccompProfile or capability drop. The restricted
      profile refuses the Pod as shipped, which the chapter shows with a dry
      run, and the baseline profile admits it. The namespace keeps audit and
      warn at restricted. The exception ends once a non-root run of the image is
      verified.
    upstream: https://github.com/kubeflow/training-operator/blob/v1.9.4/manifests/base/deployment.yaml
    chapter: 12-kubernetes-for-machine-learning/04-distributed-training.md
    expires: 2027-04-30

  - namespace: pss-check-baseline
    level: baseline
    reason: >-
      A throwaway namespace for the step 1 server dry run that asks whether the
      baseline profile admits the Training Operator's Pod. The chapter deletes it
      after the check. It exists so the dry run can show what baseline admits.
    upstream: https://kubernetes.io/docs/concepts/security/pod-security-standards/#baseline
    chapter: 12-kubernetes-for-machine-learning/04-distributed-training.md
    expires: 2027-04-30
