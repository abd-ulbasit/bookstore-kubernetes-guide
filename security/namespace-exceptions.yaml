# The namespace half of the exceptions registry (docs/design/2026-10-29-security-first-rewrite.md,
# section 5.4). The scanner half is .trivyignore.yaml at the repository root.
#
# Every namespace the guide labels above `restricted` (baseline or privileged, in
# any of enforce, audit or warn) has one entry here, and every entry must still
# be in use: `make gates-registry` checks both directions. Each entry has:
#
#   namespace  the namespace name
#   level      baseline or privileged: the most permissive level the guide sets on it
#   reason     why the component or lab cannot run under restricted
#   upstream   the upstream document that demands the privilege, or the Pod
#              Security Standards page for a lab that shows it on purpose
#   chapter    the chapter that explains the exception, relative to full-guide/
#   expires    YYYY-MM-DD; still ahead, and no more than 12 months out

exceptions:
  - namespace: falco
    level: privileged
    reason: >-
      The Falco DaemonSet mounts host paths, among them the runtime sockets,
      and restricted and baseline both forbid hostPath. The chapter's Terraform
      sets the chart's least-privileged mode (driver.modernEbpf.leastPrivileged),
      which drops privileged and adds CAP_BPF, CAP_PERFMON, CAP_SYS_RESOURCE and
      CAP_SYS_PTRACE. The host paths still need the privileged level. Falco is
      one of two privileged namespaces in the bookstore-platform Terraform tree;
      the other is kube-system, for Cilium.
    upstream: https://falco.org/docs/concepts/event-sources/kernel/
    chapter: 14-eks-in-production-a-to-z/13-runtime-defense-and-container-security.md
    expires: 2027-06-30

  - namespace: node-logs
    level: privileged
    reason: >-
      The chapter's log agent reads the node's pod log directory, /var/log/pods,
      through a hostPath volume. The Pod Security Standards forbid hostPath at
      baseline, and the restricted profile does not list it among its allowed
      volume types, so only privileged admits the agent. The namespace holds that
      one agent and keeps audit and warn at restricted. The chapter deletes it at
      the end of the lab.
    upstream: https://kubernetes.io/docs/concepts/security/pod-security-standards/#baseline
    chapter: 01-core-workloads/06-daemonsets.md
    expires: 2027-06-30

  - namespace: psa-lab
    level: privileged
    reason: >-
      The Part 05 Pod Security lab runs deliberately insecure Pods in a throwaway
      kind namespace to show what the privileged profile allows. The lab script
      creates the namespace, labels it and deletes it at the end.
    upstream: https://kubernetes.io/docs/concepts/security/pod-security-standards/
    chapter: 05-security/02-pod-security.md
    expires: 2027-06-30

  - namespace: kube-system
    level: privileged
    reason: >-
      The Cilium agent DaemonSet uses host networking, hostPath mounts,
      capabilities such as NET_ADMIN and SYS_ADMIN, and Unconfined seccomp and
      AppArmor profiles in the chart's default render. The baseline level forbids
      each of these, so the namespace carries the privileged level. The Cilium
      operator shares the namespace and runs with hostNetwork by chart default.
      This is the second privileged namespace in the bookstore-platform tree;
      falco is the other.
    upstream: https://kubernetes.io/docs/concepts/security/pod-security-standards/
    chapter: 14-eks-in-production-a-to-z/15-cilium-ebpf-on-eks.md
    expires: 2027-06-30

  - namespace: monitoring
    level: privileged
    reason: >-
      The kube-prometheus-stack node-exporter DaemonSet reads host metrics
      through hostNetwork and hostPath volumes for /proc, /sys and the root
      filesystem, and baseline forbids both. The chapter turns off the shared
      host PID namespace, keeps only those host mounts, and labels warn and
      audit restricted, so the dry run names node-exporter alone.
    upstream: https://kubernetes.io/docs/concepts/security/pod-security-standards/
    chapter: 06-production-readiness/01-observability-metrics.md
    expires: 2027-10-31
  - namespace: crossplane-system
    level: baseline
    reason: >-
      The Crossplane chart's pods, and the default pod template Crossplane gives
      the provider and function pods it runs here, set no seccomp profile and do
      not drop all capabilities. The restricted profile rejects that; baseline
      admits it, since no pod is privileged or uses a host namespace. Audit and
      warn stay at restricted to show the gap.
    upstream: https://github.com/crossplane/crossplane/blob/v2.4.3/internal/controller/pkg/runtime/runtime.go
    chapter: 13-grand-capstone-bookstore-platform/02-tenancy-and-crossplane-onboarding.md
    expires: 2027-06-30


  - namespace: p13-02-crossplane
    level: baseline
    reason: >-
      The captured run for 13.02 labelled a stand-in for crossplane-system, the
      namespace this chapter's Crossplane install uses, at the same levels. The
      run deleted it at the end, and the transcript records the substitution.
      The reason is the one given for crossplane-system.
    upstream: https://github.com/crossplane/crossplane/blob/v2.4.3/internal/controller/pkg/runtime/runtime.go
    chapter: 13-grand-capstone-bookstore-platform/02-tenancy-and-crossplane-onboarding.md
    expires: 2027-06-30

