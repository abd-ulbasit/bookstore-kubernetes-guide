# The scanner half of the exceptions registry (docs/design/2026-10-29-security-first-rewrite.md,
# section 5.4). The namespace half is security/namespace-exceptions.yaml.
#
# One entry per scanner finding the guide accepts, grouped by section:
# misconfigurations, vulnerabilities, secrets, licenses. Each entry has:
#
#   id          the check or advisory ID, for example KSV-0017 or CVE-2026-12345
#   paths       the files it covers, as globs relative to the repository root
#               (`*` stays in one directory, `**` crosses them). A chapter block
#               is named full-guide/<chapter>. A rendered Helm chart or Kustomize
#               overlay is named by its directory.
#   statement   why the finding is accepted, with an upstream citation where
#               the upstream project demands the privilege
#   expired_at  YYYY-MM-DD; still ahead, and no more than 12 months out
#
# Example:
#
#   misconfigurations:
#     - id: KSV-0017
#       paths:
#         - full-guide/examples/bookstore-platform/node-agent/**
#       statement: the agent reads host files by design; see the chapter and upstream docs
#       expired_at: 2027-06-30
#
# Trivy v0.76.1 does not load this file on its own and marks the feature
# experimental, so the gates read it themselves:
#
#   make gates-static     drops a finding only for a sound, unexpired entry
#   make gates-registry   fails on an entry that is unsound, expired, more than
#                         12 months out, or that matches no finding any more
#
# An unsound entry grants nothing. Inline `trivy:ignore` comments and other
# Trivy ignore files are failures: this file is the only place to accept a finding.

misconfigurations:
  # Break-glass platform RBAC, accepted by design: chapter 13.01 and
  # SECURITY-SCAN.md section 1.3. The regions overlays build on platform-base.
  - id: KSV-0041
    paths:
      - full-guide/examples/bookstore-platform/platform-base/01-rbac.yaml
      - full-guide/examples/bookstore-platform/kustomize/regions/ap-southeast
      - full-guide/examples/bookstore-platform/kustomize/regions/eu-west
      - full-guide/examples/bookstore-platform/kustomize/regions/us-east
    statement: "Platform roles that can manage Secrets, accepted by design (chapter 13.01, SECURITY-SCAN.md section 1.3). bookstore-platform-operator reads and writes Secrets for platform work, and bookstore-platform-tenant-admin reads them only in its own namespace, because the Composition binds it per tenant. The file ships ClusterRoles only, so the blast radius is set by each binding and by the break-glass process in 13.12."
    expired_at: 2027-06-30
  - id: KSV-0044
    paths:
      - full-guide/examples/bookstore-platform/platform-base/01-rbac.yaml
      - full-guide/examples/bookstore-platform/kustomize/regions/ap-southeast
      - full-guide/examples/bookstore-platform/kustomize/regions/eu-west
      - full-guide/examples/bookstore-platform/kustomize/regions/us-east
    statement: "Break-glass platform RBAC, accepted by design (chapter 13.01, SECURITY-SCAN.md section 1.3). bookstore-platform-admin is a cluster wildcard as strong as cluster-admin. The file ships ClusterRoles only, so the blast radius is set by each binding and by the break-glass process in 13.12."
    expired_at: 2027-06-30
  - id: KSV-0045
    paths:
      - full-guide/examples/bookstore-platform/platform-base/01-rbac.yaml
      - full-guide/examples/bookstore-platform/kustomize/regions/ap-southeast
      - full-guide/examples/bookstore-platform/kustomize/regions/eu-west
      - full-guide/examples/bookstore-platform/kustomize/regions/us-east
    statement: "Break-glass platform RBAC, accepted by design (chapter 13.01, SECURITY-SCAN.md section 1.3). bookstore-platform-tenant-admin grants wildcard verbs on workloads and Services, and the Composition binds it only inside each tenant namespace. The file ships ClusterRoles only, so the blast radius is set by each binding and by the break-glass process in 13.12."
    expired_at: 2027-06-30
  - id: KSV-0046
    paths:
      - full-guide/examples/bookstore-platform/platform-base/01-rbac.yaml
      - full-guide/examples/bookstore-platform/kustomize/regions/ap-southeast
      - full-guide/examples/bookstore-platform/kustomize/regions/eu-west
      - full-guide/examples/bookstore-platform/kustomize/regions/us-east
    statement: "Break-glass platform RBAC, accepted by design (chapter 13.01, SECURITY-SCAN.md section 1.3). bookstore-platform-admin manages all resources, as a break-glass role must, and bookstore-platform-operator reads every resource and manages the Crossplane API groups. The file ships ClusterRoles only, so the blast radius is set by each binding and by the break-glass process in 13.12."
    expired_at: 2027-06-30
  - id: KSV-0056
    paths:
      - full-guide/examples/bookstore-platform/platform-base/01-rbac.yaml
      - full-guide/examples/bookstore-platform/kustomize/regions/ap-southeast
      - full-guide/examples/bookstore-platform/kustomize/regions/eu-west
      - full-guide/examples/bookstore-platform/kustomize/regions/us-east
    statement: "Break-glass platform RBAC, accepted by design (chapter 13.01, SECURITY-SCAN.md section 1.3). bookstore-platform-operator writes Services, and bookstore-platform-tenant-admin manages Services inside its own tenant namespace. The file ships ClusterRoles only, so the blast radius is set by each binding and by the break-glass process in 13.12."
    expired_at: 2027-06-30
  # The operator manager role creates the Services of each tenant it reconciles,
  # so it writes services. It holds no secrets rule (see the file header).
  - id: KSV-0056
    paths:
      - full-guide/examples/bookstore/operator/config/rbac/role.yaml
      - full-guide/examples/bookstore/operator/config/default
    statement: "The operator manager ClusterRole writes Services because it creates the child kinds of each BookstoreTenant, Services among them (header of operator/config/rbac/role.yaml, Part 08 ch.05). It grants no Secrets and no wildcards, so the finding is the reconciler's own scope, accepted by design."
    expired_at: 2027-06-30
  # The second-tenant example is a worked tenant Role, namespaced to tenant-acme.
  # Its Role grants no exec (KSV-0053 is fixed in the manifest, not accepted).
  - id: KSV-0056
    paths:
      - full-guide/examples/bookstore/operators/second-tenant.yaml
    statement: "The tenant admin Role creates and edits Services in tenant-acme, because a tenant exposes its own workloads (chapter 08.04). It grants no write on endpoints, endpointslices, NetworkPolicies or Ingresses, and a Service selects only Pods in its own namespace, so the networking reach stops at tenant-acme."
    expired_at: 2027-06-30
  # The provider's ClusterRole writes NetworkPolicies in each tenant namespace
  # (chapter 11.10, Threats and controls, E10). Trivy flags the write verbs.
  - id: KSV-0056
    paths:
      - full-guide/11-advanced-production-patterns/10-platform-engineering.md
    statement: "The provider writes NetworkPolicies to create, correct and heal the default-deny policy that each tenant namespace receives. RBAC cannot name the policies it may write, because create takes no name, so the write verbs stay. The write reaches every namespace, so the blast radius is set by the ClusterRole in step 1 of the chapter and by the admission policy that chapter 05.07 teaches."
    expired_at: 2027-06-30
  # The Backstage ConfigMap holds only ${ENV} references; ESO supplies the values.
  - id: KSV-0109
    paths:
      - full-guide/examples/bookstore-platform/backstage/app-config.yaml
    statement: "The ConfigMap names secret keys (Keycloak, GitHub App, Argo CD and PagerDuty tokens) but holds only ${ENV_VAR} references. External Secrets materialises the values at runtime, so no credential is committed (chapter 13.11, SECURITY-SCAN.md section 1.3)."
    expired_at: 2027-06-30
  # The provider ClusterRole for the tenant Composition (13.02, section 1).
  - id: KSV-0056
    paths:
      - full-guide/13-grand-capstone-bookstore-platform/02-tenancy-and-crossplane-onboarding.md
    statement: "The provider ClusterRole writes NetworkPolicies, which the Composition stamps as each tenant's default-deny policy (chapter 13.02, section 1). KSV-0056 flags write access to networking objects. The grant leaves out services, endpoints, endpointslices and ingresses, and it is cluster-wide because the provider creates the tenant namespaces. The Kubernetes network policy reference: https://kubernetes.io/docs/concepts/services-networking/network-policies/"
    expired_at: 2027-06-30
  # The fleet deployer Role in 11.06 writes the Services, NetworkPolicies and
  # Ingresses that the Bookstore base ships, so a deployer must change them.
  - id: KSV-0056
    paths:
      - full-guide/11-advanced-production-patterns/06-multi-cluster-and-fleet.md
    statement: "The fleet deployer Role in chapter 11.06 writes the Services, NetworkPolicies and Ingresses that the Bookstore base ships, so the deployer must be able to change them. The Role is bound to one member identity in the bookstore namespace only, and that identity's token lasts 24 hours (S8 in THREAT-MODEL.md). A reviewer checks the rendered overlay in Git before each sync (T3)."
    expired_at: 2027-06-30
  # The Training Operator overlay (ch.04 step 1) builds the pinned upstream v1.9.4
  # release. Its controller runs as UID 0 and its Deployment sets no
  # runAsNonRoot, read-only root, seccomp profile, capability drop or default
  # security context, which is why the kubeflow namespace is registered at
  # baseline in security/namespace-exceptions.yaml. Its ClusterRole reads and
  # manages Secrets, exec into Pods, networking and webhook configurations across
  # namespaces. Chapter 04 step 1 prints those rules before the install.
  - id: KSV-0012
    paths:
      - full-guide/examples/bookstore/ml/train/operators/training-operator
    statement: "Training Operator v1.9.4 runs its controller as UID 0 as shipped (its image records User 0), so the Deployment cannot declare runAsNonRoot. Accepted for the pinned release under the kubeflow exception; the chapter shows the refusal in a dry run and ends the exception once a non-root run is verified (chapter 12.04 step 1)."
    expired_at: 2027-04-30
  - id: KSV-0014
    paths:
      - full-guide/examples/bookstore/ml/train/operators/training-operator
    statement: "Training Operator v1.9.4 does not set readOnlyRootFilesystem on its controller container. Accepted for the pinned release under the kubeflow exception (chapter 12.04 step 1); a non-root, read-only run is the next step once verified."
    expired_at: 2027-04-30
  - id: KSV-0003
    paths:
      - full-guide/examples/bookstore/ml/train/operators/training-operator
    statement: "Training Operator v1.9.4 keeps the default capability set on its controller container. Accepted for the pinned release under the kubeflow exception (chapter 12.04 step 1)."
    expired_at: 2027-04-30
  - id: KSV-0030
    paths:
      - full-guide/examples/bookstore/ml/train/operators/training-operator
    statement: "Training Operator v1.9.4 sets no seccomp profile on its controller Pod. Accepted for the pinned release under the kubeflow exception (chapter 12.04 step 1)."
    expired_at: 2027-04-30
  - id: KSV-0118
    paths:
      - full-guide/examples/bookstore/ml/train/operators/training-operator
    statement: "Training Operator v1.9.4 sets no default security context on its Pod. Accepted for the pinned release under the kubeflow exception (chapter 12.04 step 1)."
    expired_at: 2027-04-30
